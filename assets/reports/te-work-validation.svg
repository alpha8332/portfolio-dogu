<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Validation / verify a contract at each execution boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Validation / verify a contract at each execution boundary</text><rect x="30" y="90" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1  Time alignment</text><text x="44" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q1 offset1 = 2, q2 offset0 = 10</text><text x="44" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mean at target2 = 6; not mean of two offset0 values</text><path d="M590 185V207" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="207" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="233" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2  Rotation</text><text x="44" y="259" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mean of I and Rz90</text><text x="44" y="280" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RᵀR ≈ I and det(R) ≈ 1, after projection</text><path d="M590 302V324" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="324" width="1120" height="95" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="350" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3  Event semantics</text><text x="44" y="376" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">old close=0 / fresh open=1000</text><text x="44" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Event=0; hand joint angles still average</text><path d="M590 419V441" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="441" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="467" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4  Worker path</text><text x="44" y="493" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stub executor / two worker steps</text><text x="44" y="514" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Two fresh queries; two overlapping sources; command built</text><path d="M590 536V558" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="558" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="584" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">5  State contract</text><text x="44" y="610" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Settings / preset / guard fixtures</text><text x="44" y="631" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Round-trip fields; reject non-ACT, RTC and horizon&lt;2</text><path d="M590 653V675" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="675" width="1120" height="95" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="701" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">6  Physical observation</text><text x="44" y="727" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Bimanual handover execution</text><text x="44" y="748" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Missed grasp → edge-selection fix → gripper issue resolved</text><text x="35" y="835" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Fixture values establish algorithm and integration behavior. They are not hardware pose/force measurements.</text><text x="35" y="880" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">A/B task metrics belong to the experiment record: same checkpoint, matched initial conditions, TE off/on.</text></svg>