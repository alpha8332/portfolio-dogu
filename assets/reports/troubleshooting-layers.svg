<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title"><title id="title">Troubleshooting / Locate the Broken Boundary</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8caabb"/></marker></defs><rect width="1000" height="550" fill="#141a1e"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#dbe5eb}.label{fill:#85c9ed;font-size:13px}.detail{fill:#9db0bb;font-size:13px}.head{font-size:17px;font-weight:600}</style><text x="32" y="40" font-size="22" font-weight="600">Troubleshooting / Locate the Broken Boundary</text><text x="32" y="98" class="label">DEVICE</text><rect x="190" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="100" class="head">Discovered</text><text x="204" y="154" class="detail">catalog / physical connection</text><rect x="450" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="100" class="head">Fresh input</text><text x="464" y="154" class="detail">open / active / valid / timestamp</text><path d="M425 122 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="72" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="100" class="head">Interpreted target</text><text x="724" y="154" class="detail">binding / coordinates / owner</text><path d="M685 122 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="238" class="label">CONTROL</text><rect x="190" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="240" class="head">Backend intent</text><text x="204" y="294" class="detail">stored mode / selected robot</text><rect x="450" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="240" class="head">Live robot state</text><text x="464" y="294" class="detail">op_state / readiness</text><path d="M425 262 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="212" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="240" class="head">Accepted command</text><text x="724" y="294" class="detail">correct worker / EE</text><path d="M685 262 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="378" class="label">DATA</text><rect x="190" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="380" class="head">Selected source</text><text x="204" y="434" class="detail">episode / media lineage</text><rect x="450" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="380" class="head">Materialized schema</text><text x="464" y="434" class="detail">actual converted keys</text><path d="M425 402 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="352" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="380" class="head">Model / live contract</text><text x="724" y="434" class="detail">dimensions + semantics</text><path d="M685 402 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><line x1="32" y1="498" x2="968" y2="498" stroke="#34434c"/><text x="32" y="525" class="detail">같은 증상이라도 끊긴 계층이 다르므로 정상 경로와 비교해 관찰 위치를 좁힌다.</text></svg>