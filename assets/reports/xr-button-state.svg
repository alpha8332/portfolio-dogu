<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Button action / edge semantics, task context and robot mode</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Button action / edge semantics, task context and robot mode</text><rect x="30" y="75" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical click → normalized primary / secondary → rising edge</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A/X and B/Y aliases → mapping params → one event per press, not one event per polling tick</text><path d="M590 155V200" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280" y="200" width="620" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="226" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend app-action bridge</text><text x="294" y="252" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">button event carries intent; app service owns current task and mode transition</text><path d="M590 290V320H190V365" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 290V320H590V365" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 290V320H1000V365" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="365" width="330" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="391" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">collect_start</text><text x="44" y="417" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">use Data Collection current task</text><text x="44" y="438" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">run capture preflight</text><text x="44" y="459" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve current robot mode</text><text x="44" y="480" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">legacy task override is compatibility only</text><rect x="420" y="365" width="340" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="391" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">collect_stop</text><text x="434" y="417" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">stop collection</text><text x="434" y="438" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">retain existing safety cleanup</text><text x="434" y="459" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">collect-session robots → Idle</text><text x="434" y="480" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not merely a recording flag update</text><rect x="820" y="365" width="330" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="391" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">robot mode action</text><text x="834" y="417" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_idle: TeleT → Idle</text><text x="834" y="438" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_task_teleop: Idle → TeleT</text><text x="834" y="459" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inspect live op-state too</text><text x="834" y="480" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ignore disallowed transitions</text><rect x="30" y="590" width="1120" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Historical failure chain</text><text x="44" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Button handler lived only inside the TeleT motion loop → Idle clicks never reached app actions.</text><text x="44" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">2. Stored mode said Idle while live op-state was TeleT → stop path could be treated as a no-op.</text><text x="44" y="684" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fix: independent button polling + live-state-aware transition; motion still requires TeleT.</text><text x="30" y="790" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate capability gates: reading a button in Idle does not authorize pose motion in Idle.</text></svg>