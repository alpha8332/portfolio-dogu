<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 940" width="1180" height="940" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">XR jog / separate pose and rate paths, combined into one target</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">XR jog / separate pose and rate paths, combined into one target</text><rect x="35" y="75" width="495" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose gate state</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">active: current/reference pose</text><text x="49" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">calibrated p_pose and R_pose</text><rect x="655" y="75" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stick mapping enabled</text><text x="669" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">x/y input → robot x/y/z or None</text><text x="669" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">deadzone rescale → velocity × Δt</text><rect x="655" y="260" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Jog offset accumulator o</text><text x="669" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">two stick axes mapped by 3×2 matrix A</text><text x="669" y="333" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">positive input → positive robot-base axis</text><path d="M900 175V260" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="260" width="495" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose gate inactive + mapped stick</text><text x="49" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">seed from CURRENT robot pose</text><text x="49" y="333" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task TeleMove is still required</text><rect x="35" y="465" width="1110" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute target composition</text><text x="49" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_cmd = p_pose + o | R_cmd = R_pose | final output [mm, degree]</text><path d="M280 175V260" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="295" y="230" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">inactive + stick</text><path d="M280 370V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M900 370V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M530 125H590V425H420V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="545" y="407" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">active pose</text><rect x="35" y="660" width="495" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Activation / stick start</text><text x="49" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reset accumulator and sample-clock state</text><text x="49" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">first or non-increasing time → control period</text><text x="49" y="754" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">positive time difference capped at 0.25 s</text><rect x="655" y="660" width="490" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Moving stick → neutral</text><text x="669" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reset offset; read current robot pose</text><text x="669" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">re-anchor robot base AND controller reference</text><text x="669" y="754" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">avoid adding old offset twice</text><path d="M280 565V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M900 565V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="860" fill="#eab67e" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose input is relative displacement; stick is an integrated rate. They cannot share one undifferentiated gate.</text></svg>