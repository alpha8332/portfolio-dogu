<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1050" width="1180" height="1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Usability support / the operator closes the physical control loop</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Usability support / the operator closes the physical control loop</text><rect x="25" y="70" width="1130" height="220" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PREPARATION / support responsibilities</text><rect x="45" y="115" width="325" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Task and starting condition</text><text x="59" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explain the intended operation</text><text x="59" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare material / grasp locations</text><text x="59" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check initial robot and tool state</text><rect x="425" y="115" width="325" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input and robot setup</text><text x="439" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Device input / calibration / binding</text><text x="439" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm and end-tool correspondence</text><text x="439" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Control mode / live status</text><rect x="810" y="115" width="325" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Measurement readiness</text><text x="824" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Work label + device / setting</text><text x="824" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Time field and Trial field</text><text x="824" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reset / fault observations kept distinct</text><path d="M370 175H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 175H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="340" width="1130" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="365" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LIVE HUMAN–DEVICE–ROBOT LOOP</text><rect x="45" y="390" width="230" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Participant / operator</text><text x="59" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand input and buttons</text><text x="59" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe the material</text><text x="59" y="484" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Choose the next motion</text><rect x="325" y="390" width="230" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input device</text><text x="339" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive / PIKA / SpaceMouse</text><text x="339" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Different input semantics</text><text x="339" y="484" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not interchangeable signals</text><rect x="605" y="390" width="240" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX + controller</text><text x="619" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reference / mode / owner</text><text x="619" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm target + EE command</text><text x="619" y="484" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured state feedback</text><rect x="895" y="390" width="240" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="909" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arms + material</text><text x="909" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp / tension / regrasp</text><text x="909" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cloth or rope changes shape</text><text x="909" y="484" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Contact changes the task</text><path d="M275 445H325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 445H605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M845 445H895" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1015 500V570H160V500" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="425" y="560" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">visual feedback → next operator action</text><rect x="325" y="610" width="520" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="636" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Support observation across the chain</text><text x="339" y="662" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">User action ≠ valid input ≠ actual motion ≠ completed manipulation</text><rect x="45" y="765" width="510" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="791" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded observations</text><text x="59" y="817" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Time: task execution time [s]</text><text x="59" y="838" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Trial: attempts until success [count]</text><text x="59" y="859" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task / device / setting / relevant operating context</text><text x="59" y="880" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep an equipment interruption distinct from task difficulty</text><rect x="625" y="765" width="510" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="791" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Evaluation analysis / POSCO</text><text x="639" y="817" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Receive operating and measurement records</text><text x="639" y="838" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpret task and interface suitability</text><text x="639" y="859" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Participant allocation / order / success criteria matter</text><text x="639" y="880" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Support role does not imply ownership of final analysis</text><path d="M585 675V725H300V765" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 835H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="560" y="820" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">handoff</text><path d="M1125 765H1165V315H970V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="980" y="307" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">setup feedback</text><text x="45" y="990" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Responsibility and information flow reconstructed from the work record; no participant identities or private system addresses are shown.</text></svg>