<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Artifact lineage / keep raw evidence and make every learning choice explicit</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Artifact lineage / keep raw evidence and make every learning choice explicit</text><rect x="35" y="70" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw source / HDF5 + MP4 + episode metadata</text><text x="49" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">immutable state, command, camera and session context</text><rect x="645" y="70" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">DatasetCuration / separate artifact</text><text x="659" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">exclude / keep range / trim / quarantine / note</text><path d="M535 115H645" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="560" y="103" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">inspect</text><rect x="250" y="230" width="680" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">DatasetSelection + PreprocessSpec</text><text x="264" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source IDs + curation ID / crop_enabled + bounds / resize</text><text x="264" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">observation and action keys / relative or absolute / label rules</text><path d="M285 165V200H480V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M895 165V200H700V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="250" y="395" width="680" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conversion + readiness</text><text x="264" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw → canonical keys / camera + robot order / units and representation</text><text x="264" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">usable samples / missing data / horizon padding</text><path d="M590 325V395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="560" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training run / native policy</text><text x="49" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">family + provider + recipe + provider_config</text><text x="49" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">manifest binds data selection and preprocessing</text><rect x="645" y="560" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Export job / separate consumer format</text><text x="659" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">format + video storage policy + output artifact</text><text x="659" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not an implicit replacement for the Training contract</text><path d="M590 490V520H285V560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 520H895V560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="735" width="500" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint + ModelContract</text><text x="49" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weights / normalization / IO / camera order</text><text x="49" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot-hand ownership + action execution settings</text><path d="M285 655V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="645" y="735" width="500" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Current deployment contract</text><text x="659" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">live robot + camera + gripper / hand + family support</text><text x="659" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ready / warn / blocked and reasons</text><path d="M535 785H645" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="565" y="773" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">compare</text><rect x="250" y="905" width="680" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="931" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live inference / semantic action split → owner-resolved dispatch</text><path d="M895 840V875H590V905" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>