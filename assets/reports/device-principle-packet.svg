<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1030" width="1180" height="1030" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">SpaceMouse / packet, semantic axes and stateful control</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">SpaceMouse / packet, semantic axes and stateful control</text><text x="35" y="90" fill="#80d0f5" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">AXIS REPORT / supported adapter layout</text><rect x="35" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">ID</text><rect x="119" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="133" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b1</text><rect x="203" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="217" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b2</text><rect x="287" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="301" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b3</text><rect x="371" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="385" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b4</text><rect x="455" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="469" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b5</text><rect x="539" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="553" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b6</text><rect x="623" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="637" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b7</text><rect x="707" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="721" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b8</text><rect x="791" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="805" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b9</text><rect x="875" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="889" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b10</text><rect x="959" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="973" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b11</text><rect x="1043" y="120" width="78" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="1057" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">b12</text><path d="M119 195H281" fill="none" stroke="#80d0f5" stroke-width="2"/><text x="169" y="225" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">x</text><path d="M287 195H449" fill="none" stroke="#80d0f5" stroke-width="2"/><text x="337" y="225" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">y</text><path d="M455 195H617" fill="none" stroke="#80d0f5" stroke-width="2"/><text x="505" y="225" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">z</text><path d="M623 195H785" fill="none" stroke="#80d0f5" stroke-width="2"/><text x="673" y="225" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">roll</text><path d="M791 195H953" fill="none" stroke="#80d0f5" stroke-width="2"/><text x="841" y="225" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">pitch</text><path d="M959 195H1121" fill="none" stroke="#80d0f5" stroke-width="2"/><text x="1009" y="225" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">yaw</text><rect x="35" y="275" width="525" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Signed16 decoding → normalize</text><text x="49" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">little-endian pair → signed integer</text><text x="49" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clip(raw, −350, 350) / 350</text><rect x="615" y="275" width="525" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="629" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Button report → bit state</text><text x="629" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">left / right, independent packet updates</text><text x="629" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no axis packet → zero axes for this read</text><path d="M300 235V275" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="650" y="260" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SEPARATE BUTTON REPORT</text><rect x="35" y="450" width="330" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw mode mask M</text><text x="49" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A: xyz enabled</text><text x="49" y="523" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">B: roll / pitch / yaw enabled</text><rect x="425" y="450" width="330" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Signed mapping P</text><text x="439" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source selection + inversion</text><text x="439" y="523" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">a_mapped = P M a</text><rect x="815" y="450" width="325" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deadzone + scale</text><text x="829" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normalized input → velocity</text><text x="829" y="523" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">mm/s and rad/s</text><path d="M290 375V410H200V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M365 505H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M755 505H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="635" width="1105" height="290" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="660" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">STATEFUL / every binding has a separate base, accumulator and sample clock</text><rect x="55" y="690" width="300" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="716" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">First timestamp</text><text x="69" y="742" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">record time only</text><text x="69" y="763" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no displacement update</text><rect x="425" y="690" width="300" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="716" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Positive Δt</text><text x="439" y="742" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">cap at 0.25 s</text><text x="439" y="763" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">update virtual o and V</text><rect x="795" y="690" width="325" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="716" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Active → neutral</text><text x="809" y="742" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reset virtual transform</text><text x="809" y="763" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">re-anchor at measured robot pose</text><path d="M355 738H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="370" y="719" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next</text><path d="M725 738H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="742" y="719" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">release</text><text x="55" y="860" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Order matters: a raw rotation channel masked out by A cannot reappear through a later axis remap.</text><text x="35" y="980" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Byte diagram and state transitions are explanatory; no private device identity or measured trace is shown.</text></svg>