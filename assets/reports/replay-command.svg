<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" width="1180" height="740" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Start alignment / maintaining the target is different from observing it</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Start alignment / maintaining the target is different from observing it</text><text x="30" y="95" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">Before / one command, then polling only</text><rect x="35" y="135" width="200" height="70" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="49" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command</text><text x="49" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">start target</text><rect x="260" y="135" width="200" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="274" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling</text><text x="274" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q / qdot / op-state</text><rect x="485" y="135" width="200" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="499" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling</text><text x="499" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q / qdot / op-state</text><rect x="710" y="135" width="200" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="724" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling</text><text x="724" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q / qdot / op-state</text><rect x="935" y="135" width="200" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="949" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling</text><text x="949" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q / qdot / op-state</text><text x="30" y="245" fill="#eab67e" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Observed failure: brief motion → stop before target. More polling cannot keep an absolute move target active.</text><text x="30" y="330" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">After / same target reissued while readback checks completion</text><rect x="35" y="375" width="200" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="49" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same Command</text><text x="49" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same recorded q</text><text x="49" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">readback between pulses</text><rect x="260" y="375" width="200" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="274" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same Command</text><text x="274" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same recorded q</text><text x="274" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">readback between pulses</text><rect x="485" y="375" width="200" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="499" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same Command</text><text x="499" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same recorded q</text><text x="499" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">readback between pulses</text><rect x="710" y="375" width="200" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="724" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same Command</text><text x="724" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same recorded q</text><text x="724" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">readback between pulses</text><rect x="935" y="375" width="200" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="949" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same Command</text><text x="949" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same recorded q</text><text x="949" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">readback between pulses</text><rect x="30" y="510" width="525" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Target-maintenance cadence</text><text x="44" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same absolute movej target, not accumulated delta</text><text x="44" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">local pulse interval 0.1 s; polling interval 0.05 s</text><rect x="605" y="510" width="545" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Completion predicate</text><text x="619" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">joint error + motion-clear; velocity check when qdot exists</text><text x="619" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">condition must persist for the settle interval</text><text x="30" y="690" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Reference values describe this implementation; they are not universal safety limits or a collision-checking guarantee.</text></svg>