<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 990" width="1180" height="990" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Input diagnostics / compare the boundary before changing the next layer</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Input diagnostics / compare the boundary before changing the next layer</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Symptom: pose changes, input does not / or UI remains blank</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not reduce tracking validity, input availability and UI freshness to one connected flag</text><path d="M590 160V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="245" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Host runtime probe / without MiMicX HTTP or bridge</text><text x="44" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check pose validity, controller-state success, packet/axes/masks while physically moving and pressing controls</text><rect x="30" y="430" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host input available</text><text x="44" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect worker snapshot / controllers array</text><text x="44" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalize logical keys and empty-list behavior</text><text x="44" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Follow API payload to actual DOM updates</text><rect x="620" y="430" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host input unavailable</text><text x="634" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare legacy state and SteamVR Input actions</text><text x="634" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Manifest registration alone does not prove active input</text><text x="634" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Then investigate runtime/environment changes</text><path d="M295 340V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 340V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="655" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="681" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Earlier UI contract issue</text><text x="44" y="707" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input panel existed but values did not update</text><text x="44" y="728" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reconcile keys and sample-selection guards</text><text x="44" y="749" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Confirm UI changes during real manipulation</text><rect x="620" y="655" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="681" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Later June 2026 runtime regression</text><text x="634" y="707" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">NullHMD Linux / SteamVR 2.16.x: both input paths dead</text><text x="634" y="728" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input recovered on the tested pre-2.16 branch</text><text x="634" y="749" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Coexistence alone did not explain the incident</text><path d="M295 545V655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 545V655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="905" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">These were different incidents. A renderer fix cannot recover input that the host runtime is not delivering.</text></svg>