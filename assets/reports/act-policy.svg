<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">ACT / latent training path, visual policy and deployment boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT / latent training path, visual policy and deployment boundary</text><rect x="30" y="70" width="450" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING ONLY / infer demonstration style</text><rect x="50" y="120" width="190" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot state</text><text x="64" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">project state features</text><rect x="265" y="120" width="195" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="279" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Target chunk</text><text x="279" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action sequence + mask</text><rect x="50" y="245" width="410" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CVAE encoder</text><text x="64" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CLS + state + actions → μ, log σ² → sampled z</text><path d="M145 205V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M360 205V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="50" y="380" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">KL regularization against the latent prior</text><rect x="520" y="70" width="630" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="532" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">OBSERVATION / used in training and inference</text><rect x="540" y="120" width="285" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="554" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera observations</text><text x="554" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB → CNN feature maps</text><rect x="855" y="120" width="275" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="869" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot observations</text><text x="869" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">selected state → projection</text><rect x="540" y="260" width="590" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="554" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy input tokens</text><text x="554" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">image features + spatial position / robot state / latent z</text><path d="M682 205V260" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M992 205V260" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M460 290H540" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="493" y="281" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">z</text><rect x="50" y="455" 