 Gothic,sans-serif">reconstruction loss + weighted KL</text><path d="M540 638H460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="470" y="628" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">prediction</text><rect x="540" y="750" width="590" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="554" y="776" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">DEPLOY / action execution strategy</text><text x="554" y="802" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">queue drain OR fresh chunks → TE bank → semantic split</text><text x="554" y="823" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose restoration / hand–gripper dispatch / current device gates</text><path d="M835 680V750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="886" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Original ACT CVAE / Transformer principle: Zhao et al. (2023), Fig. 5. Platform execution and mixed-action handling are separate.</text></svg>