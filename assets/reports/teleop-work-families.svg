<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Three input semantics / illustrative target response</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Three input semantics / illustrative target response</text><rect x="40" y="70" width="520" height="445" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="52" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RATE INPUT</text><text x="60" y="135" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Input</text><text x="60" y="305" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot target position</text><path d="M105 245H510M105 245V155" fill="none" stroke="#47606e" stroke-width="2"/><path d="M105 455H510M105 455V330" fill="none" stroke="#47606e" stroke-width="2"/><path d="M105 245H175V185H380V245H510" fill="none" stroke="#80d0f5" stroke-width="3"/><text x="415" y="272" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">time →</text><rect x="620" y="70" width="520" height="445" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RELATIVE POSE INPUT</text><text x="640" y="135" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Input</text><text x="640" y="305" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot target position</text><path d="M685 245H1090M685 245V155" fill="none" stroke="#47606e" stroke-width="2"/><path d="M685 455H1090M685 455V330" fill="none" stroke="#47606e" stroke-width="2"/><path d="M685 245H755V185H960V245H1090" fill="none" stroke="#80d0f5" stroke-width="3"/><text x="995" y="272" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">time →</text><path d="M105 455H175L380 345H510" fill="none" stroke="#eab67e" stroke-width="3"/><path d="M685 455H755V365H960V455H1090" fill="none" stroke="#eab67e" stroke-width="3"/><text x="60" y="490" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Held axis → velocity persists → position keeps changing</text><text x="640" y="490" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Held displacement → the relative position target stays fixed</text><rect x="40" y="565" width="1100" height="265" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="52" y="590" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HAND GEOMETRY / NOT A COPY OF HUMAN JOINT ANGLES</text><circle cx="170" cy="645" r="8" fill="#80d0f5"/><path d="M310 760L170 645" fill="none" stroke="#80d0f5" stroke-width="2"/><circle cx="310" cy="645" r="8" fill="#80d0f5"/><path d="M310 760L310 645" fill="none" stroke="#80d0f5" stroke-width="2"/><circle cx="450" cy="645" r="8" fill="#80d0f5"/><path d="M310 760L450 645" fill="none" stroke="#80d0f5" stroke-width="2"/><path d="M170 645H450" fill="none" stroke="#eab67e" stroke-width="3"/><text x="80" y="615" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Human wrist-local tips / pair vectors</text><path d="M500 690H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="507" y="674" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">scaled geometry</text><rect x="650" y="635" width="430" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot hand FK + joint limits</text><text x="664" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Find joint targets that approximate the geometry</text><text x="664" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fixed morphology prevents exact copying</text><text x="55" y="870" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Concept plots show input semantics, not recorded motion or measured tracking accuracy.</text></svg>