<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Quest / Pico application / motion and app actions have different gates</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Quest / Pico application / motion and app actions have different gates</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Single OpenXR session owner / host or direct backend</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose / analog axes / click actions / interaction profile / focus → one runtime snapshot</text><path d="M590 160V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280" y="205" width="620" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="231" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Binding + target resolver</text><text x="294" y="257" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">selected robot / controller side / mapping params / fresh sample</text><path d="M590 295V325H180V370" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 295V325H590V370" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 295V325H1010V370" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="370" width="320" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="396" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose + thumbstick motion</text><text x="44" y="422" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TeleT execution gate</text><text x="44" y="443" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">squeeze-relative pose + jog</text><text x="44" y="464" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reference / units / dt</text><rect x="420" y="370" width="340" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="396" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Gripper input</text><text x="434" y="422" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">analog fraction / toggle / hold</text><text x="434" y="443" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">threshold + owner + native range</text><text x="434" y="464" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">separate from robot pose</text><rect x="830" y="370" width="320" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="844" y="396" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Button actions</text><text x="844" y="422" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rising edge; poll also in Idle</text><text x="844" y="443" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">collect or mode action</text><text x="844" y="464" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no robot movement by pose bypass</text><path d="M190 495V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 495V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M990 495V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="550" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot worker / client</text><text x="44" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">absolute task target</text><text x="44" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">controller state feedback</text><rect x="420" y="550" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Owned gripper dispatch</text><text x="434" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target + force / command state</text><text x="434" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">feeds capture stream</text><rect x="830" y="550" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="844" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime bridge → app service</text><text x="844" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current task / collect preflight</text><text x="844" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">live mode / safe stop</text><text x="30" y="735" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">The HW worker emits an app action through a registered bridge. It does not import FastAPI routes to start recording.</text><text x="30" y="785" fill="#eab67e" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">A pose-valid sample may still have inactive inputs. Focus, profile, axis and click availability remain separate checks.</text></svg>