<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1120" width="1180" height="1120" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">PikaSense start failure / partial migration across a callable adapter</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">PikaSense start failure / partial migration across a callable adapter</text><rect x="30" y="75" width="1120" height="260" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONTROL FLOW BEFORE THE ERROR</text><rect x="50" y="130" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI start</text><text x="64" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">freeze preview</text><text x="64" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">POST collect/start</text><text x="64" y="224" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">show error / return idle on failure</text><rect x="430" y="130" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend preparation</text><text x="444" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preflight / mode / metadata</text><text x="444" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">start session</text><text x="444" y="224" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">build capture selection</text><rect x="810" y="130" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend wrapper</text><text x="824" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">accepts capture_selection</text><text x="824" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">sidecar path or local fallback</text><path d="M370 190H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 190H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="395" width="1120" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="420" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HISTORICAL FAILURE / argument binding happens before the worker runs</text><rect x="50" y="455" width="500" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Local exported start function</text><text x="64" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">old signature lacks capture_selection</text><text x="64" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TypeError: unexpected keyword argument</text><text x="64" y="549" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">worker never begins producing capture frames</text><rect x="630" y="455" width="500" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Worker constructor already migrated</text><text x="644" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">accepts selection and filters streams</text><text x="644" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">but this code is not reached</text><text x="644" y="549" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normal pre-start preview does not contradict failure</text><path d="M970 250V365H300V455" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="490" y="355" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">local fallback + keyword</text><text x="55" y="635" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">The UI camera symptom is downstream of this call failure; it does not establish a USB disconnect.</text><rect x="30" y="725" width="1120" height="280" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="750" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FIX AND TEST THE REAL SEAM</text><rect x="50" y="790" width="500" height="140" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="64" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Current entrypoint</text><text x="64" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">accept selection explicitly</text><text x="64" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">forward to CaptureWorker</text><text x="64" y="884" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reuse backend capture logic</text><rect x="630" y="790" width="500" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Regression test boundary</text><text x="644" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">keep real wrapper / entrypoint</text><text x="644" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">replace only heavy hardware internals</text><text x="644" y="884" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">lambda **kwargs would hide the mismatch</text><path d="M550 860H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="510" y="770" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve real signature</text><text x="35" y="1070" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Adapter migration is complete only when every public call seam carries the same contract.</text></svg>