<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title"><title id="title">Imitation Learning / Demonstration to Rollout</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8caabb"/></marker></defs><rect width="1000" height="550" fill="#141a1e"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#dbe5eb}.label{fill:#85c9ed;font-size:13px}.detail{fill:#9db0bb;font-size:13px}.head{font-size:17px;font-weight:600}</style><text x="32" y="40" font-size="22" font-weight="600">Imitation Learning / Demonstration to Rollout</text><text x="32" y="98" class="label">DATA</text><rect x="190" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="100" class="head">Teleoperation demos</text><text x="204" y="154" class="detail">operator / robot / EE / camera</text><rect x="450" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="100" class="head">Recorded episodes</text><text x="464" y="154" class="detail">raw + timestamps + metadata</text><path d="M425 122 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="72" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="100" class="head">Inspect + select</text><text x="724" y="154" class="detail">valid data / task conditions</text><path d="M685 122 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="238" class="label">LEARNING</text><rect x="190" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="240" class="head">Training setup</text><text x="204" y="294" class="detail">model / selected IO / dataset</text><rect x="450" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="240" class="head">Training by named actor</text><text x="464" y="294" class="detail">self or research team</text><path d="M425 262 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="212" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="240" class="head">Checkpoint + contract</text><text x="724" y="294" class="detail">weights / transforms / ownership</text><path d="M685 262 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="378" class="label">ROLLOUT</text><rect x="190" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="380" class="head">Live observation</text><text x="204" y="434" class="detail">same input semantics / camera</text><rect x="450" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="380" class="head">Policy → robot commands</text><text x="464" y="434" class="detail">inference is not data Replay</text><path d="M425 402 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="352" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="380" class="head">Task observation</text><text x="724" y="434" class="detail">conditions / attempts / failures</text><path d="M685 402 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><line x1="32" y1="498" x2="968" y2="498" stroke="#34434c"/><text x="32" y="525" class="detail">각 단계의 수행자를 별도로 기록한다. SCDP 학습은 연구팀, 본인 연구 지원은 데이터 수집이다.</text></svg>