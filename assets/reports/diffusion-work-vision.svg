<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1120" width="1180" height="1120" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">RGB conditioning / one shared encoder, explicit camera and temporal order</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB conditioning / one shared encoder, explicit camera and temporal order</text><rect x="30" y="80" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-camera RGB key</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">B × T_o × 3 × H × W; uint8→float [0,1], optional crop and resize; W,H configuration becomes H,W tensor axes</text><rect x="30" y="245" width="1120" height="390" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="270" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SMALL_CNN / one set of weights is reused for all selected camera keys</text><rect x="50" y="300" width="300" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv stage 1</text><text x="64" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv2d 3→32, kernel5, stride2</text><text x="64" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ReLU</text><rect x="440" y="300" width="300" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv stage 2</text><text x="454" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv2d 32→64, kernel3, stride2</text><text x="454" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ReLU</text><rect x="830" y="300" width="300" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="844" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv stage 3</text><text x="844" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv2d 64→128, kernel3, stride2</text><text x="844" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ReLU</text><path d="M350 345H440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 345H830" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 165V300" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="490" width="1080" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pool + feature projection</text><text x="64" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Adaptive average pool(1,1) → flatten → Linear(128,F) → LayerNorm(F)</text><text x="64" y="563" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Encode B×T_o frames per camera; restore B × T_o × F</text><path d="M980 395V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="735" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Visual concatenation</text><text x="44" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">camera0 features | camera1 features | …</text><text x="44" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">B × T_o × (N×F)</text><text x="44" y="829" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Order follows checkpoint keys / camera contract</text><rect x="620" y="735" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Companion low-dimensional features</text><text x="634" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalize each state key, concatenate per timestep</text><text x="634" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">B × T_o × D_low</text><text x="634" y="829" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Single samples may be repeated to fit time axis</text><path d="M295 585V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="640" y="705" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected state keys / separate source</text><rect x="30" y="940" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="966" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Global condition c</text><text x="44" y="992" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Concatenate [lowdim, visual] per time → flatten history: B × [T_o(D_low + N F)]</text><text x="44" y="1013" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No camera-specific pretrained ResNet / spatial-softmax encoder is implied by this local architecture.</text><path d="M295 845V940" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 845V940" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>