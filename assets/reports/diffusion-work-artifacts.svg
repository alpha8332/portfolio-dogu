<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1020" width="1180" height="1020" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Checkpoint lineage / rebuild the same policy without re-reading UI state</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint lineage / rebuild the same policy without re-reading UI state</text><rect x="30" y="85" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolved training intent</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">diffusion / diffusion_nrmk / base diffusion_unet / resolved lowdim or RGB recipe</text><rect x="30" y="275" width="530" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Provider configuration</text><text x="44" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Horizon / observation and execution steps</text><text x="44" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Noise train and inference counts / epsilon predictor</text><text x="44" y="369" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Key order + shapes + normalizers</text><text x="44" y="390" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB encoder / feature dimension / image size</text><rect x="620" y="275" width="530" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dataset and execution identity</text><text x="634" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input / required input / output keys</text><text x="634" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera order + vision_contract</text><text x="634" y="369" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Control mode and action meaning</text><text x="634" y="390" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Training lineage / source selection</text><path d="M295 170V275" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 170V275" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="510" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Persist consistently</text><text x="44" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">policy_last.ckpt | metadata.json | run_manifest.json | resume_state.json | nested model_contract</text><text x="44" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Weights + statistics + configuration are consumed together; a model name alone is insufficient</text><path d="M295 410V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 410V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="720" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Load / reconstruct</text><text x="44" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalize legacy metadata fallbacks</text><text x="44" y="793" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Choose lowdim or RGB policy</text><text x="44" y="814" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Load matching state_dict strictly</text><text x="44" y="835" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Rebuild bundle keys / cameras / output shapes</text><rect x="620" y="720" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deploy input + output contract</text><text x="634" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Required live frames and order</text><text x="634" y="793" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB initial fill and rolling history</text><text x="634" y="814" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Split by raw key widths, then decode rotations</text><text x="634" y="835" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing command builder + hardware adapter</text><path d="M295 610V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 610V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 780H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="955" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rollback selects another explicit model-family checkpoint. Changing only UI labels cannot convert a Diffusion bundle into ACT.</text></svg>