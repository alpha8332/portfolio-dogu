<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Integrity / valid samples are not always fresh device updates</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Integrity / valid samples are not always fresh device updates</text><text x="35" y="95" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Illustrative sequence / seconds; not a measured episode</text><text x="45" y="145" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">row</text><text x="229" y="145" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">0</text><text x="413" y="145" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">1</text><text x="597" y="145" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">2</text><text x="781" y="145" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">3</text><text x="965" y="145" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">4</text><text x="45" y="195" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">sample t</text><text x="229" y="195" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">10.00</text><text x="413" y="195" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">10.02</text><text x="597" y="195" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">10.04</text><text x="781" y="195" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">10.06</text><text x="965" y="195" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">10.08</text><text x="45" y="248" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">device t</text><text x="229" y="248" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">9.90</text><text x="413" y="248" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">9.92</text><text x="597" y="248" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">9.92</text><text x="781" y="248" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">—</text><text x="965" y="248" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">9.98</text><text x="45" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">valid</text><text x="229" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1</text><text x="413" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1</text><text x="597" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1</text><text x="781" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">0</text><text x="965" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1</text><text x="45" y="354" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">new timestamp</text><text x="229" y="354" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">yes</text><text x="413" y="354" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">yes</text><text x="597" y="354" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">reused</text><text x="781" y="354" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">missing</text><text x="965" y="354" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">yes</text><rect x="30" y="435" width="545" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Coverage / 4 valid rows out of 5</text><text x="44" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">valid_ratio = 4/5; one consecutive missing row</text><rect x="605" y="435" width="545" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Freshness / 3 updates out of 5</text><text x="619" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One repeated timestamp excluded; validity alone hides reuse</text><rect x="30" y="590" width="545" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw delta / device time − sample time</text><text x="44" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">First offset: −100 ms</text><text x="44" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">At row 2: −120 ms</text><rect x="605" y="590" width="545" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Corrected delta / remove first finite offset</text><text x="619" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">First corrected delta: 0 ms</text><text x="619" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">At row 2: −20 ms; not one-way transport latency</text><path d="M575 648H605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="780" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare compatible clocks. Monotonic is preferred; wall-clock fallback does not create clock synchronization.</text></svg>