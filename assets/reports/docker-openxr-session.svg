<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1080" width="1240" height="1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">OpenXR Host collector / session ownership, frame loop and container readiness</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">OpenXR Host collector / session ownership, frame loop and container readiness</text><rect x="25" y="65" width="1190" height="265" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ONE HOST SESSION WORKER / WiVRn + local desktop graphics</text><rect x="45" y="115" width="340" height="92" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime + local GLX context</text><text x="59" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Manifest + library + desktop user</text><text x="59" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Local GPU renderer, not SSH llvmpipe</text><rect x="450" y="115" width="335" height="92" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OpenXR session</text><text x="464" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Graphics binding / reference space</text><text x="464" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">READY → begin session → FOCUSED</text><rect x="850" y="115" width="340" height="92" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Frame resources</text><text x="864" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Projection views + swapchain images</text><text x="864" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hidden GL context ≠ no rendering</text><path d="M385 160H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M785 160H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1020 207V350H1225V635H1190" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1025" y="342" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">render resources</text><text x="45" y="270" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">API routes read worker status; they must not open a competing second probe session.</text><rect x="25" y="375" width="1190" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="400" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FRAME ITERATION / actual worker ordering</text><rect x="45" y="430" width="330" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Sync actions + read controls</text><text x="59" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger / squeeze / stick / buttons</text><text x="59" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Carry per-action input_active</text><rect x="450" y="430" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">wait_frame → begin_frame</text><text x="464" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Obtain predicted display time</text><text x="464" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Locate each hand in app reference space</text><rect x="850" y="430" width="340" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Publish hand snapshot</text><text x="864" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position + quaternion + pose_valid</text><text x="864" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">side + input + session / frame status</text><path d="M375 475H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M785 475H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="450" y="585" width="740" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="611" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Build / submit composition layers → end_frame</text><text x="464" y="637" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Acquire / populate swapchain views; keep the WiVRn frame path active</text><text x="464" y="658" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Session events continue to determine whether input is focused / valid</text><path d="M1020 520V585" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M450 635H210V520" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="240" y="625" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next frame</text><rect x="25" y="790" width="1190" height="245" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="815" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONTAINER / bridge client → diagnostics → catalog / TeleT</text><rect x="45" y="845" width="340" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="871" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Transport</text><text x="59" y="897" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Magic / version / length / sequence</text><text x="59" y="918" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fresh timestamp + collector status</text><text x="59" y="939" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">File existence alone is insufficient</text><rect x="450" y="845" width="335" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="871" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime readiness</text><text x="464" y="897" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FOCUSED + render active</text><text x="464" y="918" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Connected hands + valid pose</text><text x="464" y="939" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check action activity separately</text><rect x="850" y="845" width="340" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="871" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Application readiness</text><text x="864" y="897" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Catalog only when bridge ready</text><text x="864" y="918" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Binding + calibration + robot mode</text><text x="864" y="939" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Real robot operation is a further check</text><path d="M1020 520H1200V755H210V845" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1025" y="752" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">shared snapshot</text><path d="M385 905H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M785 905H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>