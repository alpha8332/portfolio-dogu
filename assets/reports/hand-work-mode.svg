<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="1180" height="840" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Grasp mode / retain known state without inventing an unknown mode</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp mode / retain known state without inventing an unknown mode</text><rect x="30" y="80" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Event and runtime state</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mode selection, grasp/release and force updates are different operations</text><rect x="30" y="255" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="281" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit supported mode arrives</text><text x="44" y="307" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonicalize using profile</text><text x="44" y="328" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Remember latest valid mode</text><text x="44" y="349" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Persist it with later command state</text><rect x="620" y="255" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="281" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">No explicit mode update</text><text x="634" y="307" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If a valid mode is already known → retain it</text><text x="634" y="328" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If none is known → unspecified (−1)</text><text x="634" y="349" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not invent mode 31 from device shape</text><path d="M295 160V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 160V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="465" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conversion / readiness</text><text x="44" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Non-positive mode → no explicit mode change</text><text x="44" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Unsupported positive mode → validation error</text><text x="44" y="559" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Missing ownership remains an error</text><rect x="620" y="465" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime / primitive step</text><text x="634" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Known mode: set mode → force → grasp/release</text><text x="634" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Unspecified mode: skip set mode</text><text x="634" y="559" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Retain separate force / state intent</text><path d="M295 365V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 365V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 520H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="680" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Why Replay could look correct while training failed</text><text x="44" y="732" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay could use feedback joints and grasp/force while skipping −1 mode. Earlier conversion rejected the sentinel.</text><text x="44" y="753" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Visible motion did not prove that a particular mode had been recorded or restored.</text></svg>