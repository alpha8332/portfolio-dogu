<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" width="1180" height="820" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Release propagation / three independently updated execution artifacts</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Release propagation / three independently updated execution artifacts</text><rect x="30" y="70" width="1120" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Source changes + scoped verification</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Device adapters / bridge client / UI JS / deployment contracts / host collector assets</text><path d="M200 160V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 160V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 160V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="235" width="340" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Container image</text><text x="44" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Python and native libraries</text><text x="44" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Gateway + device-data runtime code</text><text x="44" y="329" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera preview static JS</text><rect x="420" y="235" width="340" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Release / device-pack manifest</text><text x="434" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Environment + mounts + profile</text><text x="434" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Install/check contract</text><text x="434" y="329" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Manager consumes this artifact</text><rect x="810" y="235" width="340" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host deployment assets</text><text x="824" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Bridge script + package sources</text><text x="824" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">User service + Python + desktop env</text><text x="824" y="329" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not replaced by image update alone</text><rect x="30" y="465" width="730" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">psf-manager update → recreate running containers</text><text x="44" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check actual image / role / environment / mounts, not source checkout only</text><rect x="810" y="465" width="340" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Install / restart Host user service</text><text x="824" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check real ExecStart + collector</text><text x="824" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Socket + shm + fresh sample</text><path d="M200 360V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 360V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 360V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="650" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Verify one live chain after both paths are current</text><text x="44" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Host input → snapshot → backend catalog/check → binding/calibration → physical robot</text><text x="44" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">For cameras: discovery → actual frame → both previews → new capture → saved media</text><path d="M395 570V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 570V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>