<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1020" width="1180" height="1020" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Physical operation / support, contact, regrasp and recovery</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical operation / support, contact, regrasp and recovery</text><rect x="35" y="75" width="1110" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Setup / map robot + EE + input / calibrate / small-axis check</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Choose observation viewpoint and stop responsibility before contact work</text><rect x="35" y="235" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Approach</text><text x="49" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">free space</text><text x="49" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">object and tool ends visible</text><rect x="430" y="235" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Align + support</text><text x="444" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">grasp point / approach axis</text><text x="444" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">other arm holds physical state</text><rect x="825" y="235" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp</text><text x="839" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">confirm real contact</text><text x="839" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not only target position</text><path d="M195 160V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M355 285H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 285H825" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="825" y="435" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Manipulate</text><text x="839" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">lift / fold / cross / insert</text><text x="839" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">watch object deformation</text><text x="839" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">and arm posture margin</text><path d="M985 335V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="430" y="435" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Regrasp / change support</text><text x="444" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hold object with one side</text><text x="444" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">open the other tool</text><text x="444" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">restore accessible grasp</text><path d="M825 495H750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="550" y="421" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">insufficient reach / loop access</text><path d="M590 550V600H985V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="660" y="624" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">continue with new physical state</text><rect x="35" y="435" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reference repositioning</text><text x="49" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">release clutch / re-activate</text><text x="49" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">changes hand reference</text><text x="49" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not robot mechanical limits</text><path d="M430 495H355" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M195 550V650H985V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="220" y="675" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">input workspace exhausted</text><rect x="825" y="735" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Place / release / Idle</text><text x="839" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">confirm support before opening</text><text x="839" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">end motion and recording cleanly</text><path d="M1145 495H1165V785H1145" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1045" y="701" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">task done</text><rect x="35" y="735" width="715" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop / recovery decision</text><text x="49" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tracking lost, collision risk, object slip or blocked view → stop and inspect before retry</text><path d="M825 470H790V710H390V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="425" y="701" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">abnormal state</text><path d="M195 735V710H15V118H35" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="40" y="708" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">re-check setup</text><text x="35" y="920" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Control three things together: robot pose, object/support state and what the operator can observe.</text><text x="35" y="968" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Conceptual operating phases; not an autonomous force-control or automatic recovery implementation.</text></svg>