<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 990" width="1180" height="990" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Graph debugging / distinguish dataset identity, response latency and render exceptions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Graph debugging / distinguish dataset identity, response latency and render exceptions</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Select dataset / keep task + episode identity</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Processed artifact must resolve its raw source; robot-aware catalog retains each robot instead of collapsing to primary</text><path d="M590 160V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="225" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Detail / plot request: time series without RGB extraction</text><text x="44" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw HDF5 fallback when processed plot interpretation is unsupported; return explicit error on failure</text><path d="M295 310V395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 310V395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="395" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Graph data available</text><text x="44" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Render only when data is available</text><text x="44" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not wait for Table / Integrity / MP4 preview</text><rect x="620" y="395" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate background requests</text><text x="634" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Table grouping / Integrity</text><text x="634" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB preview decoding may complete later</text><path d="M295 495V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="580" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Render path must also execute</text><text x="44" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fix undefined escape helper</text><text x="44" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fix legend helper initialization order</text><text x="44" y="674" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">An HTTP response alone is not a rendered graph</text><rect x="620" y="580" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Distinct Table / Replay paths</text><text x="634" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve multi-robot column groups</text><text x="634" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve all Replay participants + robot_results</text><text x="634" y="674" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not replace them while restyling Graph</text><path d="M295 690V775" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 690V775" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="775" width="1120" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe the user-visible result</text><text x="44" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm Filter: All / Robot A / Robot B; signal filters: Proprio / Control / Peripheral</text><text x="44" y="848" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep per-robot cards + common camera validity. Verify selected dataset, filters and runtime errors together.</text><text x="44" y="869" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explanatory diagram reconstructed from the UI contract; not an original application screenshot or measured plot.</text></svg>