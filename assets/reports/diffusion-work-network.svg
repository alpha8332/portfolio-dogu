<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1090" width="1180" height="1090" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Actual local denoiser / constant-resolution conditional temporal CNN</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual local denoiser / constant-resolution conditional temporal CNN</text><rect x="30" y="85" width="530" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Noisy action tensor</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">B × T_p × D_a → transpose → B × D_a × T_p</text><text x="44" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv1d(k=3,pad=1): D_a → C channels</text><rect x="620" y="85" width="530" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Condition vector</text><text x="634" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation features c + sinusoidal embedding(k)</text><text x="634" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Concatenate once; project separately inside each block</text><rect x="30" y="280" width="1120" height="500" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="305" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TWO CONDITIONAL RESIDUAL BLOCKS / horizon length stays T_p</text><rect x="50" y="335" width="480" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Residual branch F(h)</text><text x="64" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Conv1d(C,C,k3) → GroupNorm(1,C)</text><text x="64" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ Mish → Conv1d(C,C,k3)</text><text x="64" y="429" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same sequence length and channels</text><rect x="650" y="335" width="480" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Condition branch g(c,k)</text><text x="664" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mish → Linear(condition_dim,C)</text><text x="664" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Unsqueeze temporal dimension</text><text x="664" y="429" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Broadcast C-vector across T_p</text><rect x="50" y="545" width="1080" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Block 1 output: h1 = h0 + F1(h0) + g1(c,k)</text><text x="64" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Identity skip preserves h0; additive condition is not the official scale-and-bias FiLM configuration</text><rect x="50" y="685" width="1080" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="711" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Block 2: h2 = h1 + F2(h1) + g2(c,k)</text><path d="M295 180V335" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 180V335" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 455V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 455V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 625V685" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="875" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="901" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Output noise prediction</text><text x="44" y="927" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mish → Conv1d(C,D_a,k3) → transpose → B × T_p × D_a</text><path d="M590 750V875" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="1035" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Class name: ConditionalUnet1D. This retained implementation has no downsample / upsample or multiscale skip hierarchy.</text></svg>