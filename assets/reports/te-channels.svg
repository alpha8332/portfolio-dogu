<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 770" width="1180" height="770" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">One action dictionary / different mathematical and control semantics</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">One action dictionary / different mathematical and control semantics</text><rect x="30" y="75" width="1120" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Overlapping ACT candidates for the same execution step</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">bank ordered by query time: oldest … newest; weights are normalized over available candidates</text><path d="M150 150V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M445 150V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M745 150V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1040 150V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="225" width="250" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position / hand joints</text><text x="44" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weighted vector sum</text><text x="44" y="298" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p = Σ wᵢ pᵢ</text><rect x="315" y="225" width="265" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="329" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Orientation</text><text x="329" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">M = Σ wᵢ Rᵢ</text><text x="329" y="298" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">M is not generally a rotation</text><rect x="615" y="225" width="265" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="629" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Gripper / grasp primitive</text><text x="629" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">select oldest overlapping value</text><text x="629" y="298" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no synthetic intermediate event</text><rect x="915" y="225" width="235" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="929" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Success / progress</text><text x="929" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">worker uses latest query</text><text x="929" y="298" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">separate from action blending</text><path d="M447 325V370" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="315" y="370" width="265" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="329" y="396" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Project to SO(3)</text><text x="329" y="422" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">M = UΣVᵀ</text><text x="329" y="443" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R = U diag(1,1,det(UVᵀ)) Vᵀ</text><rect x="615" y="370" width="535" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="629" y="396" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Why not average every scalar?</text><text x="629" y="422" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">grasp mode is a label; grasp force belongs to a primitive;</text><text x="629" y="443" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">a gripper threshold can shift close/release timing.</text><path d="M747 325V370" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M155 325V520H590V565" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M447 470V520" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M747 470V520H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="290" y="565" width="600" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="304" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Build commands against the live robot state</text><text x="304" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve owner / relative pose / device command policy</text><text x="30" y="710" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Smooth pose ≠ successful grasp. Continuous motion and discrete contact events require different temporal treatment.</text></svg>