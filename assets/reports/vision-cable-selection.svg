<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Cable selection / study informed a real project connection</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Cable selection / study informed a real project connection</text><rect x="30" y="80" width="345" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observed failure</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">D435IF: 5 m extension → USB 2.x</text><text x="44" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Repeater: initial SS → No Frame</text><text x="44" y="174" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">D405: moving end-tool cable requirements</text><rect x="435" y="80" width="345" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Study + analysis</text><text x="449" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">USB 2 / SuperSpeed separate paths</text><text x="449" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stream demand + shared resources</text><text x="449" y="174" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Transmission-line loss and discontinuities</text><path d="M375 142H435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><re