<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" width="1180" height="790" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Demonstration / from project request to reviewed robot behavior</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Demonstration / from project request to reviewed robot behavior</text><rect x="35" y="90" width="270" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Project requester</text><text x="49" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Need to replay collected motion</text><text x="49" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Review actual robot behavior</text><rect x="445" y="90" width="290" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Group leader</text><text x="459" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Clarify task / review approach</text><text x="459" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Approve feasible execution scope</text><rect x="865" y="90" width="270" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="879" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">My implementation</text><text x="879" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay integration + troubleshooting</text><text x="879" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot setup and execution support</text><path d="M305 137H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M735 137H865" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="300" width="270" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected episode + hardware</text><text x="49" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Correct robot / arm / EE</text><text x="49" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Known start pose and source keys</text><rect x="445" y="300" width="290" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare + align</text><text x="459" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Clear motion / verify readiness</text><text x="459" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reach the recorded start before run</text><rect x="865" y="300" width="270" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="879" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Execute + observe</text><text x="879" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Both arms + end effectors</text><text x="879" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop and actual motion response</text><path d="M1000 185V250H170V300" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M305 355H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M735 355H865" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="545" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Issue found during development / review</text><text x="49" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Describe segment and visible symptom</text><text x="49" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate source, mapping, scheduling and controller state</text><rect x="645" y="545" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Internal review + approval</text><text x="659" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Customer / group leader / colleagues observe motion</text><text x="659" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Successful demonstration is not long-term field validation</text><path d="M1000 410V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1015" y="480" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">review</text><path d="M865 410V460H280V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="470" y="451" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">issue</text><path d="M280 655V700H1160V137H1135" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="335" y="691" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Correct implementation → restart → repeat physical check</text><text x="35" y="750" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Location: Neuromeka internal testbed. No claim of installation or operation at a POSCO production site.</text></svg>