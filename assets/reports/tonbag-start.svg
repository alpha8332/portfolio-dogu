<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Replay / initial alignment is outside the recorded episode clock</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay / initial alignment is outside the recorded episode clock</text><rect x="35" y="80" width="270" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected raw episode</text><text x="49" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">First valid pose / q</text><text x="49" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left / right / end-effector mapping</text><rect x="440" y="80" width="290" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live robot state</text><text x="454" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Current pose / state / pending motion</text><text x="454" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial gap and control mode</text><rect x="865" y="80" width="270" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="879" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay request</text><text x="879" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One active run</text><text x="879" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop / pause / progress ownership</text><path d="M170 175V220H585V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 175V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1000 175V220H585" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="340" y="255" width="490" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="354" y="281" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PREPARING → ALIGNING</text><text x="354" y="307" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Clear previous motion; move toward recorded start</text><text x="354" y="328" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Command repeatedly where required; poll measured arrival</text><rect x="35" y="390" width="235" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Timeout / fault / Stop</text><text x="49" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not start episode clock</text><text x="49" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop motion / clean up state</text><rect x="340" y="390" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="354" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arrival + settling confirmed</text><text x="354" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Both arms ready before replay begins</text><text x="354" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded first pose is not current robot pose</text><path d="M450 350V370H150V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="200" y="365" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">failure</text><path d="M585 350V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="600" y="375" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">success</text><rect x="340" y="555" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="354" y="581" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">RUNNING / start a new playback origin</text><text x="354" y="607" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source time s[i] − s[0] → scheduled wall-clock dispatch</text><path d="M585 500V555" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="700" width="270" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PAUSED</text><text x="49" y="752" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hold progress; resume shifts origin</text><text x="49" y="773" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Paused duration is excluded</text><rect x="440" y="700" width="290" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">FINISHED</text><text x="454" y="752" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">End-of-source cleanup</text><text x="454" y="773" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI cursor follows replay progress</text><rect x="865" y="700" width="270" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="879" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">STOPPED / ERROR</text><text x="879" y="752" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cancel loop + stop robot motion</text><text x="879" y="773" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not just a UI state change</text><path d="M440 645V670H170V700" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 645V700" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 645V670H1000V700" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M170 700V615H340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="195" y="606" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">resume</text></svg>