<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Binary gripper / raw output → hysteresis → effective owned command</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Binary gripper / raw output → hysteresis → effective owned command</text><rect x="30" y="85" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw model command</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position + optional force target</text><text x="44" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">may be intermediate or open-biased</text><rect x="430" y="85" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalize open direction</text><text x="444" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">m = midpoint</text><text x="444" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">h = max(12.5, 0.05 × span)</text><rect x="830" y="85" width="320" height="110" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="844" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Effective binary action</text><text x="844" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">outside band → open / close</text><text x="844" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inside band → hold last action</text><path d="M350 140H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 140H830" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="275" width="1120" height="315" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="300" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CALCULATED EXAMPLE / q_open=1000, q_close=0, m=500, h=50</text><path d="M140 520H1070" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="840" y="555" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">raw position command q</text><text x="55" y="355" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">OPEN</text><text x="55" y="500" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CLOSE</text><path d="M140 500H635V350H1040" fill="none" stroke="#80d0f5" stroke-width="3"/><path d="M1040 365H545V485H140" fill="none" stroke="#eab67e" stroke-width="3" stroke-dasharray="7 4"/><text x="130" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">0</text><text x="535" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">450</text><text x="625" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">550</text><text x="1030" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1000</text><text x="165" y="330" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Increasing q: CLOSE → OPEN at 550</text><text x="690" y="455" fill="#eab67e" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Decreasing q: OPEN → CLOSE at 450</text><text x="675" y="580" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inside the band: retain the previous action</text><rect x="30" y="635" width="1120" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dispatch and diagnostics</text><text x="44" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve robot / arm / tool owner → use configured force → suppress identical repeated action</text><text x="44" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">log raw value AND effective value + force source + owner + dispatched flag</text><text x="44" y="729" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This does not repair the learned policy distribution; keep raw outputs observable.</text></svg>