<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 925" width="1180" height="925" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Identity / preserve ownership while runtime addresses change</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Identity / preserve ownership while runtime addresses change</text><rect x="30" y="80" width="530" height="620" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LEGACY SIDE-QUALIFIED</text><rect x="50" y="140" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture identity</text><text x="64" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw hand.tesollo.&lt;runtime_id&gt;.*</text><text x="64" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved attachment → left or right</text><rect x="50" y="315" width="490" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical observation / action</text><text x="64" y="367" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">observation.hand.&lt;side&gt;.joint_pos_deg</text><text x="64" y="388" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action.hand.&lt;side&gt;.joint_pos_deg</text><rect x="50" y="515" width="490" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deployment target</text><text x="64" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">side + profile + joint count</text><text x="64" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ exact attached runtime hand</text><path d="M295 230V315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="310" y="275" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">saved ownership</text><path d="M295 430V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="310" y="475" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">checkpoint contract</text><rect x="620" y="80" width="530" height="620" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MULTI SINGLE-ARM / ROBOT-KEYED</text><rect x="640" y="140" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture identity</text><text x="654" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw robot.&lt;robot_key&gt;.hand.*</text><text x="654" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved session → owning robot</text><rect x="640" y="315" width="490" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical observation / action</text><text x="654" y="367" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">observation.robot.&lt;key&gt;.hand.joint_pos_deg</text><text x="654" y="388" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action.robot.&lt;key&gt;.hand.joint_pos_deg</text><rect x="640" y="515" width="490" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deployment target</text><text x="654" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_key → robot_id → attached runtime hand</text><text x="654" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">profile + joint count checked</text><path d="M885 230V315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="900" y="275" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">saved ownership</text><path d="M885 430V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="900" y="475" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">checkpoint contract</text><rect x="30" y="765" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="791" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Ambiguous owner is an error, not an opportunity to guess</text><text x="44" y="817" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Equal vector widths do not establish identity. Do not use array order or runtime-id digits to invent left/right.</text><text x="44" y="838" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Current device addresses are resolved only after the stable owner and its hardware requirements match.</text><path d="M295 700V765" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 700V765" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>