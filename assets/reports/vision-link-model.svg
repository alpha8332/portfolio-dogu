<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Transmission line / length and interfaces are separate variables</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Transmission line / length and interfaces are separate variables</text><rect x="30" y="80" width="1120" height="200" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EXTENSION PATH / conceptual channel</text><rect x="50" y="135" width="180" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host</text><text x="64" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TX / RX termination</text><rect x="280" y="135" width="260" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">5 m extension</text><text x="294" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Distributed R / L / G / C</text><rect x="590" y="135" width="270" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="604" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Extra connection + stock cable</text><text x="604" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Impedance discontinuity possible</text><rect x="910" y="135" width="220" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="924" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera</text><text x="924" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Receiver margin matters</text><path d="M230 175H280" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M540 175H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M860 175H910" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M700 135V115H425V135" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="450" y="108" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">reflected component</text><rect x="30" y="325" width="1120" height="180" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="350" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SELECTED LONG-CABLE PATH / conceptual channel</text><rect x="50" y="380" width="180" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="406" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host</text><text x="64" y="432" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TX / RX termination</text><rect x="330" y="380" width="500" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="344" y="406" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Long cable matched to the camera use case</text><text x="344" y="432" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No generic extension joint in the middle</text><rect x="910" y="380" width="220" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="924" y="406" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera</text><text x="924" y="432" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Verify actual link</text><path d="M230 420H330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M830 420H910" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="560" width="345" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Propagation</text><text x="44" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">γ = α + jβ</text><text x="44" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">|V(ℓ)| = |V₀⁺| exp(−αℓ)</text><text x="44" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Loss depends on frequency / channel</text><text x="44" y="675" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Length alone is not the whole channel</text><rect x="415" y="560" width="350" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="429" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reflection</text><text x="429" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Γ = (ZL − Z₀) / (ZL + Z₀)</text><text x="429" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Interfaces can reflect energy</text><text x="429" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Returning energy can cause ISI</text><text x="429" y="675" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fewer joins reduce possible discontinuities</text><rect x="805" y="560" width="345" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">What the test established</text><text x="819" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Negotiated link + frame output</text><text x="819" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No measured α or reflection coefficient</text><text x="819" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No recorded eye diagram</text><text x="819" y="675" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Theory guides selection, tests verify use</text><text x="30" y="785" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">This is an explanatory channel model, not a measured equivalent circuit of either selected cable.</text><text x="30" y="830" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A repeater adds active circuitry and power behavior; the passive-line model cannot identify its failure cause alone.</text></svg>