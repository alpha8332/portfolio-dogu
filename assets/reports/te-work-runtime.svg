<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1270" width="1180" height="1270" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">MiMicX / observation, temporal bank and device execution</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX / observation, temporal bank and device execution</text><rect x="30" y="75" width="310" height="1070" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DEVICE / live source and actuator</text><rect x="50" y="125" width="270" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot + cameras</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">measured pose / op-state</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand state / RGB frames</text><text x="64" y="219" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source timestamps</text><rect x="50" y="940" width="270" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="966" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device command dispatch</text><text x="64" y="992" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot / gripper / hand</text><text x="64" y="1013" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">readiness + EE preflight</text><text x="64" y="1034" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">physical movement → feedback</text><path d="M185 940V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="62" y="670" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next measured state</text><rect x="370" y="75" width="780" height="1070" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="382" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INFERENCE RUNTIME / worker owns execution state</text><rect x="395" y="125" width="720" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="409" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Freshness / op-state / observation preparation</text><text x="409" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ordered inputs → normalize state → stack cameras → finite-value check</text><path d="M320 180H395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="322" y="166" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">live data</text><path d="M755 220V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="395" y="255" width="440" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="409" y="281" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT executor / fresh model query</text><text x="409" y="307" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">policy model → whole action chunk</text><text x="409" y="328" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no queue-pop in the TE branch</text><rect x="870" y="255" width="245" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="884" y="281" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Success / progress</text><text x="884" y="307" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fresh query scalar</text><text x="884" y="328" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">outside the action bank</text><path d="M835 300H870" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M615 355V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="395" y="390" width="720" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="409" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Decode → inverse normalization → split by key</text><text x="409" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">6D rotation head → 3×3 blocks; action dictionary for each future step</text><path d="M755 485V520" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="395" y="520" width="720" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="409" y="546" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute-step bank</text><text x="409" y="572" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">append (query_step, actions) → prune expired chunks</text><text x="409" y="593" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current t: offset = t − q → gather oldest-to-newest candidates</text><path d="M755 620V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="395" y="660" width="225" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="409" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Continuous</text><text x="409" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position / delta</text><text x="409" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand joint angles</text><text x="409" y="754" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weighted average</text><rect x="640" y="660" width="225" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Orientation</text><text x="654" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3×3 weighted mean</text><text x="654" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SVD + determinant fix</text><text x="654" y="754" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">valid SO(3) matrix</text><rect x="885" y="660" width="230" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="899" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp event</text><text x="899" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper / primitive</text><text x="899" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">oldest overlap value</text><text x="899" y="754" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no numerical averaging</text><path d="M510 620V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1000 620V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M510 780V815H755V845" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M755 780V815H755V845" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1000 780V815H755V845" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="395" y="845" width="720" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="409" y="871" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Action clamp / finite check / previous-command inputs</text><path d="M755 915V950" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="395" y="950" width="720" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="409" y="976" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command builder + existing execution gates</text><text x="409" y="1002" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner / segment routing; live-pose relative transform</text><text x="409" y="1023" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">m → mm / matrix → device orientation; then actuator dispatch</text><path d="M395 1005H320" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="47" y="925" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">validated commands</text><path d="M993 355V370H1135V1100H755V1060" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="860" y="1125" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">scalar status / stop decision</text><text x="35" y="1205" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical boundary at left; model inference, temporal selection and device commands have different responsibilities.</text><text x="35" y="1240" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Preview is diagnostic. The bank does not replace device safety or compensate for wall-clock inference latency.</text></svg>