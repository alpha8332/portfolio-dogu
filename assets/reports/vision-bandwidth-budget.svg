<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Payload / calculated demand under explicit 16-bit assumptions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Payload / calculated demand under explicit 16-bit assumptions</text><text x="35" y="90" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Payload only — width × height × bits per pixel × frames per second</text><text x="35" y="125" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The bars are calculations, not measured USB throughput or camera capacity.</text><text x="35" y="199" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">One 720p30 stream</text><rect x="380" y="175" width="39.81" height="32" fill="#80d0f5" opacity=".65"/><text x="429.81312" y="198" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">0.442 Gbit/s</text><text x="35" y="266" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">One camera: color + depth</text><rect x="380" y="242" width="79.63" height="32" fill="#80d0f5" opacity=".65"/><text x="469.62624" y="265" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">0.885 Gbit/s</text><text x="35" y="333" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Six-camera low-load mix A</text><rect x="380" y="309" width="132.71" height="32" fill="#80d0f5" opacity=".65"/><text x="522.7103999999999" y="332" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1.475 Gbit/s</text><text x="35" y="400" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Six-camera low-load mix B</text><rect x="380" y="376" width="145.98" height="32" fill="#80d0f5" opacity=".65"/><text x="535.98144" y="399" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1.622 Gbit/s</text><text x="35" y="467" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Eight cameras: RGB only</text><rect x="380" y="443" width="318.50" height="32" fill="#eab67e" opacity=".65"/><text x="708.50496" y="466" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3.539 Gbit/s</text><text x="35" y="534" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Eight cameras: color + depth</text><rect x="380" y="510" width="637.01" height="32" fill="#eab67e" opacity=".65"/><text x="1027.00992" y="533" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">7.078 Gbit/s</text><path d="M740.0 155V585" stroke="#eab67e" stroke-dasharray="5 4"/><path d="M740.0 585V617H400" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="625" fill="#eab67e" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">4 Gbit/s after 8b/10b, before packets</text><path d="M830.0 155V585" stroke="#eab67e" stroke-dasharray="5 4"/><path d="M830.0 585V647H400" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="655" fill="#eab67e" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">5 Gbit/s Gen 1 signaling</text><text x="35" y="715" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Reference lines describe one Gen 1 link. A PC with several controllers is not one shared 5 Gbit/s link.</text><text x="35" y="753" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Color assumption: packed YUY2 / UYVY, 16 bit/pixel. RGB8 conversion in software is a different byte layout.</text></svg>