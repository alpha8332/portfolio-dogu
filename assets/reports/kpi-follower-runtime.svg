<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1100" width="1180" height="1100" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">KPI2 / actual-based follower: commands, event publication, preview and feedback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">KPI2 / actual-based follower: commands, event publication, preview and feedback</text><rect x="25" y="70" width="1130" height="465" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HOST / concurrent runtime responsibilities</text><rect x="45" y="115" width="325" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Main thread / Left master</text><text x="59" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cumulative relative circle → Left command</text><text x="59" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">60 Hz setting; command history</text><text x="59" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Sequence + target + send timestamp</text><rect x="425" y="115" width="325" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual watcher thread</text><text x="439" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Poll Left measured TCP</text><text x="439" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Detect movement ≥ 0.10 mm</text><text x="439" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Match recent command history</text><rect x="810" y="115" width="325" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared latest event / lock</text><text x="824" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">seq / actual relative position / velocity</text><text x="824" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">detect time / matched send time</text><text x="824" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Latest snapshot, not a replay queue</text><path d="M370 165H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="375" y="151" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">history</text><path d="M750 165H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="752" y="151" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">publish</text><rect x="810" y="285" width="325" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Right relay thread</text><text x="824" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read newest actual event</text><text x="824" y="358" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Velocity estimate → circle preview</text><text x="824" y="379" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Adaptive delay median + cap</text><text x="824" y="400" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">New seq or changed target → send</text><path d="M970 215V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="365" width="325" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="391" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Logger thread / 100 Hz setting</text><text x="59" y="417" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_L, p_R; pdes_L, pdes_R</text><text x="59" y="438" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Right relay reference + orientation</text><text x="59" y="459" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Motion log for actual phase comparison</text><rect x="425" y="365" width="325" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="391" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Timing log / diagnostic path</text><text x="439" y="417" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left send → actual detect → Right send</text><text x="439" y="438" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preview horizon and effective cap</text><text x="439" y="459" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This is not the final motion latency KPI</text><path d="M810 355H790V427H750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="607" y="345" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">event timestamps</text><rect x="25" y="585" width="1130" height="215" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="610" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT CONTROLLER + TWO PHYSICAL ARMS</text><rect x="45" y="635" width="325" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Left master arm</text><text x="59" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Receive planned circle</text><text x="59" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Internal desired → measured TCP</text><text x="59" y="729" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical motion is the relay source</text><rect x="810" y="635" width="325" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Right slave arm</text><text x="824" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Receive previewed actual-based target</text><text x="824" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Internal desired → measured TCP</text><text x="824" y="729" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Does not directly run the planned path</text><path d="M205 215V290H20V695H45" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="36" y="305" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Left command</text><path d="M370 695H390V265H585V215" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440" y="255" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Left measured state</text><path d="M970 420V635" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="981" y="566" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Right command</text><path d="M810 710H785V560H207V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="385" y="551" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">both measured states → logger</text><rect x="45" y="860" width="510" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="886" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OFFLINE / temporal metric</text><text x="59" y="912" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Motion-start crop → relative actual trajectories</text><text x="59" y="933" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalized circle phase → matched landmarks</text><text x="59" y="954" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpolated crossing times → |t_R − t_L|</text><text x="59" y="975" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Trial judge = max(X landmark lags, Z landmark lags)</text><rect x="625" y="860" width="510" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="886" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OFFLINE / geometric diagnostic</text><text x="639" y="912" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mean signed lag → time-align master trajectory</text><text x="639" y="933" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare shifted master against actual slave</text><text x="639" y="954" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Residual sync RMSE + pdes / reference tracking</text><text x="639" y="975" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Online preview and offline alignment are separate</text><path d="M370 450H407V830H300V860" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 935H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="540" y="845" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">mean signed lag →</text><text x="45" y="1060" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Watcher / relay 1000 Hz are configured polling rates, not measured controller frequencies. No private addresses or source code shown.</text></svg>