<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1010" width="1180" height="1010" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Action diffusion / training teaches noise prediction, inference generates actions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Action diffusion / training teaches noise prediction, inference generates actions</text><rect x="30" y="80" width="1120" height="350" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING / one sampled noise level per batch item</text><rect x="50" y="140" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Clean demonstrated action</text><text x="64" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A0: B × T_p × D_a</text><text x="64" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalize each selected action key</text><text x="64" y="234" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Target is an action trajectory</text><rect x="440" y="140" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Forward noise construction</text><text x="454" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Sample ε ~ N(0,I), noise level k</text><text x="454" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A_k = √αbar_k A0 + √(1−αbar_k) ε</text><rect x="830" y="140" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="844" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conditional predictor</text><text x="844" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input A_k + k + observation c</text><text x="844" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Output predicted noise ε_hat</text><text x="844" y="234" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same B × T_p × D_a shape</text><path d="M350 190H440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 190H830" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="440" y="310" width="690" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Masked MSE / parameter update</text><text x="454" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare ε_hat with sampled ε only at valid action timesteps; backpropagate into predictor and RGB encoder</text><path d="M980 240V310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 240V310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="605" y="280" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">known noise</text><rect x="30" y="500" width="1120" height="390" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="525" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INFERENCE / observation condition fixed inside one denoising call</text><rect x="50" y="565" width="300" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial Gaussian chunk</text><text x="64" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Random B × T_p × D_a</text><text x="64" y="638" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No demonstration action supplied</text><text x="64" y="659" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Use live observation condition c</text><rect x="440" y="565" width="300" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Repeated reverse update</text><text x="454" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Predict ε at selected k</text><text x="454" y="638" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Estimate clean action A0_hat</text><text x="454" y="659" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Move to selected previous noise level</text><rect x="830" y="565" width="300" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="844" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Executable prefix</text><text x="844" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Denormalize by key</text><text x="844" y="638" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Return first T_a steps</text><text x="844" y="659" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Queue → one command at a time</text><path d="M350 615H440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 615H830" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 670V755H390V540H590V565" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="450" y="795" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next k until final update</text><text x="50" y="860" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Local reverse updates do not inject fresh noise each step. The random initial chunk still makes different samples possible.</text><text x="30" y="960" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conceptual dataflow, not a measured trajectory or a reproduced paper benchmark.</text></svg>