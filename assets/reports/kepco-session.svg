<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="title"><title id="title">KEPCO Preparation / Two Independent Robots</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8caabb"/></marker></defs><rect width="1000" height="410" fill="#141a1e"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#dbe5eb}.label{fill:#85c9ed;font-size:13px}.detail{fill:#9db0bb;font-size:13px}.head{font-size:17px;font-weight:600}</style><text x="32" y="40" font-size="22" font-weight="600">KEPCO Preparation / Two Independent Robots</text><text x="32" y="98" class="label">ROBOT A</text><rect x="190" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="100" class="head">Runtime robot A</text><text x="204" y="154" class="detail">registered identity</text><rect x="450" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="100" class="head">Owned EE + input</text><text x="464" y="154" class="detail">robot-scoped attachment / binding</text><path d="M425 122 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="72" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="100" class="head">Session participant A</text><text x="724" y="154" class="detail">explicit canonical order</text><path d="M685 122 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="238" class="label">ROBOT B</text><rect x="190" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="240" class="head">Runtime robot B</text><text x="204" y="294" class="detail">separate registered identity</text><rect x="450" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="240" class="head">Owned EE + input</text><text x="464" y="294" class="detail">separate attachment / binding</text><path d="M425 262 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="212" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="240" class="head">Session participant B</text><text x="724" y="294" class="detail">one shared recording session</text><path d="M685 262 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><line x1="32" y1="358" x2="968" y2="358" stroke="#34434c"/><text x="32" y="385" class="detail">Indy12 두 대의 운영 문서에 담은 owner와 session 구조. 실제 활선 작업 구성을 공개한 그림이 아니다.</text></svg>