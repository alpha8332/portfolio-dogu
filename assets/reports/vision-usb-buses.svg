<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" width="1180" height="740" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">USB / compatible connectors contain separate data paths</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">USB / compatible connectors contain separate data paths</text><rect x="30" y="80" width="300" height="420" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HOST / logical PHYs</text><rect x="50" y="130" width="260" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">USB 2.0 PHY</text><text x="64" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">D+ / D−</text><text x="64" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">High-Speed: 480 Mbit/s</text><rect x="50" y="300" width="260" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SuperSpeed PHY</text><text x="64" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SSTX± / SSRX±</text><text x="64" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Gen 1: 5 Gbit/s signaling</text><text x="64" y="394" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">8b/10b encoding</text><rect x="850" y="80" width="300" height="420" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="862" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CAMERA / logical PHYs</text><rect x="870" y="130" width="260" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="884" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">USB 2.0 PHY</text><text x="884" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compatible lower-speed path</text><text x="884" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Restricted stream combinations</text><rect x="870" y="300" width="260" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="884" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SuperSpeed PHY</text><text x="884" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate high-speed data path</text><text x="884" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Needs suitable cable + connector</text><path d="M310 180H870" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440" y="165" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">D+ / D− differential pair</text><path d="M870 205H310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="425" y="248" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">same pair / alternating direction</text><path d="M310 340H870" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440" y="325" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Host TX → camera RX</text><path d="M870 405H310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440" y="390" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera TX → Host RX</text><rect x="370" y="510" width="440" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="384" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One physical cable / connector</text><text x="384" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Power + ground + data conductors</text><text x="384" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">USB-C shape alone does not establish data speed</text><path d="M590 405V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="665" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation: a camera can enumerate through USB 2.x while its intended SuperSpeed path is unavailable.</text><text x="35" y="705" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not add the two signaling rates and call the result the camera payload capacity.</text></svg>