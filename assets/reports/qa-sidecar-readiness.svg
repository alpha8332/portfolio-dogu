<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">From preview to learning / preserve the source of video sidecars</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">From preview to learning / preserve the source of video sidecars</text><rect x="30" y="75" width="545" height="255" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ORIGINAL EPISODE</text><rect x="50" y="125" width="235" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw HDF5</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">timestamps + metadata</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">video references</text><rect x="315" y="125" width="240" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="329" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">MP4 sidecar</text><text x="329" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB frames</text><text x="329" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">separate from HDF5</text><path d="M285 172H315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="288" y="157" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">ref</text><text x="50" y="275" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preview can resolve the original pair successfully.</text><rect x="605" y="75" width="545" height="255" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="617" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">STAGED / MATERIALIZED SELECTION</text><rect x="625" y="125" width="505" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected / converted HDF5</text><text x="639" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A different parent folder is not the original video location</text><path d="M555 245H590V172H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="560" y="232" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">selection</text><text x="625" y="275" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Looking only beside staged HDF5 can miss RGB.</text><rect x="30" y="395" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve provenance / source episode + selection manifest</text><text x="44" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Use source_path and selection_manifest to reconnect the selected sample stream to its original sidecar</text><path d="M877 330V395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M302 330V395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="560" width="340" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Decode + materialize</text><text x="44" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Aligned read → sequential retry</text><text x="44" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Restore linked sidecars</text><text x="44" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Identify the failing file / camera</text><rect x="420" y="560" width="350" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training Readiness</text><text x="434" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected keys + source availability</text><text x="434" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-episode blocking diagnostics</text><text x="434" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not let one corrupt H5 hide all</text><rect x="820" y="560" width="330" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start preflight</text><text x="834" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Validate the artifact actually used</text><text x="834" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reject corrupt processed HDF5</text><text x="834" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">before launching the worker</text><path d="M200 495V560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M370 622H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M770 622H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="770" fill="#e1eaf0" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">Checklist schema pass ≠ readable video ≠ training launch approval.</text><text x="30" y="815" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">These are related debugging boundaries. The Checklist itself does not run conversion, training or robot motion.</text></svg>