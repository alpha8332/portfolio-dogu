<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1050" width="1180" height="1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Grasp edge starvation / the freshest plan can postpone an event</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp edge starvation / the freshest plan can postpone an event</text><text x="30" y="90" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Illustrative model outputs: each new query predicts OPEN now, CLOSE next.</text><text x="315" y="140" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">target 10</text><text x="520" y="140" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">target 11</text><text x="725" y="140" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">target 12</text><text x="930" y="140" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">target 13</text><text x="35" y="210" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">query 10</text><rect x="285" y="180" width="185" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="299" y="206" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OPEN</text><text x="299" y="232" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 0</text><rect x="490" y="180" width="185" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="504" y="206" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CLOSE</text><text x="504" y="232" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 1</text><text x="35" y="315" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">query 11</text><rect x="490" y="285" width="185" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="504" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OPEN</text><text x="504" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 0</text><rect x="695" y="285" width="185" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="709" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CLOSE</text><text x="709" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 1</text><text x="35" y="420" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">query 12</text><rect x="695" y="390" width="185" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="709" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OPEN</text><text x="709" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 0</text><rect x="900" y="390" width="185" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="914" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CLOSE</text><text x="914" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 1</text><path d="M580 460V505" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="625" y="495" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">target 11: q10[1] vs q11[0]</text><rect x="30" y="540" width="530" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial fix / take latest candidate</text><text x="44" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">At t=11 choose q11[0] = OPEN</text><text x="44" y="613" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">At t=12 choose q12[0] = OPEN</text><text x="44" y="634" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The CLOSE edge keeps moving into the future.</text><text x="44" y="655" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No averaging, but still no executed grasp.</text><rect x="600" y="540" width="550" height="150" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="614" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Final rule / take oldest overlapping candidate</text><text x="614" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">At t=11 choose q10[1] = CLOSE</text><text x="614" y="613" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">At t=12 query10 has expired (H=2); use q11[1]</text><text x="614" y="634" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Earlier planned current-step event survives.</text><text x="614" y="655" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The source advances as chunks expire.</text><rect x="30" y="740" width="530" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="766" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Continuous target at t=11</text><text x="44" y="792" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q10[1] = 2, q11[0] = 10</text><text x="44" y="813" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Equal-weight position = 6</text><text x="44" y="834" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The continuous trajectory still blends.</text><rect x="600" y="740" width="550" height="140" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="614" y="766" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Event target at t=11</text><text x="614" y="792" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">old CLOSE = 0, fresh OPEN = 1000</text><text x="614" y="813" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Output remains CLOSE = 0, not 500 or 1000</text><text x="614" y="834" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand state / mode / force use the same source.</text><text x="35" y="945" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">These OPEN/CLOSE values illustrate the device-target scale. They are not classifier probabilities.</text><text x="35" y="990" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Choosing an event from the policy is still imitation inference; no task-position → forced-grasp script was added.</text></svg>