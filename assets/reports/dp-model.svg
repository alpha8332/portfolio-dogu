<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Diffusion Policy / training objective and closed-loop rollout</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Diffusion Policy / training objective and closed-loop rollout</text><rect x="30" y="65" width="1120" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING / sampled diffusion step k</text><rect x="50" y="110" width="280" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Clean target action A⁰</text><text x="64" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">canonical key blocks</text><text x="64" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normalize → [B,Tp,A]</text><rect x="50" y="250" width="280" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Gaussian noise ε + step k</text><text x="64" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Aᵏ = √ᾱₖ A⁰ + √(1−ᾱₖ) ε</text><path d="M190 200V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M330 295H400" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="400" y="240" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="414" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conditional noise predictor</text><text x="414" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">εθ(Aᵏ, k, observation condition)</text><text x="414" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1D temporal convolutions</text><rect x="400" y="110" width="330" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="414" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation condition</text><text x="414" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB features + optional lowdim history</text><path d="M565 190V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="810" y="240" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Masked noise loss</text><text x="824" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">compare predicted ε with sampled ε</text><text x="824" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">exclude padded action rows</text><path d="M730 290H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M330 295H365V365H965V340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="510" y="385" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">noise target</text><rect x="30" y="440" width="1120" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="465" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INFERENCE / same condition held through denoising, refreshed at replanning</text><rect x="50" y="490" width="260" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live inputs</text><text x="64" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">camera order + RGB history</text><text x="64" y="563" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">lowdim state / normalizer</text><rect x="365" y="490" width="270" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="379" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial action noise Aᴷ</text><text x="379" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">sample [B,Tp,A]</text><text x="379" y="563" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a robot command</text><rect x="690" y="490" width="430" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="704" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Denoising loop: K → … → 0</text><text x="704" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">predict ε → scheduler step → update action sequence</text><path d="M635 540H690" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M310 540H335V620H905V590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="360" y="614" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">observation condition</text><path d="M1120 540H1135V465H905V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="925" y="460" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">repeat per diffusion step</text><rect x="690" y="670" width="430" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="704" y="696" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Select execution window + decode</text><text x="704" y="722" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">denormalize → first Ta → key slices → rotations</text><path d="M905 590V670" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="670" width="550" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="696" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Queue → validated robot commands → new state</text><text x="64" y="722" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">consume one action per inference tick; re-query when queue empties</text><path d="M690 712H600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M180 670V590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="55" y="641" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next replan</text><text x="30" y="850" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Two clocks: diffusion iterations refine one predicted trajectory; execution ticks move the robot through that trajectory.</text></svg>