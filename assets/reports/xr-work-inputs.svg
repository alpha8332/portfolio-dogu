<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Controller inputs / functional schematic, not a specific product model</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller inputs / functional schematic, not a specific product model</text><rect x="30" y="80" width="540" height="530" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LEFT CONTROLLER / logical side ≠ robot / arm owner</text><rect x="610" y="80" width="540" height="530" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RIGHT CONTROLLER / choose owner through binding</text><rect x="140" y="150" width="320" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="154" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Left pose</text><text x="154" y="202" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position m + orientation xyzw</text><text x="154" y="223" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">relative to reference at activation</text><rect x="70" y="300" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="84" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Thumbstick X / Y</text><text x="84" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">dimensionless [−1, 1]</text><text x="84" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis-map robot-base jog</text><rect x="330" y="300" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="344" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Primary / secondary</text><text x="344" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">X = primary / Y = secondary</text><text x="344" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">button edge → selected action</text><rect x="70" y="455" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="84" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trigger axis</text><text x="84" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fraction [0, 1]</text><text x="84" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper position command</text><rect x="330" y="455" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="344" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Squeeze / grip axis</text><text x="344" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fraction [0, 1]</text><text x="344" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose activation gate</text><rect x="720" y="150" width="320" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="734" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Right pose</text><text x="734" y="202" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position m + orientation xyzw</text><text x="734" y="223" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">relative to reference at activation</text><rect x="650" y="300" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Thumbstick X / Y</text><text x="664" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">dimensionless [−1, 1]</text><text x="664" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis-map robot-base jog</text><rect x="910" y="300" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="924" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Primary / secondary</text><text x="924" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A = primary / B = secondary</text><text x="924" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">button edge → selected action</text><rect x="650" y="455" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trigger axis</text><text x="664" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fraction [0, 1]</text><text x="664" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper position command</text><rect x="910" y="455" width="220" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="924" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Squeeze / grip axis</text><text x="924" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fraction [0, 1]</text><text x="924" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose activation gate</text><rect x="30" y="655" width="1120" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="681" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate the value from its availability</text><text x="44" y="707" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">0 may be a real released input. Inactive / missing action data is a different condition.</text></svg>