<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 950" width="1180" height="950" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">SpaceMouse / ordered conditioning and virtual-pose integration</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">SpaceMouse / ordered conditioning and virtual-pose integration</text><rect x="35" y="75" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw HID sample</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">six normalized axes + timestamp + command mode</text><rect x="650" y="75" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Mode mask BEFORE axis mapping</text><text x="664" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A: translation / B: rotation (registration defaults)</text><path d="M525 120H650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="650" y="215" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="241" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Signed axis map</text><text x="664" y="267" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">choose source axis and sign for each output axis</text><rect x="35" y="215" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="241" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deadzone + rescale</text><text x="49" y="267" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">|a| ≤ d → 0; outside zone → remaining range</text><path d="M895 165V215" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650 260H525" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="355" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="381" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-axis velocity</text><text x="49" y="407" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">v = 10 s_t u [mm/s]</text><text x="49" y="428" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ω = (π/180) 10 s_r u [rad/s]</text><rect x="650" y="355" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="381" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Timestamp gate</text><text x="664" y="407" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">first / invalid / non-increasing → no increment</text><text x="664" y="428" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">positive Δt capped at 0.25 s</text><path d="M280 305V355" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M525 400H650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="545" y="385" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">sample time</text><rect x="35" y="515" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Virtual pose accumulator</text><text x="49" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">o ← o + v Δt</text><text x="49" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">V ← V Exp(ω Δt)</text><rect x="650" y="515" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute task target</text><text x="664" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_cmd = p₀ + o</text><text x="664" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_cmd = V R₀ → RPY degree</text><path d="M895 455V485H280V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M525 570H650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M280 625V660H15V570H35" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="40" y="682" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">carry state to next sample</text><rect x="35" y="735" width="1105" height="155" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="760" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">WORKED EXAMPLE / calculated target increment, not a physical measurement</text><text x="55" y="785" fill="#e1eaf0" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">a = 0.65, d = 0.30  →  u = (0.65 − 0.30) / 0.70 = 0.5</text><text x="55" y="830" fill="#80d0f5" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">s_t = 5, Δt = 0.02 s  →  v_x = 25 mm/s  →  Δx = 0.50 mm</text><text x="55" y="868" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A 1-second gap is capped: 25 × 0.25 = 6.25 mm for that update.</text></svg>