<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Ownership / UI focus, session participants and command targets are not interchangeable</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Ownership / UI focus, session participants and command targets are not interchangeable</text><rect x="30" y="80" width="340" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Move Robot focus</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">one robot selected for a UI action</text><text x="44" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not the full capture / stop scope</text><rect x="430" y="80" width="720" height="110" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="444" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session participant contract</text><text x="444" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ordered robot keys + runtime mapping + end-effector owners</text><text x="444" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source of capture and session-level stop scope</text><path d="M200 190V245H790V190" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="350" y="237" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit session editing</text><rect x="30" y="300" width="540" height="350" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="325" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">STORED DATA / stable semantic ownership</text><rect x="50" y="360" width="500" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="386" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot key A</text><text x="64" y="412" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">arm stream + gripper / hand stream</text><text x="64" y="433" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner metadata survives conversion and checkpoint</text><rect x="50" y="510" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot key B</text><text x="64" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">another independent participant</text><text x="64" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a left/right alias for A</text><rect x="610" y="300" width="540" height="350" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="325" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CURRENT RUNTIME / resolve before dispatch</text><rect x="630" y="360" width="500" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="386" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_key → runtime robot_id</text><text x="644" y="412" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">model + arm + registered end effector</text><text x="644" y="433" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reject ambiguous owner instead of first device</text><rect x="630" y="510" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_key B → live robot B + owned EE</text><text x="644" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">model-specific arm → tool channel</text><text x="644" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw channel 0 does not universally mean left</text><path d="M790 190V300" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M550 412H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M550 557H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="720" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera identity is a parallel contract</text><text x="44" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">camera_key / hardware identity match the physical source; display name is UI metadata.</text><text x="44" y="793" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical camera order preserves the model input contract across capture, training and deploy.</text></svg>