<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 870" width="1180" height="870" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Configuration / preserve intent through a complete persistence round trip</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Configuration / preserve intent through a complete persistence round trip</text><rect x="30" y="85" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1  Edit modal / card</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis / scale / button / profile</text><text x="44" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">local draft and pending state</text><rect x="430" y="85" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2  Request payload</text><text x="444" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">serialize actual chosen fields</text><text x="444" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not registration defaults only</text><rect x="830" y="85" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="844" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3  Backend params</text><text x="844" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">validate + persist</text><text x="844" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner of accepted configuration</text><path d="M350 140H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 140H830" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="830" y="310" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="844" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4  Runtime binding</text><text x="844" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">sync allowlist includes new fields</text><text x="844" y="383" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">worker consumes saved settings</text><rect x="430" y="310" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">5  Status / check response</text><text x="444" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">return current params + live status</text><text x="444" y="383" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">connection and input validity differ</text><rect x="30" y="310" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">6  Render accepted state</text><text x="44" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve saved mappings</text><text x="44" y="383" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">update the actual device badge</text><path d="M990 195V310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M830 365H750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M430 365H350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M190 310V195" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="205" y="265" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">rehydrate</text><rect x="30" y="490" width="1120" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="515" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">IN-FLIGHT EDIT VS PERIODIC REFRESH</text><rect x="50" y="550" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Local edit pending</text><text x="64" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">typing / mode toggle / save</text><text x="64" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">protect the draft lifecycle</text><rect x="430" y="550" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Late stale refresh</text><text x="444" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">old backend value arrives</text><text x="444" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">full redraw can close an editor</text><rect x="830" y="550" width="300" height="115" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="844" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">After acknowledgement</text><text x="844" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rehydrate accepted values</text><text x="844" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">then resume normal refresh</text><path d="M370 610H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="375" y="530" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">compare freshness</text><path d="M750 610H830" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="755" y="530" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">defer / reconcile</text><text x="35" y="820" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Other state: per-camera crop bounds; selected mapping dirty/applied; backend-owned TE guards.</text></svg>