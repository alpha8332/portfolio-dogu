<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1020" width="1180" height="1020" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Capture / freeze identity, project selected streams and preserve timing meaning</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture / freeze identity, project selected streams and preserve timing meaning</text><rect x="30" y="70" width="350" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start request / task + intent</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">recording / stopping / pending save?</text><text x="44" y="143" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot mode + session participants</text><rect x="440" y="70" width="350" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve CapturePlan</text><text x="454" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required streams + selected optional streams</text><text x="454" y="143" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot map + canonical order + blockers</text><rect x="850" y="70" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare writer + worker</text><text x="864" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">session metadata / camera ownership</text><text x="864" y="143" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">cleanup on failed startup</text><path d="M380 120H440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M790 120H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="240" width="1120" height="320" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="265" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LIVE SOURCES / a sample is a collection of separately acquired values</text><rect x="50" y="290" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot A / stable robot_key</text><text x="64" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">measured q, pose, velocity</text><text x="64" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">issued task / gripper / hand targets</text><rect x="425" y="290" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot B / stable robot_key</text><text x="439" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same field names, different owner</text><text x="439" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">namespace prevents cross-routing</text><rect x="800" y="290" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared camera sources</text><text x="814" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">frame + timestamp + validity</text><text x="814" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">full-resolution video sidecars</text><rect x="50" y="450" width="1080" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture tick + projection to persisted keys</text><text x="64" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">timestamps (monotonic) + timestamps.utc; retain only required / selected stream keys</text><path d="M215 390V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 390V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M965 390V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1000 170V210H1165V485H1130" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1080" y="202" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">start</text><rect x="30" y="620" width="1120" height="170" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="645" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TIME MEANING / conceptual</text><text x="50" y="670" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">sample time</text><path d="M240 670H1100" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="300" y="650" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">t0</text><circle cx="300" cy="670" r="5" fill="#80d0f5"/><text x="500" y="650" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">t1</text><circle cx="500" cy="670" r="5" fill="#80d0f5"/><text x="700" y="650" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">t2</text><circle cx="700" cy="670" r="5" fill="#80d0f5"/><text x="900" y="650" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">t3</text><circle cx="900" cy="670" r="5" fill="#80d0f5"/><text x="50" y="720" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">camera frame age</text><path d="M280 720H1080" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="270" y="760" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate device timestamps / validity describe freshness; common rows do not imply hardware triggering.</text><rect x="30" y="850" width="545" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="876" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">HDF5 + metadata</text><text x="44" y="902" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">v4 single-robot / v5 robot-keyed streams</text><text x="44" y="923" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">measured state ≠ issued target ≠ training action</text><rect x="605" y="850" width="545" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="876" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">MP4 + episode decision</text><text x="619" y="902" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">video_files linkage / frame timing</text><text x="619" y="923" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop recording → Save or Reject</text><path d="M590 525V595H15V820H300V850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 595H1165V820H880V850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="990" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Placeholders need declared meaning: a missing recorded target must not become a literal move to the origin.</text></svg>