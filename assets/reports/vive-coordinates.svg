<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Vive / do not confuse origin reset, basis conversion and robot calibration</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive / do not confuse origin reset, basis conversion and robot calibration</text><rect x="30" y="85" width="520" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking pose</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">T_WD = [ R_WD  p_WD ; 0  1 ]</text><text x="44" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">W: tracking universe; D: device frame</text><rect x="630" y="85" width="520" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-device local origin</text><text x="644" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_relative = p_WD − p_first_valid</text><text x="644" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">translation reset only; not robot calibration</text><path d="M550 135H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="240" width="1120" height="230" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="265" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TWO DIFFERENT OPERATIONS</text><rect x="50" y="290" width="510" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Change coordinate components</text><text x="64" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p′ = A p</text><text x="64" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R′ = A R A⁻¹  (same map expressed in a new basis)</text><text x="64" y="384" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position, rotation and velocity must be checked together</text><rect x="610" y="290" width="520" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Map a device frame into another world</text><text x="624" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_BD = R_BW R_WD</text><text x="624" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_BD = R_BW p_WD + t_BW</text><text x="624" y="384" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">left multiplication changes the reference frame</text><rect x="30" y="535" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX robot calibration / align measured displacement directions</text><text x="44" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot axis displacements ↔ measured Vive displacement columns</text><text x="44" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_est = robot_vectors · pinv(vive_vectors) → project to SO(3) → save robot/tracking alignment</text><path d="M870 420V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="715" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Different helper files encode different viewer conventions. Follow the actual import/call path; a filename is not a frame contract.</text><text x="30" y="755" fill="#eab67e" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Mesh mounting offset is a visualization transform. It must not silently become a robot control transform.</text></svg>