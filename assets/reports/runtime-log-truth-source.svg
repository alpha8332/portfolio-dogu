<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Runtime log / stop patching a display fed by another source</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime log / stop patching a display fed by another source</text><rect x="30" y="75" width="1120" height="280" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SYMPTOM / file advances, UI stays at start + run_started</text><rect x="50" y="130" width="310" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Run lifecycle route</text><text x="64" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Start / run_started</text><text x="64" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial application log entries</text><rect x="435" y="130" width="310" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime output / file</text><text x="449" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Later gripper / pause / stop</text><text x="449" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved log continues</text><rect x="820" y="130" width="310" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Old UI status projection</text><text x="834" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Retains initial lines</text><text x="834" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling again returns stale source</text><path d="M360 170H390V285H975V220" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="500" y="275" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">initial projection</text><text x="435" y="310" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Different sources cannot be repaired by faster polling alone.</text><rect x="30" y="410" width="1120" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="435" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FINAL NATIVE DELIVERY / prefer the saved run log</text><rect x="50" y="465" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Active run file</text><text x="64" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Formatted event history</text><text x="64" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Async writer persistence</text><rect x="435" y="465" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dedicated log API</text><text x="449" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved lines first</text><text x="449" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fallback if no saved lines exist</text><rect x="820" y="465" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI log refresh</text><text x="834" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate from status rendering</text><text x="834" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no-store request → text panel</text><path d="M360 515H435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="380" y="502" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">read</text><path d="M745 515H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="765" y="502" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">lines</text><rect x="435" y="640" width="695" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="666" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">External runtime / separate owner</text><text x="449" y="692" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">External-model status log takes priority for the external execution path</text><path d="M975 640V565" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="990" y="610" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">external log</text><text x="30" y="845" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Fallback is not a guarantee that a non-empty saved file is fully caught up with the async writer.</text></svg>