<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1160" width="1240" height="1160" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Linux Vive Collector / runtime, device interpretation and consumer boundaries</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Linux Vive Collector / runtime, device interpretation and consumer boundaries</text><rect x="30" y="70" width="1180" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical tracking setup / HMD-free Linux desktop</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Base Stations → tracked Controller / Tracker → wireless receiver → SteamVR. Runtime owns tracking; Python reads results.</text><rect x="30" y="235" width="355" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">main + builders</text><text x="44" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fixed config path / working directory</text><text x="44" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Build backend, devices, viewer, logger</text><text x="44" y="329" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Enter loop and own cleanup</text><rect x="475" y="235" width="735" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="489" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SteamVR / OpenVR backend</text><text x="489" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Initialize VRApplication_Other; select tracking universe</text><text x="489" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read one tracked pose array per loop; normalize binding return shape</text><path d="M200 155V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M840 155V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M385 290H475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="390" y="274" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">build / start</text><rect x="30" y="440" width="355" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">DeviceManager / config</text><text x="44" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Empty list → class + serial discovery</text><text x="44" y="513" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit list → fixed device binding</text><text x="44" y="534" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve serial to cached runtime index</text><rect x="475" y="440" width="330" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="489" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracker device update</text><text x="489" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose matrix → position + quaternion</text><text x="489" y="513" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">validity + device identity</text><text x="489" y="534" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No controller button payload</text><rect x="850" y="440" width="360" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller device update</text><text x="864" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose + provided linear velocity</text><text x="864" y="513" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller state → axes + masks</text><text x="864" y="534" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input success separate from pose</text><path d="M200 345V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 345V390H640V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 390H1030V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M385 490H475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="393" y="475" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">bindings</text><path d="M385 465H420V405H1030V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="640" width="1180" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="666" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">run_loop / two passes in one application thread</text><text x="44" y="692" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pass 1: gather updates and valid devices. Pass 2: subtract per-device first valid translation.</text><text x="44" y="713" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">All-invalid frame skips sinks. Individual invalid payloads are not real zero measurements.</text><path d="M200 545V640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M640 545V640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1030 545V640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="855" width="355" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="881" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">DataLogger</text><text x="44" y="907" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same corrected device payload</text><text x="44" y="928" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CSV flat fields / JSONL dict</text><text x="44" y="949" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Session + start timestamp filename</text><text x="44" y="970" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No plot-derived acceleration / RPY</text><rect x="440" y="855" width="355" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="881" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PyBullet viewer</text><text x="454" y="907" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Body pose + separate mesh offset</text><text x="454" y="928" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB axes / device label</text><text x="454" y="949" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Local trigger gauge / pad dot</text><text x="454" y="970" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Kinematic debug display</text><rect x="850" y="855" width="360" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="881" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">LivePosePlotter</text><text x="864" y="907" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected device / roles</text><text x="864" y="928" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Position EMA / velocity sources</text><text x="864" y="949" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Acceleration / RPY / state HUD</text><text x="864" y="970" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Draw throttled separately</text><path d="M200 745V855" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M620 745V855" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1030 745V855" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="1105" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Branches are consumer responsibilities, not independent acquisition threads. Viewer/plot work can consume the same loop budget.</text></svg>