<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="1180" height="840" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Jog release / clear accumulated offset and establish a new reference</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Jog release / clear accumulated offset and establish a new reference</text><rect x="30" y="80" width="1120" height="280" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">WHY CLEARING ONLY THE OFFSET FAILS</text><rect x="50" y="140" width="300" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Old reference</text><text x="64" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot reference p0</text><text x="64" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">controller reference x0</text><rect x="420" y="140" width="310" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Jog moves the robot</text><text x="434" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target = pose(p0, x0) + o</text><text x="434" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual robot is now at p1</text><rect x="800" y="140" width="330" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Clear o only</text><text x="814" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target returns to old pose(p0,x0)</text><text x="814" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">unwanted return toward old anchor</text><path d="M350 198H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 198H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="410" width="1120" height="280" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="435" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RE-ANCHOR ON RELEASE</text><rect x="50" y="470" width="300" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read current state</text><text x="64" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current robot pose p1, R1</text><text x="64" y="543" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current controller pose x1, Rx1</text><rect x="420" y="470" width="310" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Update both references</text><text x="434" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot reference ← current pose</text><text x="434" y="543" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">XR reference ← current sample</text><text x="434" y="564" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">accumulated offset ← 0</text><rect x="800" y="470" width="330" height="120" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="814" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Continue from here</text><text x="814" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">release target = current pose</text><text x="814" y="543" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">next motion is relative to new anchor</text><path d="M350 530H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 530H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="40" y="770" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">The reference is part of the control state. Resetting a value without its reference changes the command meaning.</text></svg>