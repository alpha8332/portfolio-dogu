<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Independent robots / stable owner survives changing screen focus</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Independent robots / stable owner survives changing screen focus</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session config</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">participants + stable robot_order + primary focus; active robot is not the session</text><path d="M590 160V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280" y="205" width="620" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="231" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Freeze capture contract</text><text x="294" y="257" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_id ↔ robot_key / model / dimensions / owned EE</text><path d="M590 295V345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="345" width="1120" height="210" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="370" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ONE RAW V5 EPISODE / common source sample index</text><rect x="50" y="395" width="515" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.alpha.*</text><text x="64" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">proprio / teleop command / gripper / hand</text><text x="64" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner metadata: robot A, single arm</text><text x="64" y="489" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity example is anonymized</text><rect x="610" y="395" width="520" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.beta.*</text><text x="624" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">proprio / teleop command / gripper / hand</text><text x="624" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner metadata: robot B, single arm</text><text x="624" y="489" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not left/right segments of one dual-arm robot</text><path d="M305 510V585H590V620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M870 510V585H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280" y="620" width="620" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="646" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical training keys + model contract</text><text x="294" y="672" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ordered robot_keys / robot_map / ee_contract</text><text x="294" y="693" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">observation.robot.&lt;key&gt;.* / action.robot.&lt;key&gt;.*</text><path d="M590 710V755" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="755" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="781" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deploy routing</text><text x="44" y="807" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action owner key → checked robot_id → exact worker → robot-owned end effector; no first-robot fallback</text></svg>