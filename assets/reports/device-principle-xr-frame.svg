<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">OpenXR / frame lifecycle, sample clocks and shared runtime ownership</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">OpenXR / frame lifecycle, sample clocks and shared runtime ownership</text><rect x="35" y="75" width="1110" height="170" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HOST RUNTIME</text><rect x="55" y="120" width="315" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session + action definitions</text><text x="69" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">left/right subaction paths</text><text x="69" y="193" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose / float / boolean inputs</text><rect x="425" y="120" width="315" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime input sources</text><text x="439" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">interaction profile / focus</text><text x="439" y="193" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tracking + controller states</text><rect x="795" y="120" width="330" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Graphics / frame contract</text><text x="809" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reference space + optional layer</text><text x="809" y="193" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">keeps the session progressing</text><path d="M370 167H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 167H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="130" y="310" width="980" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="144" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Sync and query action state</text><text x="144" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">value + isActive, boolean + isActive, current interaction profile</text><path d="M620 400V445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="130" y="445" width="980" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="144" y="471" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2. Wait frame → begin frame</text><text x="144" y="497" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">runtime provides predicted display time</text><path d="M620 535V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="130" y="580" width="980" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="144" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3. Locate hand spaces at predicted time</text><text x="144" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position valid AND orientation valid → position [m] + quaternion [x,y,z,w]</text><path d="M620 670V715" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="130" y="715" width="980" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="144" y="741" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4. Publish latest snapshot → end frame</text><text x="144" y="767" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">application timestamp / both hands / session state; submit required layer</text><path d="M1110 760H1155V350H1110" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1040" y="280" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next frame</text><rect x="35" y="870" width="515" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="896" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot worker consumes snapshot</text><text x="49" y="922" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">binding + gates + coordinate transform</text><text x="49" y="943" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no second independent live XR owner</text><rect x="630" y="870" width="515" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="896" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI / diagnostics read same owner</text><text x="644" y="922" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">do not infer robot execution from pose alone</text><text x="644" y="943" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">wall timestamp ≠ predicted-time clock</text><path d="M450 805V870" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M850 805V870" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>