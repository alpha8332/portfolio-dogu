<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Time semantics / feedback, issued command and previous-command context</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Time semantics / feedback, issued command and previous-command context</text><text x="30" y="100" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Illustrative sample index →</text><text x="430" y="100" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">t=0</text><text x="605" y="100" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">t=1</text><text x="780" y="100" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">t=2</text><text x="955" y="100" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">t=3</text><text x="30" y="183" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured joint feedback</text><rect x="390" y="150" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="404" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q0</text><rect x="565" y="150" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="579" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q1</text><rect x="740" y="150" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="754" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q2</text><rect x="915" y="150" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="929" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q3</text><text x="30" y="318" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Issued grasp command</text><rect x="390" y="285" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="404" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u0</text><rect x="565" y="285" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="579" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u1</text><rect x="740" y="285" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="754" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u2</text><rect x="915" y="285" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="929" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u3</text><text x="30" y="453" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Previous-command input</text><rect x="390" y="420" width="145" height="65" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="404" y="446" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u0*</text><rect x="565" y="420" width="145" height="65" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="579" y="446" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u0</text><rect x="740" y="420" width="145" height="65" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="754" y="446" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u1</text><rect x="915" y="420" width="145" height="65" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="929" y="446" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u2</text><path d="M462 350L637 420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M637 350L812 420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M812 350L987 420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="590" width="1120" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">The temporal contract</text><text x="44" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Feedback q_t observes the robot; command u_t is the requested action, not measured contact force.</text><text x="44" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">For t≥1, previous-command input is u_(t−1). The first training row repeats u0 (*boundary convention).</text><text x="44" y="684" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Legacy joint target fallback uses recorded feedback at the same sample in this conversion path.</text><text x="44" y="705" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This is an approximation of demonstrated motion, not recovery of an unrecorded issued target.</text></svg>