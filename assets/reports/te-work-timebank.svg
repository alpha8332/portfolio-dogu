eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 3</text><text x="799" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target 14</text><text x="35" y="367" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">query 12</text><rect x="535" y="335" width="115" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="549" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 0</text><text x="549" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target 12</text><rect x="660" y="335" width="115" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 1</text><text x="674" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target 13</text><rect x="785" y="335" width="115" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="799" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 2</text><text x="799" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target 14</text><rect x="910" y="335" width="115" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="924" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 3</text><text x="924" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target 15</text><path d="M590 410V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="625" y="446" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">current target = 12</text><rect x="285" y="475" width="540" height="110" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="299" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Candidates in append order / oldest → newest</text><text x="299" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q10: A[2]    +    q11: A[1]    +    q12: A[0]</text><text x="299" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Different query origins, one shared execution step</text><rect x="30" y="630" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Expired chunks</text><text x="44" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q=8, H=4 → targets 8…11</text><text x="44" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q + H ≤ 12 → prune before blending</text><rect x="600" y="630" width="550" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Future query is not available</text><text x="614" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q=13 has not run at step 12</text><text x="614" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preview uses the current bank, not future observations</text><text x="35" y="780" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Illustrative H=4 example. q/t are logical inference steps; they are not seconds or servo ticks.</text></svg>