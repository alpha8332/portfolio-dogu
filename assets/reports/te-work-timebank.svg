<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 810" width="1180" height="810" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Temporal alignment / collect a column, not a chunk offset</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Temporal alignment / collect a column, not a chunk offset</text><text x="32" y="90" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Query start q</text><text x="315" y="100" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">step 10</text><text x="440" y="100" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">step 11</text><text x="565" y="100" fill="#80d0f5" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">step 12</text><text x="690" y="100" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">step 13</text><text x="815" y="100" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">step 14</text><text x="940" y="100" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">step 15</text><text x="35" y="167" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">query 10</text><rect x="285" y="135" width="115" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="299" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">offset 0</text><text x="299" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target 10</text><rect x="410" y="135" width="115" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="424" y="161" fill="#e1eaf0" font-size=