<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">MiMicX / from operator intent to three different sources of action</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX / from operator intent to three different sources of action</text><rect x="35" y="75" width="1110" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Configure identities and runtime bindings</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robots + end effectors / teaching devices / cameras / calibration / stable session order</text><path d="M590 160V185H260V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="205" width="450" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="231" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Move Robot / verify the live setup</text><text x="49" y="257" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner, mode, telemetry and end-effector readiness</text><rect x="655" y="205" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="231" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Collect / freeze task capture contract</text><text x="669" y="257" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required + selected streams → CapturePlan</text><path d="M485 250H655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="515" y="238" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">ready setup</text><rect x="655" y="345" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Episode / immutable raw evidence</text><text x="669" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HDF5 state + commands + MP4 + timestamps / validity</text><path d="M900 295V345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="490" width="350" height="330" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="515" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">NATIVE / model trained inside MiMicX</text><rect x="55" y="535" width="310" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect + curate + preprocess</text><text x="69" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">selection / crop / IO / representation</text><rect x="55" y="670" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="696" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Train → checkpoint contract</text><text x="69" y="722" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT or Diffusion / weights + metadata</text><text x="69" y="743" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">artifact and device compatibility</text><path d="M210 620V670" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="415" y="490" width="350" height="330" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="427" y="515" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EXTERNAL / supplied trained model</text><rect x="435" y="535" width="310" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Research-team result</text><text x="449" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">checkpoint + processors + calibration</text><rect x="435" y="670" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="696" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Bundle adapter + prepared worker</text><text x="449" y="722" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw observation → policy → translated action</text><text x="449" y="743" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no native training required</text><path d="M590 620V670" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="795" y="490" width="350" height="330" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="807" y="515" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">REPLAY / recorded action source</text><rect x="815" y="535" width="310" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Select recorded episode</text><text x="829" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">recorded targets + source timeline</text><rect x="815" y="670" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="696" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial alignment → replay</text><text x="829" y="722" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">recording is consumed in time order</text><text x="829" y="743" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no learned action prediction</text><path d="M970 620V670" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M900 430V455H400V520H210V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="455" y="447" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">raw + curation</text><path d="M900 455H1160V520H970V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="895" width="1110" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="921" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Owner-resolved execution / shared hardware boundary</text><text x="49" y="947" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">live robot state + command conversion + mode checks + explicit stop / cleanup</text><text x="49" y="968" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Native inference, external rollout and Replay have different action sources and validation meanings.</text><path d="M210 770V895" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 770V895" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 770V895" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>