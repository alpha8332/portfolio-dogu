<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1050" width="1180" height="1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Documentation / start from a question, then find the owner</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Documentation / start from a question, then find the owner</text><rect x="30" y="85" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">New developer</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">What is the system?</text><text x="44" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Where do I start?</text><rect x="420" y="85" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Maintainer</text><text x="434" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Where does this behavior live?</text><text x="434" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">What must stay compatible?</text><rect x="810" y="85" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator / installer</text><text x="824" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">What must be prepared?</text><text x="824" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">What should I observe?</text><rect x="30" y="245" width="340" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Onboarding</text><text x="44" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">purpose → flow → repo map</text><text x="44" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">run/test → first-task checklist</text><text x="44" y="339" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">a path into the system</text><rect x="420" y="245" width="340" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Developer manual + features</text><text x="434" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">screen → intent → backend owner</text><text x="434" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">state / artifact / failure path</text><text x="434" y="339" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">links to exact definitions</text><rect x="810" y="245" width="340" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runbooks</text><text x="824" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">first setup vs daily operation</text><text x="824" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preconditions / steps / checks</text><text x="824" y="339" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">stop and recovery notes</text><path d="M200 185V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 185V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 185V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="420" width="1120" height="255" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="445" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SHARED DEFINITIONS / one authoritative home for each fact</text><rect x="50" y="470" width="330" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">API reference</text><text x="64" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">request / response / status</text><text x="64" y="543" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">compatibility and error meaning</text><text x="64" y="564" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not copied into every manual</text><rect x="420" y="470" width="330" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Data reference</text><text x="434" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">schema: key / order / shape</text><text x="434" y="543" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">metadata: owner / time / lineage</text><text x="434" y="564" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">checkpoint and artifact meaning</text><rect x="790" y="470" width="340" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device / package reference</text><text x="804" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity / profile / lifecycle</text><text x="804" y="543" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reusable package boundaries</text><text x="804" y="564" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">precise current definitions</text><path d="M200 360V420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 360V420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 360V420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="745" width="530" height="120" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="771" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Implementation + verification</text><text x="44" y="797" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">route / service / package / artifact</text><text x="44" y="818" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">focused tests + actual environment checks</text><text x="44" y="839" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">follow a behavior across boundaries</text><rect x="610" y="745" width="540" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="771" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rationale + history</text><text x="624" y="797" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">development notes / incidents / handoff</text><text x="624" y="818" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">why a choice changed, what was learned</text><text x="624" y="839" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a competing current contract</text><path d="M590 675V705H295V745" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="365" y="698" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">navigate to owner</text><path d="M880 745V705H750V675" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="840" y="725" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">promote current facts</text><path d="M560 805H610" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="565" y="790" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">context</text><text x="35" y="940" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Different entry paths, shared definitions. A reader does not need to read every document in sequence.</text><text x="35" y="990" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Original explanatory reconstruction of the authored documentation taxonomy and reader paths.</text></svg>