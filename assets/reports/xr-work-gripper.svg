<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Gripper / input fraction, owned tool and command representation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Gripper / input fraction, owned tool and command representation</text><rect x="30" y="90" width="300" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trigger input</text><text x="44" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clamp fraction to [0, 1]</text><text x="44" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">click-only fallback gives endpoints</text><rect x="420" y="90" width="310" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve owner + tool</text><text x="434" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">binding → robot / arm</text><text x="434" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">open / close / force settings</text><rect x="820" y="90" width="330" height="115" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="834" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpolate position</text><text x="834" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q_open + (q_close − q_open) × f</text><text x="834" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">integer range in this path: 0…1000</text><path d="M330 145H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 145H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="270" width="1120" height="255" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="295" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CALCULATION EXAMPLE / q_open = 1000, q_close = 0</text><rect x="55" y="330" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">fraction 0.00</text><text x="69" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position command 1000</text><text x="69" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a distance in millimeters</text><rect x="430" y="330" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">fraction 0.30</text><text x="444" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position command 700</text><text x="444" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a distance in millimeters</text><rect x="805" y="330" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">fraction 1.00</text><text x="819" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position command 0</text><text x="819" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a distance in millimeters</text><rect x="30" y="580" width="1120" height="200" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="605" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">THREE DIFFERENT TIME SEMANTICS</text><rect x="50" y="635" width="320" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Analog</text><text x="64" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">continuous fraction</text><text x="64" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">intermediate positions</text><rect x="430" y="635" width="320" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hold / binary</text><text x="444" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">threshold transitions</text><text x="444" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">open or close</text><rect x="810" y="635" width="320" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Toggle</text><text x="824" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rising edge only</text><text x="824" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hold does not retrigger</text><text x="35" y="825" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">An optional force command precedes position; this mapping is not a force-feedback controller.</text></svg>