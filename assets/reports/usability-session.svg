<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Usability / operating conditions, observations and analysis ownership</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Usability / operating conditions, observations and analysis ownership</text><rect x="35" y="90" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Participant</text><text x="49" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Operate assigned device</text><text x="49" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Attempt the physical task</text><rect x="430" y="90" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device → robot → material</text><text x="444" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking / target / grasp / deformation</text><text x="444" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task success depends on the entire loop</text><rect x="825" y="90" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">My support role</text><text x="839" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Guide + set robot + observe</text><text x="839" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Measure / record + respond to faults</text><path d="M345 140H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M825 140H740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="35" y="265" width="1100" height="250" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="290" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SEPARATE WHAT WAS RECORDED FROM WHAT CAUSED IT</text><rect x="55" y="315" width="310" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Time</text><text x="69" y="367" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Duration of one task execution</text><text x="69" y="388" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not full session duration</text><text x="69" y="409" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep task definition attached</text><rect x="420" y="315" width="310" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trial</text><text x="434" y="367" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Attempts required until success</text><text x="434" y="388" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not participant count</text><text x="434" y="409" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not automatically a repeat number</text><rect x="785" y="315" width="330" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="799" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Context / confounders</text><text x="799" y="367" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Device + settings + task state</text><text x="799" y="388" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Learning and order can change results</text><text x="799" y="409" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Faults need separate interpretation</text><path d="M190 190V315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 190V315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 190V315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="590" width="505" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">My deliverable</text><text x="49" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Usable setup + operational support + task records</text><text x="49" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not automatic scoring or device model development</text><rect x="630" y="590" width="505" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">POSCO analysis</text><text x="644" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpretation and final evaluation</text><text x="644" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No inferred causal device ranking in this report</text><path d="M585 515V550H285V590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M540 640H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="558" y="627" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">handoff</text><text x="35" y="745" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Evaluation record is not a controlled comparative study unless participant structure, order and success criteria are established.</text></svg>