<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="title"><title id="title">Release Test Web UI / Index and Sheet Contract</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8caabb"/></marker></defs><rect width="1000" height="410" fill="#141a1e"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#dbe5eb}.label{fill:#85c9ed;font-size:13px}.detail{fill:#9db0bb;font-size:13px}.head{font-size:17px;font-weight:600}</style><text x="32" y="40" font-size="22" font-weight="600">Release Test Web UI / Index and Sheet Contract</text><text x="32" y="98" class="label">READ</text><rect x="190" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="100" class="head">Required header row</text><text x="204" y="154" class="detail">scan and map field names</text><rect x="450" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="100" class="head">Actual data rows</text><text x="464" y="154" class="detail">exclude formatting-only rows</text><path d="M425 122 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="72" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="100" class="head">Display hierarchy</text><text x="724" y="154" class="detail">forward-fill screen / tab / feature</text><path d="M685 122 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="238" class="label">WRITE</text><rect x="190" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="240" class="head">UI item index</text><text x="204" y="294" class="detail">zero-based current case</text><rect x="450" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="240" class="head">data_rows[index]</text><text x="464" y="294" class="detail">actual Excel row</text><path d="M425 262 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="212" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="240" class="head">V / W / W3</text><text x="724" y="294" class="detail">result / timestamp / inspector</text><path d="M685 262 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><line x1="32" y1="358" x2="968" y2="358" stroke="#34434c"/><text x="32" y="385" class="detail">내용 헤더 탐색과 결과 고정열 계약은 다르다. 이 보존 버전의 worksheet 구조를 설명한다.</text></svg>