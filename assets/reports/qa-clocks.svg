<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title"><title id="title">Integrity / Valid, Reused and Updated Samples</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8caabb"/></marker></defs><rect width="1000" height="550" fill="#141a1e"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#dbe5eb}.label{fill:#85c9ed;font-size:13px}.detail{fill:#9db0bb;font-size:13px}.head{font-size:17px;font-weight:600}</style><text x="32" y="40" font-size="22" font-weight="600">Integrity / Valid, Reused and Updated Samples</text><text x="32" y="98" class="label">VALIDITY</text><rect x="190" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="100" class="head">Capture rows</text><text x="204" y="154" class="detail">total N</text><rect x="450" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="100" class="head">Device valid rows</text><text x="464" y="154" class="detail">Nvalid</text><path d="M425 122 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="72" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="100" class="head">Validity ratio</text><text x="724" y="154" class="detail">Nvalid / N</text><path d="M685 122 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="238" class="label">REUSE</text><rect x="190" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="240" class="head">Adjacent valid timestamps</text><text x="204" y="294" class="detail">same device timestamp</text><rect x="450" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="240" class="head">Reused rows</text><text x="464" y="294" class="detail">cached sample repeated</text><path d="M425 262 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="212" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="240" class="head">Updated count</text><text x="724" y="294" class="detail">Nvalid − Nreused</text><path d="M685 262 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="378" class="label">TIME</text><rect x="190" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="380" class="head">device − sample time</text><text x="204" y="434" class="detail">raw delta</text><rect x="450" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="380" class="head">Subtract first finite delta</text><text x="464" y="434" class="detail">remove initial static offset</text><path d="M425 402 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="352" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="380" class="head">Relative drift / jitter</text><text x="724" y="434" class="detail">not absolute physical latency</text><path d="M685 402 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><line x1="32" y1="498" x2="968" y2="498" stroke="#34434c"/><text x="32" y="525" class="detail">지표의 정의를 설명한다. 실제 episode 수치·수집 성능 그래프는 포함하지 않는다.</text></svg>