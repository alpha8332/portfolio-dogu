<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Two independent robots / focus, session and device ownership</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Two independent robots / focus, session and device ownership</text><rect x="25" y="65" width="1130" height="215" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONFIGURATION / individual focus is not the full session</text><rect x="45" y="110" width="325" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Move Robot / selected robot</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One robot receives manual intent</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved positions belong to that robot</text><text x="59" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">End-tool controls keep the owner</text><rect x="425" y="110" width="325" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session contract</text><text x="439" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Participants A + B</text><text x="439" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stable order / primary focus</text><text x="439" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot keys identify stored owners</text><rect x="810" y="110" width="325" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture Plan / selected task</text><text x="824" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Required streams / cameras</text><text x="824" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Owned arm and hand data</text><text x="824" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Freeze a concrete recording contract</text><path d="M750 170H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="755" y="150" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve</text><rect x="25" y="330" width="550" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="355" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PARTICIPANT A / independent single-arm robot</text><rect x="45" y="375" width="235" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input A</text><text x="59" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose / buttons / calibration</text><text x="59" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Binding to robot A</text><rect x="325" y="375" width="230" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot A worker</text><text x="339" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Own state / arm target</text><text x="339" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Own motion mode</text><rect x="325" y="520" width="230" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="546" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">End effector A</text><text x="339" y="572" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot-scoped owner</text><text x="339" y="593" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Feedback / command</text><path d="M280 425H325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M440 475V520" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="605" y="330" width="550" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="617" y="355" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PARTICIPANT B / independent single-arm robot</text><rect x="625" y="375" width="235" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input B</text><text x="639" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose / buttons / calibration</text><text x="639" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Binding to robot B</text><rect x="905" y="375" width="230" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="919" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot B worker</text><text x="919" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Own state / arm target</text><text x="919" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Own motion mode</text><rect x="905" y="520" width="230" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="919" y="546" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">End effector B</text><text x="919" y="572" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot-scoped owner</text><text x="919" y="593" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Feedback / command</text><path d="M860 425H905" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1020 475V520" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 230V425H555" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 305H1165V425H1135" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="650" y="298" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">session routing</text><rect x="45" y="715" width="510" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="741" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture / one shared sample axis</text><text x="59" y="767" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read participant snapshots per capture tick</text><text x="59" y="788" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot-keyed data + selected camera streams</text><text x="59" y="809" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One episode retains robot order and EE ownership</text><text x="59" y="830" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared sample time is not a measured sync guarantee</text><rect x="625" y="715" width="510" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="741" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Later consumers</text><text x="639" y="767" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Visualization groups signals by stored owner</text><text x="639" y="788" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay routes targets to each participant</text><text x="639" y="809" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Training builds robot-keyed observation / action</text><text x="639" y="830" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint preserves the execution contract</text><path d="M440 605V675H300V715" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1020 605V675H300" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 790H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="559" y="780" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">handoff</text><text x="45" y="960" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A/B denote independent owners. Stable order and explicit ownership persist across recording and downstream use.</text></svg>