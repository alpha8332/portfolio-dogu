<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" width="1180" height="830" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Robot hand / stable ownership from capture to physical dispatch</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot hand / stable ownership from capture to physical dispatch</text><rect x="30" y="75" width="1120" height="190" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RAW EPISODE / runtime identifiers are recording addresses, not semantic owners</text><rect x="50" y="120" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Feedback streams</text><text x="64" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">joint position / velocity</text><text x="64" y="193" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">timestamp / validity</text><rect x="425" y="120" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command streams</text><text x="439" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">joint target / grasp state</text><text x="439" y="193" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">mode / force</text><rect x="800" y="120" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Persisted attachment metadata</text><text x="814" y="172" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">runtime → side or robot_key</text><text x="814" y="193" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">profile / joint count</text><path d="M965 220V280H780V310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M215 220V290H590V310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 220V310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="300" y="310" width="580" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="314" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve owner + profile before conversion</text><text x="314" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ambiguous attachment / duplicate owner / width change → block</text><text x="314" y="383" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">never infer ownership from list order or vector length</text><path d="M450 410V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 410V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="460" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical observation</text><text x="44" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand joint feedback + previous-step grasp command</text><text x="44" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">side-qualified legacy / robot-keyed multi-robot keys</text><rect x="610" y="460" width="540" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical action</text><text x="624" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit joint command preferred; legacy feedback fallback tagged</text><text x="624" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">grasp state / mode / force retain distinct meanings</text><path d="M295 565V605H590V640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 565V605H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="300" y="640" width="580" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="314" y="666" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint → deployment preflight → exact runtime hand</text><text x="314" y="692" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner + profile + joint count + chosen action source</text><text x="314" y="713" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">primitive and joint command arbitration before SDK dispatch</text><text x="30" y="795" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A 18-value hand vector can be numerically valid while addressing the wrong hand. Identity is part of correctness.</text></svg>