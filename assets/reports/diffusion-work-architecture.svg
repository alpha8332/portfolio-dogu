<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1250" width="1180" height="1250" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Diffusion integration / one model family across training and deploy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Diffusion integration / one model family across training and deploy</text><rect x="30" y="75" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training UI / public Diffusion U-Net</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected observation/action keys + common training fields + provider-owned diffusion settings</text><rect x="30" y="230" width="1120" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend resolver + readiness</text><text x="44" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No images → lowdim | RGB → rgb | Depth → block</text><text x="44" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Persist family / provider / base recipe / resolved recipe; ACT auxiliary head stays disabled</text><path d="M590 155V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="610" y="193" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">intent</text><rect x="30" y="390" width="530" height="450" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="415" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING / existing job lifecycle</text><rect x="50" y="440" width="490" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Standard dataloader</text><text x="64" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical observations + future action chunk + is_pad</text><rect x="50" y="580" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Diffusion adapter → provider → policy</text><text x="64" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Build family config / create lowdim or RGB policy</text><text x="64" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy packs keys, predicts noise and computes masked MSE</text><rect x="50" y="730" width="490" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared optimizer + job / checkpoint save</text><text x="64" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Backward / update / metrics / resume / lineage</text><path d="M295 320V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 520V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 670V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="620" y="390" width="530" height="450" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="415" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DEPLOY / checkpoint-first reconstruction</text><rect x="640" y="440" width="490" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Provider bundle loader</text><text x="654" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Config + stats + state_dict + IO / camera contract</text><rect x="640" y="580" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live inference preprocessor</text><text x="654" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB rolling buffer / companion state history</text><text x="654" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Missing frames and camera order checked</text><rect x="640" y="730" width="490" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Diffusion executor</text><text x="654" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Empty queue → denoise → enqueue first T_a actions</text><text x="654" y="803" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One action per runtime step</text><path d="M885 320V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 520V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 670V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="920" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="946" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Portable bundle / execution requirements</text><text x="44" y="972" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">family + provider + recipes + provider_config</text><text x="44" y="993" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">key order / shapes / normalizers / camera order</text><text x="44" y="1014" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">vision_contract + training lineage</text><path d="M295 810V920" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 970H590V480H640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="595" y="901" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">load</text><rect x="620" y="920" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="946" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Split and dispatch / existing robot path</text><text x="634" y="972" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Flat action → key slices → 6D rotation restoration</text><text x="634" y="993" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ command builder → backend actuator</text><text x="634" y="1014" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No external-model / SCDP worker in this path</text><path d="M885 810V920" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="1100" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="1126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical robot and cameras → next observation</text><text x="44" y="1152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot / hand state + selected camera frames feed live input. Denoising and queue consumption use different clocks.</text><path d="M885 1025V1100" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1150 1140H1170V625H1130" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/></svg>