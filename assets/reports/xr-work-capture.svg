<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1110" width="1180" height="1110" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Capture and mode actions / same input, different state owners</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture and mode actions / same input, different state owners</text><rect x="30" y="80" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Primary / secondary rising edge → selected application action</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">None | collect_start | collect_stop | robot_idle | robot_task_teleop</text><rect x="30" y="225" width="540" height="655" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="250" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">START / preserve the current robot mode</text><rect x="50" y="285" width="500" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Choose task</text><text x="64" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current Collect selection in backend</text><text x="64" y="358" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">non-empty legacy task override takes precedence</text><rect x="50" y="450" width="500" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing start + preflight</text><text x="64" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no task → reject / recording → skip</text><text x="64" y="523" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">awaiting save → reject / readiness checks</text><rect x="50" y="630" width="500" height="110" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="64" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start recording</text><text x="64" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same backend capture path</text><text x="64" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve_robot_mode: no forced TeleT</text><path d="M300 165V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M300 390V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M300 560V630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="610" y="225" width="540" height="655" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="250" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">STOP / cleanup then Idle</text><rect x="630" y="285" width="500" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing capture stop</text><text x="644" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not recording / not stopping → skip</text><text x="644" y="358" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">otherwise complete recording cleanup</text><rect x="630" y="450" width="500" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session-owned robot set</text><text x="644" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">use session robot IDs / order</text><text x="644" y="523" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not only the robot currently selected in UI</text><rect x="630" y="630" width="500" height="110" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="644" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Idle transition + real teleop stop</text><text x="644" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">stored TeleT OR live op=17 → stop teleop</text><text x="644" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">backend transition remains the owner</text><path d="M880 165V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 390V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 560V630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="930" width="1120" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="956" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dedicated mode buttons use the effective current mode</text><text x="44" y="982" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Idle → TaskTeleop and TeleT → Idle are application transitions.</text><text x="44" y="1003" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A stale stored Idle must not suppress stopping a robot whose live operation state is TeleT.</text></svg>