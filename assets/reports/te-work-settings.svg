<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">TE configuration / state ownership and diagnostic feedback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">TE configuration / state ownership and diagnostic feedback</text><rect x="30" y="75" width="340" height="690" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BROWSER / thin controls</text><rect x="50" y="125" width="300" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deploy controls</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">enabled / schedule / alpha</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no duplicated blending logic</text><text x="64" y="219" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no independent model guard</text><rect x="50" y="520" width="300" height="165" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="546" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">State and explanation</text><text x="64" y="572" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rehydrate controls after reload</text><text x="64" y="593" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source count / weights / query steps</text><text x="64" y="614" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">guard message + actionable hint</text><text x="64" y="635" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">render backend-resolved state</text><rect x="410" y="75" width="740" height="690" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="422" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BACKEND / authoritative settings and execution</text><rect x="435" y="125" width="320" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Settings + inference state</text><text x="449" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">validate and normalize fields</text><text x="449" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">false / exp / 4.0 defaults</text><text x="449" y="219" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">configuration update → bank reset</text><rect x="800" y="125" width="325" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preset snapshot</text><text x="814" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">save the same three fields</text><text x="814" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">restore through runtime settings</text><text x="814" y="219" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">retain the execution condition</text><path d="M350 185H435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="365" y="170" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">intent</text><path d="M755 185H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="761" y="170" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">save</text><path d="M965 255V290H595V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="777" y="282" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">restore</text><rect x="435" y="335" width="690" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Run preflight / runtime guard</text><text x="449" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT family + non-RTC + horizon ≥ 2 → execute; otherwise structured guard</text><path d="M595 255V335" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="435" y="510" width="320" height="180" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">TE engine + worker</text><text x="449" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">append / select / blend</text><text x="449" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source_count / query_steps</text><text x="449" y="604" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weights / overlap_active</text><text x="449" y="625" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">latest auxiliary scalar</text><text x="449" y="646" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normal action command path</text><rect x="800" y="510" width="325" height="180" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Status contract</text><text x="814" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">settings / infer-status / status</text><text x="814" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same TE setting fields</text><text x="814" y="604" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current summary / guard</text><text x="814" y="625" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI state is not client default</text><path d="M595 435V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M965 435V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="977" y="480" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">failure or status</text><path d="M755 600H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M965 690V725H390V600H350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="455" y="717" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">resolved state</text><text x="35" y="820" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">enabled=true is a setting. source_count&gt;1 is evidence of overlap. Neither is a task-success score.</text><text x="35" y="865" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep diagnostic polling outside control ownership; stale UI does not by itself prove a missing robot command.</text></svg>