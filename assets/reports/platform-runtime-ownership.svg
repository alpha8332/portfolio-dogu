<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1100" width="1180" height="1100" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">MiMicX / deployment, process ownership and the three kinds of bridge</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX / deployment, process ownership and the three kinds of bridge</text><rect x="30" y="65" width="1120" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="91" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser / render status and submit intent</text><text x="44" y="117" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Configurations → Operations → Data &amp; Models</text><rect x="30" y="170" width="1120" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="196" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI gateway / route proxy</text><text x="44" y="222" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">one operator entrypoint; service-owned state is not copied into the browser</text><path d="M590 130V170" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="290" width="360" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="315" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DEVICE–DATA</text><rect x="50" y="345" width="320" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Routes + app services</text><text x="64" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">registration / devices / collection</text><rect x="50" y="475" width="320" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend-owned state</text><text x="64" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">registry or jobs or loaded runtime</text><path d="M210 235V345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M210 435V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="410" y="290" width="360" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="422" y="315" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DATA–STUDIO</text><rect x="430" y="345" width="320" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Routes + app services</text><text x="444" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inspection / curation / Replay / training</text><rect x="430" y="475" width="320" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend-owned state</text><text x="444" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">registry or jobs or loaded runtime</text><path d="M590 235V345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 435V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="790" y="290" width="360" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="802" y="315" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MODEL–RUNTIME</text><rect x="810" y="345" width="320" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Routes + app services</text><text x="824" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">native inference / external bundles</text><rect x="810" y="475" width="320" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend-owned state</text><text x="824" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">registry or jobs or loaded runtime</text><path d="M970 235V345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 435V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 555V630H210V555" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="350" y="620" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit live registry / status read-through</text><path d="M970 555V660H210V555" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="390" y="652" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">live runtime sources are resolved through owning contracts</text><rect x="30" y="705" width="545" height="215" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="730" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HOST / hardware and desktop-session dependencies</text><rect x="50" y="750" width="230" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="776" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Direct USB device access</text><text x="64" y="802" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SpaceMouse HID / cameras</text><text x="64" y="823" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity + permissions + nodes</text><text x="64" y="844" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">container adapters / SDKs</text><rect x="310" y="750" width="245" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="324" y="776" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host VR runtime</text><text x="324" y="802" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SteamVR / WiVRn–OpenXR</text><text x="324" y="823" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normalized snapshot bridge</text><text x="324" y="844" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">socket + shared memory</text><path d="M165 750V675H15V380H50" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="694" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">device sources</text><path d="M430 750V690H395V420H370" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="440" y="683" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">snapshot contract</text><rect x="625" y="750" width="505" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="776" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared workspace / persisted artifacts</text><text x="639" y="802" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">captures + videos / curation + preprocess settings</text><text x="639" y="823" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">training manifests + checkpoints / calibration + logs</text><text x="639" y="844" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">shared files do not share process-local Python objects</text><path d="M590 590V725H880V750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M970 590V725H880V750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="30" y="975" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="1001" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reusable packages / explicit dependencies</text><text x="44" y="1027" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">core + runtime contracts | data / preprocess / training / inference | HW adapter seam + vendor SDKs</text></svg>