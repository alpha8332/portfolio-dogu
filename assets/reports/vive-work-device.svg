<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="1180" height="840" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Device lifecycle / discovery and pose validity do not establish input availability</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Device lifecycle / discovery and pose validity do not establish input availability</text><rect x="30" y="75" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start with config.devices</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Choose discovery or fixed serial list; public identifiers below are illustrative aliases</text><rect x="30" y="240" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Automatic discovery</text><text x="44" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Scan OpenVR classes + connection flags</text><text x="44" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep Controller / GenericTracker</text><text x="44" y="334" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Create names from serial suffix</text><rect x="620" y="240" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit device configuration</text><text x="634" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fixed name / role / serial / type</text><text x="634" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input options + visual options</text><text x="634" y="334" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Repeatable device binding</text><path d="M295 155V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 155V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="435" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve physical identity → runtime array slot</text><text x="44" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Find matching serial, cache index, then read frame_poses[index]. A runtime index is not a persistent identity.</text><path d="M295 345V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 345V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="625" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose invalid / unresolved</text><text x="44" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">valid=false; placeholder pose is not a measurement</text><text x="44" y="698" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Viewer / plot do not apply it</text><text x="44" y="719" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">All-invalid loop → no consumer pass</text><rect x="620" y="625" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose valid</text><text x="634" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Position + normalized quaternion</text><text x="634" y="698" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller additionally requests input state</text><text x="634" y="719" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input absence is distinct from a released button</text><path d="M295 530V625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 530V625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>