<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Run lifecycle / isolate a new run and observe without changing control</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Run lifecycle / isolate a new run and observe without changing control</text><rect x="30" y="100" width="260" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Begin run</text><text x="44" y="152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">New active file</text><text x="44" y="173" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reset memory + dedupe</text><rect x="325" y="100" width="260" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start returns</text><text x="339" y="152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">run_started event</text><text x="339" y="173" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not first-motion proof</text><rect x="620" y="100" width="260" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe</text><text x="634" y="152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Major output changes</text><text x="634" y="173" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Ignore old output time</text><rect x="915" y="100" width="260" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="929" y="126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause / stop</text><text x="929" y="152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit route events</text><text x="929" y="173" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Completion from state</text><path d="M290 158H325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 158H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 158H915" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="280" width="545" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="305" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">NORMAL EVENT DELIVERY</text><rect x="50" y="335" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Append immutable event</text><text x="64" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Update bounded memory, then enqueue (run path, event)</text><rect x="50" y="490" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Single writer appends one formatted line</text><text x="64" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A queued event retains its destination even after a new run begins</text><path d="M302 425V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="605" y="280" width="545" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="617" y="305" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">WRITER ERROR / e.g. disk full</text><rect x="625" y="335" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Catch failure + retain writer_error</text><text x="639" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Memory event survives; failed persistence is not retried here</text><rect x="625" y="490" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Continue independent control</text><text x="639" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No log-driven move retry / mode transition</text><text x="639" y="563" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">File and UI may be behind</text><path d="M877 425V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="725" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shutdown / stop observer, enqueue sentinel, bounded joins; this is not an unlimited flush guarantee.</text><text x="30" y="780" fill="#9eb2bf" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">The queue is unbounded. Memory event retention and queue backpressure are different design concerns.</text></svg>