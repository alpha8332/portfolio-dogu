<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Tracked pose / clutch and activation reference</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracked pose / clutch and activation reference</text><text x="35" y="100" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Time →</text><path d="M230 125V480" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><text x="195" y="135" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t₀ activate</text><path d="M530 125V480" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><text x="495" y="135" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t₁ release</text><path d="M830 125V480" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><text x="795" y="135" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t₂ activate</text><text x="35" y="220" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Motion gate</text><path d="M215 240H1100" fill="none" stroke="#47606e" stroke-width="2"/><text x="35" y="345" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input hand pose</text><path d="M215 365H1100" fill="none" stroke="#47606e" stroke-width="2"/><text x="35" y="455" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot target</text><path d="M215 475H1100" fill="none" stroke="#47606e" stroke-width="2"/><path d="M215 240H230V190H530V240H830V190H1100" fill="none" stroke="#80d0f5" stroke-width="3"/><path d="M215 365L230 365L470 300L530 310L720 385L830 360L1050 300" fill="none" stroke="#80d0f5" stroke-width="3"/><path d="M215 475H230L470 405L530 420H830L1050 360" fill="none" stroke="#eab67e" stroke-width="3"/><text x="550" y="450" fill="#eab67e" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current-pose stabilization</text><rect x="35" y="535" width="345" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Activate</text><text x="49" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">save x₀, R_x0 from input</text><text x="49" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">save p_r0, R_r0 from robot</text><text x="49" y="629" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">start with zero relative displacement</text><rect x="420" y="535" width="330" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Release / inactive</text><text x="434" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clear live motion reference</text><text x="434" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">one current-pose target</text><text x="434" y="629" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no continued motion integration</text><rect x="790" y="535" width="355" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Re-activate</text><text x="804" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">capture a NEW paired reference</text><text x="804" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand workspace can be repositioned</text><text x="804" y="629" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no return to the old target</text><path d="M230 480V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M530 480V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M830 480V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="730" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Stored calibration: tracking basis → robot basis. Live reference: where motion starts THIS activation.</text><text x="35" y="780" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Clutch changes the input reference; it does not increase the robot joint range or remove a collision.</text></svg>