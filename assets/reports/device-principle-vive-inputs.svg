<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Vive Controller / pose, continuous gate and edge-triggered actions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive Controller / pose, continuous gate and edge-triggered actions</text><rect x="35" y="75" width="1110" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One physical controller → separate OpenVR observations</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose matrix / axis states / pressed bit mask / touched bit mask</text><path d="M200 155V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 155V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 155V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="230" width="330" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose stream</text><text x="49" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">absolute tracking transform</text><text x="49" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reference-relative displacement</text><rect x="425" y="230" width="330" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trigger float</text><text x="439" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis1.x &gt; 0.1</text><text x="439" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">continuous hold gate</text><rect x="815" y="230" width="330" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Buttons / trackpad</text><text x="829" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pressed differs from touched</text><text x="829" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rising edges trigger actions</text><rect x="35" y="430" width="720" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Activation reference → calibrated pose target</text><text x="49" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger 0→1: pair current device pose and robot pose</text><text x="49" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">release: current robot pose stabilization; re-press: new pair</text><path d="M200 335V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 335V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="815" y="430" width="330" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trackpad click edge</text><text x="829" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">x → translation gain</text><text x="829" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">y → rotation gain; step ±0.2</text><text x="829" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clip gains to [0, 1]</text><path d="M980 335V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="650" width="515" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot arm target</text><text x="49" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">6-value absolute task command</text><text x="49" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual robot feedback checked independently</text><rect x="630" y="650" width="515" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Menu / grip action</text><text x="644" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper toggle / recording stop / gain action</text><text x="644" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">configured binding determines the action</text><path d="M395 545V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1145 285H1160V600H885V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1030" y="590" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">menu / grip</text><path d="M815 485H775V405H395V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="610" y="393" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">gain update</text><text x="35" y="835" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Holding a button is not the same as repeatedly pressing it. Gain steps must not accumulate every frame.</text></svg>