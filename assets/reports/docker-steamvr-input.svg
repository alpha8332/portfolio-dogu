<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Vive / tracking and input are independent evidence paths</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive / tracking and input are independent evidence paths</text><rect x="30" y="75" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SteamVR / tracked devices + application identity</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller paired + pose tracked does not establish an active trigger action</text><path d="M260 155V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M850 155V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="210" width="455" height="410" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="235" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRACKING</text><rect x="50" y="260" width="415" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device pose / validity</text><text x="64" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking-space transform + controller identity</text><rect x="50" y="405" width="415" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Configuration position updates</text><text x="64" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Proves pose path is alive</text><text x="64" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Does not prove trigger / grip / menu changes</text><path d="M255 345V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="520" y="210" width="630" height="410" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="532" y="235" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INPUT</text><rect x="540" y="260" width="590" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="554" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Action manifest + controller binding</text><text x="554" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Application registration → action set update → action data</text><rect x="540" y="405" width="280" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="554" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SteamVR Input</text><text x="554" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Role-restricted actions</text><text x="554" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Origin matching fallback</text><rect x="850" y="405" width="280" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Legacy controller state</text><text x="864" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">getControllerState</text><text x="864" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Only usable when valid</text><path d="M835 345V375H680V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M835 375H990V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="545" y="560" fill="#eab67e" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Both unavailable in the historical SteamVR 2.16 incident</text><rect x="30" y="680" width="455" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Diagnostic isolation</text><text x="44" y="732" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Host-only monitor removes MiMicX / Docker / bridge</text><text x="44" y="753" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check pose AND both input API paths</text><rect x="545" y="680" width="605" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="559" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Decision from version comparison</text><text x="559" y="732" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Known-good runtime restored controller input</text><text x="559" y="753" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep action handling, but do not hide runtime failure with remapping</text><path d="M485 735H545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M255 505V680" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M835 620V650H255V680" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>