<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="1180" height="920" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Release Test Web UI / explanatory reconstruction, not an original screenshot</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Release Test Web UI / explanatory reconstruction, not an original screenshot</text><rect x="25" y="65" width="1130" height="160" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">START / choose an input sheet and create a result copy</text><rect x="45" y="110" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input file selector</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">anonymous-release-sheet.xlsx  [illustrative filename]</text><rect x="580" y="110" width="550" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="594" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start metadata + load</text><text x="594" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inspector / configured device → load request</text><rect x="25" y="270" width="1130" height="535" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="295" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CURRENT CASE / anonymous example; not an actual test result</text><rect x="45" y="315" width="1090" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Screen / tab / feature                                   Previous   ·   case i / N   ·   Next</text><rect x="45" y="405" width="515" height="160" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Test steps</text><text x="59" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1  Enter the target setting screen</text><text x="59" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">2  Apply the specified test condition</text><text x="59" y="499" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3  Observe the resulting state</text><rect x="600" y="405" width="535" height="160" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Expected result</text><text x="614" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Describe the value, message or signal to observe</text><text x="614" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare it with the actual test behavior</text><text x="614" y="499" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The person performs this comparison</text><rect x="45" y="595" width="1090" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="621" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded time     |     Wired pendant:  [ ] IndyKey   [ ] nPad   [ ] None</text><rect x="45" y="680" width="515" height="55" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="59" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PASS — save judgment</text><rect x="600" y="680" width="535" height="55" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="614" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">FAIL — save judgment + reason</text><rect x="45" y="755" width="1090" height="35" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="781" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Error reason / actual observation: free text for this case</text><rect x="270" y="830" width="640" height="45" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="856" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Successful save → next case / read-back</text><text x="35" y="902" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recreated to explain the interaction. No internal filenames, inspector names or actual results are reproduced.</text></svg>