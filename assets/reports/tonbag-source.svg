<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 930" width="1180" height="930" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Replay / stored command is not necessarily the recorded trajectory</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay / stored command is not necessarily the recorded trajectory</text><rect x="30" y="75" width="530" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RAW EPISODE / two meanings at the same sample</text><rect x="50" y="125" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">control.right.teleop_command</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Last stored target may remain constant</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A valid vector can still be stale for trajectory replay</text><rect x="50" y="275" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">proprio.right_arm.p / q</text><text x="64" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured robot pose / joint state continues changing</text><text x="64" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Describes what the robot actually did</text><rect x="600" y="75" width="550" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="612" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PROJECT DEBUGGING / not all experiments were the final fix</text><rect x="620" y="125" width="510" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Attempt: skip unchanged targets</text><text x="634" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fewer calls, but held targets stopped being re-dispatched</text><text x="634" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reverted for that replay path</text><rect x="620" y="275" width="510" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Correct the source meaning</text><text x="634" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded task poses preferred for affected episodes</text><text x="634" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Command fallback only if recorded poses are absent</text><path d="M540 175H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M540 325H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="465" width="1120" height="230" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="490" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DUAL-ARM / ownership and time must both survive decoding</text><rect x="50" y="515" width="250" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm data</text><text x="64" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left / right pose or q</text><text x="64" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same source sample index</text><text x="64" y="609" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No DOF = pose-vector shortcut</text><rect x="340" y="515" width="250" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="354" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">End-effector channels</text><text x="354" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded gripper: [left, right]</text><text x="354" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve actual device entry</text><text x="354" y="609" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tool_index is a different contract</text><rect x="630" y="515" width="230" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Playback schedule</text><text x="644" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Control time preferred</text><text x="644" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute elapsed-time target</text><text x="644" y="609" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Subtract dispatch cost</text><rect x="900" y="515" width="230" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="914" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot dispatch</text><text x="914" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm targets + EE events</text><text x="914" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Sequential RPC cost exists</text><text x="914" y="609" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not hardware simultaneity</text><path d="M300 580H340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 580H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M860 580H900" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="755" width="1120" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="781" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare the motion interval, not the whole file duration</text><text x="44" y="807" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual capture includes manual Start / Stop margins → align motion windows → inspect left / right q, p and gripper transitions separately</text><text x="44" y="828" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">After a backend change: restart the service and collect a new actual episode; old recordings cannot validate a new implementation.</text><text x="30" y="905" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This drawing describes the project debugging sequence; the later general Replay engine has its own source-selection policy.</text></svg>