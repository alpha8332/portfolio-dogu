<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1060" width="1180" height="1060" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Handoff evidence / workstation checks and robot-PC validation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Handoff evidence / workstation checks and robot-PC validation</text><rect x="250" y="85" width="680" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Record the baseline before interpreting the result</text><text x="264" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">checkout / branch / commit / interpreter / workspace</text><text x="264" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">for product behavior: installed release and running container image</text><path d="M590 190V235H295V280" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 235H890V280" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="280" width="530" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="305" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DEVELOPER WORKSTATION PREFLIGHT</text><rect x="50" y="330" width="490" height="230" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Focused software and document checks</text><text x="64" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">imports and package boundaries</text><text x="64" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">route / service / API contracts</text><text x="64" y="424" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI rendering and event wiring</text><text x="64" y="445" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">links, file existence and diff</text><text x="64" y="466" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif"></text><text x="64" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A stub or mock is not a physical device.</text><rect x="610" y="280" width="540" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="305" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT PC / RELEVANT REAL EXECUTION</text><rect x="630" y="330" width="500" height="230" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Product and hardware checks</text><text x="644" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">installed release / Docker / host runtime</text><text x="644" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">registration + fresh device inputs</text><text x="644" y="424" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">compatibility / preflight / safe execution</text><text x="644" y="445" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">short changed-path run + artifact inspection</text><text x="644" y="466" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif"></text><text x="644" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Use explicit inputs and stop conditions.</text><path d="M295 560V700H590V750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 560V700H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="250" y="750" width="680" height="155" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="264" y="776" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One reviewable validation summary</text><text x="264" y="802" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">what changed / in which environment</text><text x="264" y="823" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">which checks passed, were blocked or were not applicable</text><text x="264" y="844" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">what evidence remains / what to check next</text><text x="264" y="865" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">which rollback applies</text><text x="35" y="985" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">A workstation pass proves its own scope. The handoff must identify what still requires the actual runtime.</text><text x="35" y="1030" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Record software and hardware results separately so the next developer can reproduce the same conditions.</text></svg>