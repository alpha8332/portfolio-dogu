<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Release QA / human observation, recording and issue handoff</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Release QA / human observation, recording and issue handoff</text><rect x="25" y="65" width="1130" height="170" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PRECONDITIONS / define the same test before comparing results</text><rect x="45" y="110" width="335" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Release sheet + expected result</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">screen / feature / steps / equipment</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">version and actual case identity</text><rect x="420" y="110" width="335" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator + test setup</text><text x="434" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">mode / servo / login / configuration</text><text x="434" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required fixture, sensor and cabling</text><rect x="795" y="110" width="335" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Execution decision</text><text x="809" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ready → execute</text><text x="809" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not ready → record missing condition</text><path d="M380 155H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M755 155H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="285" width="1130" height="285" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="310" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PHYSICAL PRODUCT TEST / operated by a person</text><rect x="45" y="340" width="300" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="366" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conty / user interface</text><text x="59" y="392" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">configuration · program · status</text><rect x="440" y="340" width="300" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="366" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller + pendant</text><text x="454" y="392" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CB4.0 / IndyKey</text><text x="454" y="413" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">mode, command and device state</text><rect x="835" y="340" width="295" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="849" y="366" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">NURI + peripherals</text><text x="849" y="392" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">motion / signal / tool response</text><path d="M195 205V265H770V320H195V340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="400" y="253" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">test intent</text><path d="M345 375H440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="355" y="363" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">command</text><path d="M740 375H835" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="748" y="363" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">execution</text><path d="M835 410H780V495H390V410H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="430" y="485" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">state and observed response</text><rect x="45" y="620" width="460" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="646" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare expectation with observation</text><text x="59" y="672" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same condition? wrong procedure? product anomaly?</text><text x="59" y="693" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">record the actual transition and visible result</text><path d="M985 430V595H275V620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="550" y="590" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">operator observes physical + UI behavior</text><rect x="640" y="620" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="646" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Record + classify + hand off</text><text x="654" y="672" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">case / setup / steps / expected vs actual / reason</text><text x="654" y="693" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Web UI assists this record; no robot-control API</text><path d="M505 670H640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="540" y="658" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">judgment</text><rect x="45" y="790" width="460" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Responsible developer / follow-up</text><text x="59" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">procedure correction, equipment preparation</text><text x="59" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">or product investigation and modification</text><rect x="640" y="790" width="490" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recheck under matching conditions</text><text x="654" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tie the change to the same case and environment</text><text x="654" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">issue delivery and final approval are separate states</text><path d="M885 720V750H275V790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M505 835H640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1130 835H1160V265H965V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="735" y="253" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">repeat with corrected conditions / revision</text><text x="30" y="950" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Record scale: about 1,200 test items over 2–3 weeks; this is not a defect count or a pass-rate measurement.</text></svg>