<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1100" width="1180" height="1100" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Integration failures / distinguish UI state, model capabilities and tensor semantics</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Integration failures / distinguish UI state, model capabilities and tensor semantics</text><rect x="30" y="80" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Selection resets to ACT</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling rebuilt dropdown options and lost the selected recipe.</text><text x="44" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve stable recipe selection; use backend family/provider/recipe fields.</text><rect x="30" y="235" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="261" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2. ACT boot label during Diffusion launch</text><text x="44" y="287" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared TrainingJob message was hardcoded; label was not proof of policy type.</text><text x="44" y="308" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Family-derived messages and inspect resolved metadata.</text><rect x="30" y="390" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3. Success head reappears</text><text x="44" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Common label selection re-enabled an ACT-only detector after adapter disabled it.</text><text x="44" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep capability check at shared label resolver and payload boundary.</text><rect x="30" y="545" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4. RGB rejected at launch</text><text x="44" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Lowdim-only gate or unresolved default recipe remained in provider path.</text><text x="44" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Accept RGB stats path and pass resolved internal recipe to policy construction.</text><rect x="30" y="700" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">5. Provider option collision</text><text x="44" y="752" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit service fields and provider_config supplied the same argument.</text><text x="44" y="773" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Remove service-owned duplicates before passing provider extensions.</text><rect x="30" y="855" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="881" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">6. RGB deploy gets one frame</text><text x="44" y="907" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint expects ordered history, runtime originally supplied a single image.</text><text x="44" y="928" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Add RGB-specific buffer and camera checks; document repeated initial fill.</text></svg>