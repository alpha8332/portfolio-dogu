<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1060" width="1180" height="1060" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Flexible-object folding / grasp point, support and rotation margin</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Flexible-object folding / grasp point, support and rotation margin</text><rect x="35" y="75" width="1110" height="395" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">STRAIGHT FOLD / geometric explanation reconstructed from the operation record</text><text x="60" y="135" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Pick the middle of the fold</text><path d="M80 320L410 320L450 385L120 385Z" fill="#18232a" stroke="#80d0f5" stroke-width="2"/><circle cx="265" cy="345" r="8" fill="#eab67e"/><path d="M265 330V200" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="280" y="245" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">lift the middle</text><path d="M265 320L265 385" fill="none" stroke="#eab67e" stroke-width="2" stroke-dasharray="6 5"/><text x="80" y="430" fill="#9eb2bf" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Support and lift create a fold line.</text><text x="620" y="135" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">2. Lay the gripper along the fold plane</text><path d="M650 345L820 230L1060 345L1060 385L650 385Z" fill="#18232a" stroke="#80d0f5" stroke-width="2"/><path d="M790 205L875 205L875 220L790 220Z" fill="#eab67e" stroke="#eab67e" stroke-width="2"/><path d="M835 225V290" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="850" y="270" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">orient contact face</text><text x="650" y="430" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">The same TCP point with another tool angle changes contact.</text><rect x="35" y="520" width="1110" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="545" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CIRCULAR FOLD / making a round shape is different from folding it</text><path d="M110 730C130 560 400 560 420 730C400 820 130 820 110 730" fill="none" stroke="#80d0f5" stroke-width="5"/><path d="M90 705L145 705L145 720L90 720Z" fill="#eab67e" stroke="#eab67e" stroke-width="2"/><path d="M390 705L445 705L445 720L390 720Z" fill="#eab67e" stroke="#eab67e" stroke-width="2"/><text x="75" y="840" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">One side holds; the other must turn and move material.</text><path d="M575 760C500 690 560 590 645 610" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="550" y="580" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">near 180°</text><rect x="710" y="590" width="405" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="724" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate three limitations</text><text x="724" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">operator wrist / input reference</text><text x="724" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot joint posture</text><text x="724" y="684" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">object grip / support / free space</text><rect x="710" y="745" width="405" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="724" y="771" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Possible next choices</text><text x="724" y="797" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clutch, alternate approach, regrasp</text><text x="35" y="945" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp point + contact plane + support location define the manipulation, not only the TCP path.</text><text x="35" y="1005" fill="#9eb2bf" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Abstract sheet/loop geometry; no private project image or fixture dimensions reproduced.</text></svg>