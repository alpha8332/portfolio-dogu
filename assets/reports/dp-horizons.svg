<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 890" width="1180" height="890" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">MiMicX DP / actual local predictor and horizon boundaries</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX DP / actual local predictor and horizon boundaries</text><rect x="30" y="75" width="350" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB at To steps × N cameras</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">shared small_cnn per camera/frame</text><text x="44" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">features concatenated in camera order</text><rect x="420" y="75" width="330" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Optional state sequence</text><text x="434" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">keyed normalization → features</text><text x="434" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB path preserves temporal axis</text><rect x="800" y="75" width="350" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Diffusion step k</text><text x="814" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">sinusoidal embedding</text><text x="814" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not the robot timestep</text><path d="M205 170V205H620V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 170V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M975 170V205H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="420" y="240" width="400" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Global condition</text><text x="434" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">flatten observation features + step embedding</text><rect x="30" y="355" width="1120" height="265" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="380" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LOCAL ConditionalUnet1D / no downsampling–upsampling pyramid</text><rect x="50" y="425" width="210" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Noisy action</text><text x="64" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[B,Tp,A] → transpose</text><rect x="310" y="425" width="210" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="324" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input Conv1d</text><text x="324" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A → hidden channels</text><rect x="570" y="425" width="245" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="584" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Residual block × 2</text><text x="584" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">x + conv_block(x) + cond</text><rect x="865" y="425" width="260" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="879" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Output Conv1d</text><text x="879" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hidden → A → transpose</text><path d="M260 470H310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M520 470H570" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M815 470H865" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M620 315V390H692V425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="715" y="385" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">additive conditioning</text><text x="50" y="570" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Each block: Conv1d → GroupNorm → Mish → Conv1d; condition: Mish → Linear → broadcast over Tp.</text><text x="30" y="680" fill="#80d0f5" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">History To</text><text x="30" y="733" fill="#80d0f5" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prediction Tp</text><text x="30" y="786" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Execution Ta</text><rect x="250" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="264" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">0</text><rect x="250" y="753" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="264" y="779" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">0</text><rect x="333" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="347" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1</text><rect x="333" y="753" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="347" y="779" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1</text><rect x="416" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="430" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2</text><rect x="416" y="753" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="430" y="779" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2</text><rect x="499" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="513" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3</text><rect x="499" y="753" width="74" height="40" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="513" y="779" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3</text><rect x="582" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#47606e"/><text x="596" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4</text><rect x="665" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#47606e"/><text x="679" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">5</text><rect x="748" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#47606e"/><text x="762" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">6</text><rect x="831" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#47606e"/><text x="845" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">7</text><rect x="914" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#47606e"/><text x="928" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">8</text><rect x="997" y="700" width="74" height="40" rx="3" fill="#18232a" stroke="#47606e"/><text x="1011" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">9</text><text x="250" y="680" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">o[t−To+1] … o[t] → condition for the predicted sequence</text><text x="630" y="785" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Illustration only: execute prefix, then replan.</text><text x="30" y="850" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Official policy slices from To−1; local predict_action_sequence uses [:Ta]. Dataset time origin must match the executor.</text></svg>