<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1090" width="1180" height="1090" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">External rollout / staged preparation, preview, live gates and cleanup</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">External rollout / staged preparation, preview, live gates and cleanup</text><rect x="35" y="70" width="500" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Discover + Inspect</text><text x="49" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">bundle identity / artifact / calibration / manifest</text><rect x="645" y="70" width="500" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare environment</text><text x="659" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hash + install job + valid success marker</text><path d="M535 112H645" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="645" y="225" width="500" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dry Run + Load persistent worker</text><text x="659" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">adapter import / dependency / checkpoint load checks</text><path d="M895 155V190H285V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="225" width="500" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Mapping Preview</text><text x="49" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">live sources / shape / samples / missing-input warnings</text><path d="M535 265H645" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="545" y="330" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">review inputs</text><rect x="35" y="390" width="1110" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One runtime tick</text><text x="49" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">snapshot → mapped inputs → worker infer → translated actions → validated command candidates</text><path d="M895 310V355H590V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="550" width="500" height="220" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="575" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PREVIEW ONLY</text><rect x="55" y="605" width="460" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect the candidate command</text><text x="69" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">shape / slice / units / frame / target</text><text x="69" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">policy output and command are different values</text><text x="69" y="699" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">this is not a physical robot execution</text><rect x="645" y="550" width="500" height="220" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="657" y="575" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LIVE EXECUTION</text><rect x="665" y="605" width="460" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="679" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Task Teleop + dispatch gate</text><text x="679" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">enable separately before Run</text><text x="679" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">finite values + expected mode (TeleL: 17)</text><text x="679" y="699" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">IDLE / settle / stop reason handled by runtime</text><path d="M590 485V515H285V605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="350" y="505" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">simulated</text><path d="M590 515H895V605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="740" y="505" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">live intent</text><rect x="35" y="845" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="871" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Failure / observation → investigate boundary</text><text x="49" y="897" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">environment / input / output conversion / mode</text><text x="49" y="918" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fix the matching layer before repeating</text><rect x="645" y="845" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="871" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop / reload / next run</text><text x="659" y="897" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">stop loop and owned teleop route</text><text x="659" y="918" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">close or retain worker; reset policy state as required</text><path d="M285 730V845" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M895 730V845" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M535 890H645" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1125 667H1165V440H1145" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="900" y="365" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">repeat tick while running</text><text x="35" y="1020" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Load success, a valid command and task success prove different things. No policy success rate is implied.</text></svg>