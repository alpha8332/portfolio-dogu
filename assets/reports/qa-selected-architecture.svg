<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Dataset QA / one selected episode, six independent views</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Dataset QA / one selected episode, six independent views</text><rect x="30" y="70" width="340" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Visualization / selected dataset</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">dataset identity + explicit profile</text><rect x="420" y="70" width="730" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checklist API → report builder</text><text x="434" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve the selected HDF5 once; carry the same path into every adapter</text><path d="M370 115H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="374" y="103" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">selection</text><rect x="30" y="220" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="246" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Expected contract / GG · GT · TT</text><text x="44" y="272" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture plan + profile: required streams, binary channels, Tesollo run