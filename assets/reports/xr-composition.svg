<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Pose + thumbstick / compose relative motion instead of replacing it</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose + thumbstick / compose relative motion instead of replacing it</text><rect x="30" y="85" width="525" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Squeeze-relative pose target</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">activation: capture robot base and controller reference</text><text x="44" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">compute pose delta in the configured robot frame</text><rect x="605" y="85" width="545" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Thumbstick displacement input</text><text x="619" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clamp → deadzone remap → axis map</text><text x="619" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Δoffset = speed(mm/s) × normalized input × dt</text><path d="M280 185V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 185V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="255" width="525" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="281" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve the existing pose path</text><text x="44" y="307" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">neutral stick must not stop pose teleoperation</text><text x="44" y="328" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">release / re-activation must refresh references</text><rect x="605" y="255" width="545" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="281" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Integrate a virtual translation offset</text><text x="619" y="307" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">dt from sample timestamps; cap long gaps</text><text x="619" y="328" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TeleT jog can operate without squeeze</text><path d="M280 360V410H590V455" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 360V410H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280" y="455" width="620" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Compose a target, then execute</text><text x="294" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_target = p_pose + accumulated jog offset</text><text x="294" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">existing orientation path is retained</text><path d="M590 550V600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="600" width="1120" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="626" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">When the stick returns to neutral after jogging</text><text x="44" y="652" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clear integrated offset → read current robot pose → re-anchor robot base and device reference</text><text x="44" y="673" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">otherwise a stale base can pull the target back toward the pre-jog position</text><text x="30" y="785" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Original bug: planar_xy early return selected an alternative target, bypassing pose input even when the stick was neutral.</text></svg>