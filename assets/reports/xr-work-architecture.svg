<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1150" width="1180" height="1150" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">XR applications / transport, motion and application responsibilities</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">XR applications / transport, motion and application responsibilities</text><rect x="30" y="75" width="1120" height="215" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INPUT TRANSPORT / host session may run directly or through a host bridge</text><rect x="50" y="125" width="300" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Quest / Pico controllers</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose + stick + trigger/squeeze</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">primary / secondary click</text><rect x="420" y="125" width="310" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OpenXR session worker</text><text x="434" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">focus / interaction profile</text><text x="434" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose validity + action activity</text><rect x="800" y="125" width="330" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Latest device snapshot</text><text x="814" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position m / quaternion xyzw</text><text x="814" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">values + active flags + time</text><path d="M350 180H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="357" y="164" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">actions</text><path d="M730 180H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="738" y="164" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">sample</text><rect x="30" y="330" width="1120" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="355" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT WORKER / binding selects controller side and robot / arm owner</text><rect x="50" y="385" width="310" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="411" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Validate sample + resolve binding</text><text x="64" y="437" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">connected / focus / hand / profile</text><text x="64" y="458" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose_valid only where pose is used</text><path d="M965 235V310H205V385" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="450" y="302" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">latest sample</text><rect x="420" y="385" width="310" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="411" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose target + accumulated jog</text><text x="434" y="437" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reference / basis / units / gate</text><text x="434" y="458" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">thumbstick axis map + time integral</text><path d="M360 430H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="800" y="385" width="330" height="95" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="814" y="411" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot motion output</text><text x="814" y="437" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TeleT target: position + RPY</text><text x="814" y="458" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not generated by Idle button polling</text><path d="M730 430H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="420" y="535" width="310" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Gripper fraction + owner</text><text x="434" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">analog / hold / toggle</text><text x="434" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve tool + position / force</text><rect x="800" y="535" width="330" height="95" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="814" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Owned gripper command</text><text x="814" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot + arm + tool</text><text x="814" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no all-device broadcast</text><path d="M205 480V582H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="255" y="568" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger</text><path d="M730 582H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="735" width="1120" height="315" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="760" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">APPLICATION CONTROL / not an additional XR transport process</text><rect x="50" y="790" width="310" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Button edge state</text><text x="64" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">per binding + action field</text><text x="64" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">polled in TeleT and outside TeleT</text><path d="M205 582V790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="55" y="710" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">primary / secondary</text><rect x="420" y="790" width="310" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">RobotRuntimeBridge</text><text x="434" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Protocol / callback boundary</text><text x="434" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HW package → application services</text><path d="M360 840H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="800" y="790" width="330" height="105" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="814" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing backend operations</text><text x="814" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">collect start / stop + preflight</text><text x="814" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Idle / TaskTeleop transition</text><path d="M730 840H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="55" y="985" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Control state flows back from the application and live robot snapshot; UI settings are intent, not live truth.</text><path d="M965 895V1080H15V430H50" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="440" y="1070" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">mode / task / result</text><text x="35" y="1110" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Public reconstruction. Host/container transport details belong to the separate Docker report.</text></svg>