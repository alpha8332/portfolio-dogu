<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 870" width="1180" height="870" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">SCDP rollout / model-specific worker separated from robot authority</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">SCDP rollout / model-specific worker separated from robot authority</text><rect x="30" y="75" width="345" height="665" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MIMICX / runtime and device authority</text><rect x="50" y="125" width="305" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime snapshot</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot pose / gripper / selected camera</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">registered ordering + freshness</text><rect x="50" y="285" width="305" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input mapping</text><text x="64" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">select source / shape / layout</text><text x="64" y="358" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pass context to adapter</text><rect x="50" y="530" width="305" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="556" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Output mapping + command builder</text><text x="64" y="582" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">native action keys / owner</text><text x="64" y="603" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">finite values / units / op-state</text><rect x="50" y="665" width="305" height="55" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="691" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device dispatch / robot feedback</text><path d="M200 220V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M200 635V665" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M50 695H40V170H50" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="53" y="455" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback</text><rect x="415" y="75" width="735" height="485" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="427" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PREPARED SIDECAR / policy-specific dependencies</text><rect x="440" y="125" width="315" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Adapter preprocessing</text><text x="454" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">images / state / calibration</text><text x="454" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normalizer expected by received model</text><rect x="800" y="125" width="325" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Received trained SCDP model</text><text x="814" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">research-team model + checkpoint</text><text x="814" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">training is outside this integration</text><rect x="440" y="285" width="685" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy inference</text><text x="454" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">image features + robot state + action denoising → action chunk</text><rect x="440" y="425" width="685" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Adapter postprocessing</text><text x="454" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source action layout → units / pose convention / native target layout</text><path d="M355 330H395V170H440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="380" y="267" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">IPC</text><path d="M595 215V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M960 215V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M782 375V425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M440 468H395V580H355" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="410" y="605" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">adapter outputs</text><rect x="415" y="620" width="735" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="429" y="646" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Lifecycle controlled by backend</text><text x="429" y="672" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect → Prepare Env → Mapping Preview → Dry Run → Load → Run → Stop</text><text x="429" y="693" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Adapter loads and predicts; it never opens robot SDK clients or starts task teleop.</text><text x="30" y="810" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Research method and weights belong to the research team. My work: teleoperation data collection + MiMicX rollout integration.</text></svg>