<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">ACT / learn a chunk, choose an execution strategy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT / learn a chunk, choose an execution strategy</text><rect x="30" y="70" width="1120" height="230" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING / demonstration supervision</text><rect x="50" y="115" width="275" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Demonstrations</text><text x="64" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB + robot state</text><text x="64" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action chunk + padding mask</text><rect x="390" y="115" width="350" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="404" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT / chunk prediction</text><text x="404" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">training latent + observation</text><text x="404" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reconstruction + regularization</text><rect x="800" y="115" width="330" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="814" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One trained checkpoint</text><text x="814" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weights + config + statistics</text><text x="814" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TE does not retrain this artifact</text><path d="M325 165H390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 165H800" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="50" y="267" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Concept source: Zhao et al. (RSS 2023), Figures 5–6. Runtime adaptation below is MiMicX.</text><path d="M965 215V335H590V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="655" y="327" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">load the same checkpoint</text><rect x="350" y="375" width="480" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="364" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live observation → ACT policy</text><text x="364" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">images + state → H future actions</text><path d="M445 465V505H300V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M735 465V505H875V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="535" width="530" height="220" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="560" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TE OFF / queue drain</text><rect x="50" y="580" width="490" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Predict once → consume H actions</text><text x="64" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">step q: fresh chunk</text><text x="64" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">q+1…q+H−1: queue values</text><text x="64" y="674" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">new model query when the queue needs refilling</text><rect x="590" y="535" width="560" height="220" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="602" y="560" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TE ON / overlapping predictions</text><rect x="610" y="580" width="520" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Fresh query at each inference step</text><text x="624" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">new chunk + retained overlapping chunks</text><text x="624" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">align by target step → choose one action</text><text x="624" y="674" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">continuous blend / projected rotation / selected event</text><path d="M300 695V740H500V775" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M875 695V740H680V775" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="350" y="775" width="480" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="364" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command → robot → measured state / RGB</text><path d="M350 805H15V420H350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="410" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback</text><text x="40" y="885" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same training weights; different inference work and action-selection rules. Not a change in robot DOF.</text></svg>