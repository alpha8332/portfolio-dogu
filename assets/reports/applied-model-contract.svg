<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">External model adaptation / preserve meaning across execution boundaries</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">External model adaptation / preserve meaning across execution boundaries</text><rect x="25" y="65" width="1130" height="210" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RESEARCH ARTIFACTS / model supplied by the research team</text><rect x="45" y="110" width="325" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint / processor</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual v4 action output: 16D</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation preprocessing</text><text x="59" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Research model and learned weights</text><rect x="425" y="110" width="325" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Wrapper mismatch</text><text x="439" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Old manifest expected 22D</text><text x="439" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Old torso slice no longer exists</text><text x="439" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Rotation meaning also changed</text><rect x="810" y="110" width="325" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Declared output layout</text><text x="824" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Gripper force + position: 4D</text><text x="824" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left delta pose: 6D</text><text x="824" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Right delta pose: 6D</text><path d="M370 165H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 165H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="335" width="1130" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="360" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ADAPTER / model-specific conversion, no direct robot SDK dispatch</text><rect x="45" y="390" width="325" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position delta</text><text x="59" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read matching current position</text><text x="59" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Align reference frame and units</text><text x="59" y="484" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_next = p_current + delta_p</text><text x="59" y="505" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not add meters to millimeters</text><rect x="425" y="390" width="325" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rotation delta</text><text x="439" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rotvec [rad] → R_delta</text><text x="439" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_next = R_delta · R_current</text><text x="439" y="484" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Convert R_next → Robot API RPY [deg]</text><text x="439" y="505" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Multiplication order follows definition</text><rect x="810" y="390" width="325" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="416" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute output contract</text><text x="824" y="442" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left / right pose6 [mm, deg]</text><text x="824" y="463" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Owner-qualified gripper commands</text><text x="824" y="484" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Remove stale torso mapping</text><text x="824" y="505" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Return semantic outputs to backend</text><path d="M970 220V305H210V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 305V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M370 470H400V570H970V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 470H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="630" width="1130" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="655" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MIMICX BACKEND / owns live input, command building and execution</text><rect x="45" y="685" width="325" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="711" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime input and worker</text><text x="59" y="737" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Load selected artifact / environment</text><text x="59" y="758" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Current camera and robot state</text><text x="59" y="779" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Call adapter inference</text><text x="59" y="800" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep current pose meaning explicit</text><rect x="425" y="685" width="325" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="711" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command builder / gates</text><text x="439" y="737" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Map semantic outputs</text><text x="439" y="758" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task teleop / live state checks</text><text x="439" y="779" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Address the correct arm and tool</text><text x="439" y="800" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop owned execution routes</text><rect x="810" y="685" width="325" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="711" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot API and physical result</text><text x="824" y="737" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute task targets</text><text x="824" y="758" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual measured pose / joint</text><text x="824" y="779" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual material contact</text><text x="824" y="800" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe input, action and command</text><path d="M970 545H1165V600H590V685" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="720" y="593" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">adapter outputs</text><path d="M45 755H12V375H210V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="650" y="378" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">live input</text><path d="M210 375H590V390" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M370 755H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 755H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 825V875H210V825" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="420" y="864" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">measured state feeds the next runtime input</text><text x="45" y="975" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Model-specific conversion stays in the adapter; robot communication and dispatch remain backend responsibilities.</text></svg>