<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Controller input / independent pose, analog axes and digital bit fields</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller input / independent pose, analog axes and digital bit fields</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same Controller index / separate queries</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking pose availability and controller state success must be checked independently</text><rect x="30" y="250" width="360" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracked pose</text><text x="44" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3×4 transform / validity</text><text x="44" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Provided velocity where available</text><text x="44" y="344" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Spatial state</text><rect x="470" y="250" width="680" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="484" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">getControllerState / binding normalization</text><text x="484" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Accept (ok,state), tuple or state form; fail is not a confirmed all-zero input</text><text x="484" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read analog axes and pressed/touched masks independently</text><path d="M210 160V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M810 160V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="460" width="360" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Wand analog mapping</text><text x="44" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis[0].x/y → trackpad X/Y</text><text x="44" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis[1].x → trigger amount</text><text x="44" y="554" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Analog value is not click state</text><rect x="440" y="460" width="340" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pressed bits</text><text x="454" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">menu / grip / pad click</text><text x="454" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger click / system</text><text x="454" y="554" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">(mask &amp; (1 &lt;&lt; button_id))</text><rect x="820" y="460" width="330" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Touched bits</text><text x="834" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pad contact vs pad press</text><text x="834" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep semantic distinction</text><text x="834" y="554" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not every device exposes all fields</text><path d="M640 355V405H210V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M640 405H610V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M640 405H985V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="675" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="701" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Logical input payload → consumer-specific representation</text><text x="44" y="727" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3D: gauge / dot / LEDs | HUD: numeric + on/off values | CSV: selected flattened pressed fields | JSONL: nested input dict</text><text x="44" y="748" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mapping shown for this Wand path; not a universal axis numbering scheme for all VR devices.</text><path d="M210 565V675" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M610 565V675" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M985 565V675" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>