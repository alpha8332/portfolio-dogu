<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Device events / distinguish prediction, effective command and physical result</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Device events / distinguish prediction, effective command and physical result</text><rect x="30" y="80" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Predicted gripper scalar</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Model output in its action contract</text><text x="44" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not automatically a physical width</text><rect x="420" y="80" width="350" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime post-processing</text><text x="434" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Threshold / hysteresis / force policy</text><text x="434" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve owner and effective action</text><rect x="820" y="80" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hardware dispatch</text><text x="834" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Issue command to matched target</text><text x="834" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Feedback is a separate observation</text><path d="M370 130H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M770 130H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="250" width="1120" height="375" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="275" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SNAPSHOT OBSERVER</text><rect x="50" y="305" width="505" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="331" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Binary gripper signature</text><text x="64" y="357" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity → open / close</text><text x="64" y="378" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Skip repeated effective action on the same owner</text><rect x="625" y="305" width="505" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="331" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tesollo hand signature</text><text x="639" y="357" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity → (grasp state, mode, force)</text><text x="639" y="378" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Force rounded to 3 decimals for comparison</text><path d="M590 180V225H302V305" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="50" y="224" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">published effective state</text><path d="M590 225H877V305" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="50" y="475" width="1080" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Event fields preserve routing and interpretation</text><text x="64" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">segment / arm index / matched arm or side | gripper raw + effective position | hand mode + force</text><path d="M302 415V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M877 415V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="700" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="726" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpretation / command transition, not proof of object grasp</text><text x="44" y="752" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">An open/close or grasp event explains what runtime selected. Mechanical completion needs feedback or observation.</text><path d="M590 625V700" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>