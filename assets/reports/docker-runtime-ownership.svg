rl(#arrow)"/><rect x="640" y="65" width="575" height="520" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="652" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONTAINER / device-data owns live hardware runtime</text><rect x="660" y="112" width="250" height="82" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="138" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Direct HID adapter</text><text x="674" y="164" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve → open → read / decode</text><rect x="940" y="112" width="250" height="82" rx="3" fill="#18232a" stroke="#47606e"/><text x="954" y="138" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera handler</text><text x="954" y="164" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stable key → open → actual profile</text><rect x="660" y="350" width="250" height="82" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SteamVR bridge client</text><text x="674" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read snapshot / status RPC</text><rect x="940" y="475" width="250" height="82" rx="3" fill="#18232a" stroke="#47606e"/><text x="954" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">OpenXR bridge client</text><text x="954" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Freshness / focus / render</text><text x="954" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">diagnostics</text><path d="M575 250H620V217H785V194" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="658" y="212" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">HID access</text><path d="M575 280H625V225H1065V194" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="920" y="219" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">USB / video access</text><path d="M170 557V595H615V391H660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="288" y="589" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">mmap snapshot / socket RPC</text><path d="M575 516H940" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="688" y="506" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">mmap + socket</text><rect x="25" y="635" width="1190" height="290" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="660" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">APPLICATION / keep operator configuration separate from live samples</text><rect x="45" y="688" width="300" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="714" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser → UI Gateway</text><text x="59" y="740" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Register / bind / calibrate intent</text><text x="59" y="761" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Display readiness + failure reasons</text><rect x="445" y="688" width="350" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="714" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device-data runtime</text><text x="459" y="740" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Catalog + sample + binding + calibration</text><text x="459" y="761" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot command generation / dispatch</text><rect x="890" y="688" width="300" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="904" y="714" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot + end-effector</text><text x="904" y="740" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual operation state / feedback</text><text x="904" y="761" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical teleoperation verification</text><path d="M345 723H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="353" y="711" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">API intent</text><path d="M445 765H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="358" y="804" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">status</text><path d="M795 718H890" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="802" y="707" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">command</text><path d="M890 765H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="805" y="804" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback</text><path d="M785 194V207H635V610H620V688" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="650" y="603" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">decoded input</text><path d="M785 432V450H925V610" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1065 557V610H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1065 194V320H1225V850H795V770" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="944" y="310" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">frames / capture branch</text><rect x="25" y="970" width="1190" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="39" y="996" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Deployment is another path: image + release/device-pack contract + Host assets</text><text x="39" y="1022" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">psf-manager is inherited installation/update tooling. Per-runtime bridges collect input; Device Setup checks prerequisites.</text><text x="39" y="1043" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Data-studio and model-runtime remain separate services; they do not open these teaching devices in this path.</text></svg>