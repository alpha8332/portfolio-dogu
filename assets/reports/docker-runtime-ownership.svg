<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1120" width="1240" height="1120" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Deployment boundary / device access, session ownership and robot feedback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Deployment boundary / device access, session ownership and robot feedback</text><rect x="25" y="65" width="575" height="520" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HOST / Linux kernel + logged-in desktop user</text><rect x="45" y="112" width="250" height="82" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="138" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SpaceMouse x2</text><text x="59" y="164" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">USB / receiver → HID reports</text><rect x="325" y="112" width="250" height="82" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="138" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">RealSense / UVC</text><text x="339" y="164" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">USB camera → video / USB nodes</text><rect x="45" y="230" width="530" height="72" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Kernel device access + identity metadata</text><text x="59" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">/dev/hidraw* · /dev/video* · udev · sysfs</text><path d="M170 194