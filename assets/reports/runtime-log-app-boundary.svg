<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Observability / app-layer events around a preserved control path</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Observability / app-layer events around a preserved control path</text><rect x="30" y="75" width="1120" height="190" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EXISTING CONTROL PATH / kept out of the logging redesign</text><rect x="50" y="125" width="310" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inference executor</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe → predict</text><rect x="435" y="125" width="310" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command dispatch</text><text x="449" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Decode + safety / mode gates</text><rect x="820" y="125" width="310" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot + end effector</text><text x="834" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Execute commands / feedback</text><path d="M360 170H435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M745 170H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="320" width="1120" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="345" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">APPLICATION OBSERVATION / no extra hardware RPC</text><rect x="50" y="375" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Lifecycle routes</text><text x="64" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">start / pause / resume / stop</text><text x="64" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit application events</text><rect x="435" y="375" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inference state snapshot</text><text x="449" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">last output + error</text><text x="449" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Already-published runtime detail</text><rect x="820" y="375" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observer / default 0.25 s</text><text x="834" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Major transitions + dedupe</text><text x="834" y="448" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not every control tick</text><path d="M590 220V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="603" y="293" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">published state</text><path d="M745 425H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="545" width="1080" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Immutable event / time + category + action + message + string fields</text><text x="64" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A shared formatter creates both memory and persisted lines; service / lock objects stay outside shared state</text><path d="M205 475V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M975 475V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="740" width="340" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="766" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Memory view</text><text x="44" y="792" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Default last 200 events</text><text x="44" y="813" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared state stores strings only</text><rect x="420" y="740" width="350" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="766" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Queue + writer thread</text><text x="434" y="792" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Append UTF-8 line to active run file</text><text x="434" y="813" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Disk failure caught at writer</text><rect x="820" y="740" width="330" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="766" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Log delivery</text><text x="834" y="792" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read saved file → API → UI</text><text x="834" y="813" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Memory / state fallback if empty</text><path d="M200 630V740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 630V740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M770 795H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="935" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">No retry of robot motion is introduced to make a log visible. Log freshness and motion success are separate facts.</text></svg>