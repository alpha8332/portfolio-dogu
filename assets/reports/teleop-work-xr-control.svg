<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1050" width="1180" height="1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">XR input / pose, axis, gripper and application actions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">XR input / pose, axis, gripper and application actions</text><rect x="35" y="75" width="1110" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host OpenXR session → sample snapshot</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose / validity / focus / squeeze / trigger / stick / clicks / input activity / time</text><path d="M200 165V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 165V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980 165V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="230" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm pose branch</text><text x="49" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">focus + pose validity + gate</text><text x="49" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">relative reference / calibrated basis</text><text x="49" y="324" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TeleT motion state</text><rect x="425" y="230" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Analog / digital branch</text><text x="439" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis value AND activity</text><text x="439" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pico click fallback when axis inactive</text><text x="439" y="324" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">active real zero means release</text><rect x="815" y="230" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Application action branch</text><text x="829" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">button bindings / edge events</text><text x="829" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">can remain polled in Idle</text><text x="829" y="324" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not an arm motion permission</text><rect x="35" y="430" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stick jog accumulator</text><text x="49" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">configured x / y / z assignment</text><text x="49" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">velocity × Δt</text><text x="49" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">None = unassigned</text><rect x="425" y="430" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand / gripper control</text><text x="439" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger or configured axis</text><text x="439" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve EE owner</text><text x="439" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">joint / grasp command</text><rect x="815" y="430" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session action</text><text x="829" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">start / stop / reset bindings</text><text x="829" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">never infer live motion from</text><text x="829" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">button monitoring alone</text><path d="M200 350V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="214" y="395" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">axis jog</text><path d="M590 350V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="604" y="395" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">grip target</text><path d="M980 350V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="994" y="395" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">button edge</text><rect x="35" y="635" width="720" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm target composer</text><text x="49" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tracked relative pose + jog offset → absolute robot task command</text><path d="M200 550V635" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M365 285H390V605H590V635" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="405" y="596" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">pose reference</text><rect x="815" y="635" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot + end effector</text><text x="829" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target execution</text><text x="829" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual feedback</text><path d="M755 685H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 550V580H790V685H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="620" y="571" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">hand target</text><rect x="35" y="825" width="720" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="851" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Fault isolation</text><text x="49" y="877" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose moving? → action active? → TeleT gate? → owner? → command/feedback?</text><path d="M980 735V875H755" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="840" y="860" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">measured state</text><text x="35" y="990" fill="#eab67e" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose tracking success does not prove analog/button binding or gripper command success.</text></svg>