<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Camera geometry / moving head, projection and model-image coordinates</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera geometry / moving head, projection and model-image coordinates</text><rect x="35" y="70" width="1110" height="240" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FRAME RELATIONSHIP / T^(a←b) maps column-vector coordinates from b into a</text><rect x="55" y="125" width="270" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">BASE frame b</text><text x="69" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot motion reference</text><text x="69" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">point P^b</text><rect x="455" y="125" width="270" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="469" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">HEAD frame h</text><text x="469" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose-dependent transform</text><text x="469" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">T^(b←h)</text><rect x="855" y="125" width="270" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="869" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CAMERA frame c</text><text x="869" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">head-mounted fixed relation</text><text x="869" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">T^(h←c)</text><path d="M855 180H725" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="745" y="163" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">camera → head</text><path d="M455 180H325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="340" y="163" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">head → base</text><text x="230" y="280" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Compose: T^(b←c) = T^(b←h) T^(h←c); head motion changes the camera pose in the base frame.</text><rect x="35" y="375" width="1110" height="285" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="400" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PROJECT A BASE-FRAME POINT / use the inverse direction</text><rect x="55" y="430" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Point in robot/task frame</text><text x="69" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">P^c = inverse(T^(b←c)) P^b</text><text x="69" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Zc must have a valid projection meaning</text><text x="69" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">frame + translation units must agree</text><rect x="465" y="430" width="260" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="479" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pinhole projection</text><text x="479" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">u = fx Xc/Zc + cx</text><text x="479" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">v = fy Yc/Zc + cy</text><text x="479" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">intrinsic values are in pixels</text><path d="M385 490H465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="855" y="425" width="265" height="160" fill="none" stroke="#47606e"/><text x="870" y="450" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">IMAGE PLANE / schematic</text><circle cx="900" cy="500" r="6" fill="#80d0f5"/><circle cx="970" cy="520" r="6" fill="#80d0f5"/><circle cx="1040" cy="485" r="6" fill="#80d0f5"/><text x="875" y="570" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">projected attention anchors</text><path d="M725 490H855" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="765" y="478" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">(u,v)</text><text x="55" y="625" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SCDP uses projected intermediate trajectory points to select visual features; correct tensor shape alone is insufficient.</text><rect x="35" y="735" width="530" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Image transform / raw → model resolution</text><text x="49" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">crop origin (x0,y0) / scale (sx,sy)</text><text x="49" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">transform image coordinates and K consistently</text><text x="49" y="829" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">plain half-size resize: fx,fy,cx,cy each halve</text><rect x="615" y="735" width="530" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="629" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Calibration + initial-state handoff</text><text x="629" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PSF parameter extraction and coordinate explanation</text><text x="629" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no new calibration algorithm or sensor measurement</text><text x="629" y="829" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no private matrices or joint values shown here</text><path d="M990 585V695H300V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="580" y="686" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">model image coordinates</text><text x="35" y="945" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">All coordinates in this figure are symbolic. This is not an installation drawing or a measured calibration result.</text></svg>