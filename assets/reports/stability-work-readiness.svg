<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1100" width="1180" height="1100" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Training preparation / different checks must refer to the same selection</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Training preparation / different checks must refer to the same selection</text><rect x="30" y="80" width="1120" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EARLY READINESS / inspect source and declared contracts</text><rect x="50" y="140" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalize selection</text><text x="64" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">single / multiple task fields</text><text x="64" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">paths / dataset IDs → unique paths</text><rect x="430" y="140" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect raw episodes</text><text x="444" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">saved CapturePlan or metadata</text><text x="444" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">per-file IO failures → blockers</text><rect x="810" y="140" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Report readiness</text><text x="824" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">episode count vs usable count</text><text x="824" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required streams / camera identity</text><path d="M370 195H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 195H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="55" y="350" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A ready source is not proof that the converted artifact exposes every selected training key.</text><rect x="30" y="490" width="1120" height="450" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="515" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">START PREFLIGHT / inspect the artifact that will actually be loaded</text><rect x="50" y="555" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="581" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Materialize + convert</text><text x="64" y="607" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">selection manifest + video links</text><text x="64" y="628" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">curation / relative targets</text><text x="64" y="649" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">representation transforms</text><rect x="430" y="555" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="581" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read actual H5 + schema</text><text x="444" y="607" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">readability / selected IO keys</text><text x="444" y="628" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">family capability + resolved variant</text><text x="444" y="649" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fail before worker launch</text><rect x="810" y="555" width="320" height="120" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="824" y="581" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Launch training worker</text><text x="824" y="607" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">exact prepared dataset</text><text x="824" y="628" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolved model/runtime contract</text><path d="M970 255V465H210V555" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="450" y="477" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">same selection and preprocess intent</text><path d="M370 615H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 615H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="760" width="500" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="786" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Retryable image materialization</text><text x="64" y="812" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">retry only the recognized image-input errors</text><text x="64" y="833" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">limited attempts, then report failure</text><rect x="630" y="760" width="500" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="786" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Structural failure</text><text x="644" y="812" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">unreadable H5 / selected key missing</text><text x="644" y="833" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit blocker, not indefinite retry</text><path d="M590 675V710H880V760" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 710H300V760" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="1015" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep the real adapter/signature under test. A broad mock can hide the failed boundary.</text></svg>