<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 890" width="1180" height="890" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Collect mode scope / sequential fan-out and compensation on partial failure</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Collect mode scope / sequential fan-out and compensation on partial failure</text><rect x="30" y="75" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Move Robot / explicit robot A</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Single-focus jog / Saved Position / owner-scoped EE</text><rect x="650" y="75" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Collect / resolved session [A, B]</text><text x="664" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TeleT / Idle / Stop use session participant contract</text><rect x="30" y="245" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A only</text><text x="44" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not turn an individual jog into a broadcast command</text><path d="M280 165V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="650" y="245" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Apply collect-session mode change</text><text x="664" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stable ordered target list; do not reuse focus as scope</text><path d="M900 165V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="650" y="425" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Transition A → teleop</text><text x="664" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If accepted, remember A as already transitioned</text><path d="M900 340V425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="650" y="605" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Transition B → teleop</text><text x="664" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Both accepted → session mode ready</text><text x="664" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Failure → report B and compensate prior targets</text><path d="M900 515V605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="605" width="500" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Compensation: A → idle</text><text x="44" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reverse already-transitioned target order</text><text x="44" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep rollback failures visible; physical calls can fail</text><text x="44" y="699" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not an atomic controller transaction</text><path d="M650 660H530" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="558" y="644" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">B failed</text><rect x="30" y="770" width="1120" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="796" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Collect Stop resolves order → session participants → legacy single target</text><text x="44" y="822" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Idle return is requested for the resolved session scope; request acceptance is not proof of physical standstill.</text><path d="M900 695V770" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>