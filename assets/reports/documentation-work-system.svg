<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1220" width="1180" height="1220" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Three maps / work sequence ≠ runtime topology ≠ code location</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Three maps / work sequence ≠ runtime topology ≠ code location</text><rect x="30" y="75" width="1120" height="200" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1  OPERATOR WORKFLOW / what passes to the next stage</text><rect x="50" y="125" width="200" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Configure</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity / calibration</text><path d="M250 170H270" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="270" y="125" width="200" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture</text><text x="284" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw episode</text><path d="M470 170H490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="490" y="125" width="200" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="504" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect / curate</text><text x="504" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">curation artifact</text><path d="M690 170H710" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="710" y="125" width="200" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="724" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Train</text><text x="724" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">checkpoint</text><path d="M910 170H930" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="930" y="125" width="200" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="944" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Check / deploy</text><text x="944" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">runtime command</text><text x="50" y="250" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay branches from recorded episodes. Model deployment follows the trained model contract.</text><rect x="30" y="320" width="1120" height="555" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="345" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">2  EXECUTION BOUNDARIES / who owns state and performs work</text><rect x="50" y="375" width="220" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser</text><text x="64" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">intent + presentation</text><rect x="330" y="375" width="250" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="344" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI gateway</text><text x="344" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">serves UI / proxies requests</text><path d="M270 415H330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="275" y="398" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">request</text><rect x="50" y="515" width="330" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device / data service</text><text x="64" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot + camera registry</text><text x="64" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">live devices / teleop / capture</text><text x="64" y="609" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">backend-owned identity and state</text><rect x="420" y="515" width="330" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Data studio service</text><text x="434" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inspection / curation / export</text><text x="434" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">training jobs / replay planning</text><text x="434" y="609" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">read/write owned artifacts</text><rect x="790" y="515" width="340" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="541" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Model runtime service</text><text x="804" y="567" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">native / external model execution</text><text x="804" y="588" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">compatibility / runtime logs</text><text x="804" y="609" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">commands via explicit interfaces</text><path d="M455 455V485H215V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M455 485H585V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 485H960V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="720" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot PC host / physical runtime</text><text x="64" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">USB + GPU + desktop session</text><text x="64" y="793" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">direct USB access or host VR snapshot bridge</text><rect x="630" y="720" width="500" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Persistent artifacts / shared volume</text><text x="644" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">captures / presets / calibration / models / logs</text><text x="644" y="793" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">shared files do not mean shared process memory</text><path d="M215 720V655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="68" y="695" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">sample / status</text><path d="M585 655V685H880V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="640" y="680" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">owned files</text><path d="M380 600H400V700H700V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="425" y="694" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">capture artifact</text><path d="M960 655V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="925" width="1120" height="205" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="950" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3  DOCUMENT AND REPOSITORY NAVIGATION / where a change begins</text><rect x="50" y="975" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="1001" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Question → authoritative doc</text><text x="64" y="1027" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI manual / schema / runbook</text><text x="64" y="1048" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">choose the work area first</text><rect x="420" y="975" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="1001" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Owning implementation</text><text x="434" y="1027" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">template / route / service / package</text><text x="434" y="1048" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">verify the actual call chain</text><rect x="790" y="975" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="1001" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Validation + documentation</text><text x="804" y="1027" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">test invariant / environment check</text><text x="804" y="1048" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">update the invalidated explanation</text><path d="M370 1025H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 1025H790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="1180" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Public explanatory reconstruction of the system flow and repository maps; connection details intentionally generalized.</text></svg>