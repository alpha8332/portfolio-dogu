<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 750" width="1180" height="750" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">One episode / identities and meaning across artifacts</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">One episode / identities and meaning across artifacts</text><rect x="30" y="80" width="255" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live session</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot owner / camera slot</text><path d="M285 125H314" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="318" y="80" width="255" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="332" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw episode</text><text x="332" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">state + issued commands</text><path d="M573 125H602" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="606" y="80" width="255" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="620" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training dataset</text><text x="620" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">canonical observation / action</text><path d="M861 125H890" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="894" y="80" width="255" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="908" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint</text><text x="908" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weights + execution contract</text><rect x="30" y="210" width="545" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="235" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CAPTURE IS NOT A TRAINING SCHEMA</text><rect x="50" y="260" width="225" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured state</text><text x="64" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">proprio / hand feedback</text><rect x="315" y="260" width="235" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="329" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Issued command</text><text x="329" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">control / hand command</text><rect x="50" y="375" width="500" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Time-aligned episode + metadata</text><text x="64" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">sample timestamps / valid flags / video sidecar alignment</text><path d="M162 340V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M430 340V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="605" y="210" width="545" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="617" y="235" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONVERSION MAKES THE SUPERVISION EXPLICIT</text><rect x="625" y="260" width="505" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="286" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Mapping + representation + statistics</text><text x="639" y="312" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">owner resolution / command vs feedback / relative pose / key order</text><rect x="625" y="375" width="240" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">observation at t</text><text x="639" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB + state + previous command</text><rect x="890" y="375" width="240" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="904" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">action at t … t+H−1</text><text x="904" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">target sequence + padding mask</text><path d="M750 345V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1010 345V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M550 410H590V300H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="540" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay branch</text><text x="44" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">recorded episode → initial alignment</text><text x="44" y="613" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ recorded-time execution (no policy)</text><rect x="420" y="540" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Native model branch</text><text x="434" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">processed data → ACT / DP training</text><text x="434" y="613" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ checkpoint → live observation</text><rect x="800" y="540" width="350" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">External policy branch</text><text x="814" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">research-team trained artifact</text><text x="814" y="613" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ bundle adapter → live rollout</text><path d="M162 450V520H200V540" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M877 480V510H585V540" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="700" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Invariant: same shape is insufficient — owner, units, frame, time origin and action semantics must survive every boundary.</text></svg>