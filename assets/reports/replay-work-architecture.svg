<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1160" width="1240" height="1160" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Robot Replay / source contract, execution owner and hardware feedback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot Replay / source contract, execution owner and hardware feedback</text><rect x="30" y="70" width="1180" height="82" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser / Visualization</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator intent: dataset + velocity ratio + start / pause / resume / stop; graph/RGB playback is a separate viewer</text><path d="M400 152V200" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="415" y="185" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">request via UI Gateway</text><rect x="30" y="200" width="760" height="635" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="225" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DATA-STUDIO / Replay manager + job thread</text><rect x="50" y="250" width="300" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw episode loader</text><text x="64" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HDF5 samples + session metadata</text><text x="64" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not derive robot commands from pixels</text><rect x="425" y="250" width="340" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay plan / preflight</text><text x="439" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot key + model + joint / EE contract</text><text x="439" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Project per-robot streams; choose mode</text><path d="M350 295H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="355" y="282" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">samples</text><rect x="50" y="405" width="715" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial alignment / separate execution phase</text><text x="64" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Idle readiness → recorded start target → hold/pulse + readback + settle</text><text x="64" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded clock and browser cursor do not advance here</text><path d="M595 340V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="580" width="220" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Task replay</text><text x="64" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded task targets</text><text x="64" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Wait for task-teleop mode</text><rect x="300" y="580" width="220" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="314" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Joint replay fallback</text><text x="314" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected joint frames</text><text x="314" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Retain original sample index</text><rect x="550" y="580" width="215" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="564" y="606" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared scheduler</text><text x="564" y="632" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Source timestamps</text><text x="564" y="653" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause-adjusted clock</text><path d="M205 505V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M410 505V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M655 505V580" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="730" width="715" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-source-index dispatch + replay-local last-sent state</text><text x="64" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm target → gripper target → hand joint shape / grasp command; update status after dispatch</text><path d="M160 675V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M410 675V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M655 675V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="850" y="250" width="360" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">DEVICE-DATA / registration owner</text><text x="864" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Current robot and attachment configuration</text><text x="864" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read-through registry refresh if missing</text><path d="M850 295H765" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="776" y="278" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">registry API</text><rect x="850" y="430" width="360" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay status snapshot</text><text x="864" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">starting / aligning / running / paused</text><text x="864" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">processed source position + robot results</text><text x="864" y="524" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">error + cleanup warnings</text><path d="M790 770H815V485H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="821" y="651" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">status</text><path d="M1210 475H1225V180H1040V152" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="805" y="174" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">poll response → cursor only</text><rect x="30" y="890" width="760" height="220" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="915" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">REPLAY EXECUTION PROCESS / worker and adapter calls</text><rect x="50" y="940" width="335" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="966" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">RobotWorker / SDK</text><text x="64" y="992" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute joint / task moves</text><text x="64" y="1013" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mode transition + stop requests</text><text x="64" y="1034" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cached control snapshot / refresh</text><rect x="430" y="940" width="335" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="966" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Gripper + robot_hand adapters</text><text x="444" y="992" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve robot / arm / runtime owner</text><text x="444" y="1013" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical targets + joint_move_to</text><text x="444" y="1034" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mode / force / grasp / release</text><path d="M230 810V940" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 810V940" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="850" y="940" width="360" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="966" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical robot + end-effector</text><text x="864" y="992" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller executes motion</text><text x="864" y="1013" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Readback: q / qdot / operation state</text><text x="864" y="1034" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Command accepted ≠ target reached</text><path d="M385 995H410V870H815V995H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="850" y="918" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">arm + EE commands</text><path d="M765 995H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M850 1040H800V1085H220V1055" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="550" y="1076" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback</text><path d="M220 940H15V455H50" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="40" y="870" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">alignment feedback</text></svg>