<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 960" width="1180" height="960" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Bottle cap opening / contact states and segmented teaching</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Bottle cap opening / contact states and segmented teaching</text><rect x="25" y="65" width="1130" height="275" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PHYSICAL ROLES / loosely pre-threaded cap, not arbitrary tightening torque</text><rect x="45" y="115" width="330" height="160" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Right arm / bottle support</text><text x="59" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp bottle body</text><text x="59" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Move or tilt toward the left arm</text><text x="59" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Maintain support during rotation</text><text x="59" y="230" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Place bottle after separation</text><rect x="425" y="115" width="330" height="160" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared contact condition</text><text x="439" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Bottle axis ≈ cap-tool axis</text><text x="439" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cap must be grasped before turn</text><text x="439" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Rotation precedes separation</text><text x="439" y="230" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm travel alone is insufficient</text><rect x="805" y="115" width="330" height="160" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Left arm / cap tool</text><text x="819" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Approach the cap</text><text x="819" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp / rotate / lift away</text><text x="819" y="209" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Place cap in the right corner</text><text x="819" y="230" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Return to the initial state</text><path d="M375 195H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M805 195H755" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="385" width="1130" height="220" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="410" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TASK SEQUENCE / state transitions with grasp ownership</text><rect x="45" y="440" width="190" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Support</text><text x="59" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Right: bottle</text><path d="M235 487H270" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="270" y="440" width="190" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Align</text><text x="284" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left: cap axis</text><path d="M460 487H495" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="495" y="440" width="190" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="509" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp cap</text><text x="509" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left: closed</text><path d="M685 487H720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="720" y="440" width="190" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="734" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rotate</text><text x="734" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hold + turn</text><path d="M910 487H945" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="945" y="440" width="190" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="959" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate</text><text x="959" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Lift and place</text><rect x="45" y="675" width="510" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="701" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Whole-sequence teaching</text><text x="59" y="727" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Approach + grasp + rotation + removal</text><text x="59" y="748" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">15 demonstrations in the early record</text><text x="59" y="769" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Unexpected rotation / approach succeeds but turn fails</text><text x="59" y="790" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Several hypotheses; no single cause established</text><rect x="625" y="675" width="510" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="701" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Segmented teaching attempt</text><text x="639" y="727" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Start after approach: close → rotate → remove</text><text x="639" y="748" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">20 demonstrations with smoother rotation</text><text x="639" y="769" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop approach model, then run the turn model</text><text x="639" y="790" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Manual experiment, not an automatic task planner</text><path d="M555 750H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="559" y="655" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">isolate hard phase</text><text x="45" y="900" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Trackpad jog: 5° per press. Short transitions can create velocity peaks; smoother teaching changes the time pattern.</text></svg>