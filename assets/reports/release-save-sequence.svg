<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 950" width="1180" height="950" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Case judgment / payload, actual row, saved copy and read-back</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Case judgment / payload, actual row, saved copy and read-back</text><rect x="25" y="65" width="1130" height="160" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BROWSER / one current case</text><rect x="45" y="110" width="515" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PASS payload</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">index + inspector + wired_pendant</text><rect x="600" y="110" width="530" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">FAIL payload</text><text x="614" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">index + inspector + wired_pendant + error reason</text><path d="M300 195V260H590V290" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M865 195V260H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="270" y="290" width="640" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Route → shared result writer</text><text x="284" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">verify loaded state and bounds; forward pendant in BOTH routes</text><path d="M590 375V425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="425" width="1130" height="295" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="450" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LOCKED WORKBOOK MUTATION</text><rect x="45" y="475" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve actual row</text><text x="59" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">data_rows[index]</text><text x="59" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI position is not an Excel row</text><rect x="420" y="475" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Write result + metadata</text><text x="434" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">result V / timestamp W</text><text x="434" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inspector W3 in retained writer</text><rect x="795" y="475" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conditional fields</text><text x="809" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">non-empty pendant → update option O</text><text x="809" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fail + reason → write remark</text><path d="M590 425V450H210V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M380 525H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M755 525H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="270" y="620" width="640" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="646" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Save result workbook copy → return refreshed item</text><path d="M960 575V600H590V620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="775" width="515" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Success response → browser navigation</text><text x="59" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">advance to next case; stay within final index</text><text x="59" y="848" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">re-query restores current saved values</text><rect x="600" y="775" width="530" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Retained change semantics</text><text x="614" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">empty selection does not clear old O</text><text x="614" y="848" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pass does not erase an earlier error remark</text><path d="M590 690V745H300V775" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 745H865V775" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="915" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">A current-row update is not an immutable judgment history. State transitions need explicit preservation rules.</text></svg>