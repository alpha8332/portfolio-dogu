<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" width="1240" height="1060" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">End effectors / recorded shape, command intent and target ownership</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">End effectors / recorded shape, command intent and target ownership</text><rect x="30" y="70" width="1180" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One source sample + owning robot / arm</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep the episode sample index; materialize the device payload for its configured attachment</text><path d="M210 155V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M620 155V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1030 155V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="245" width="360" height="410" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="270" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BINARY / CONTINUOUS GRIPPER</text><rect x="50" y="295" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="321" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical target stream</text><text x="64" y="347" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position_target + force_target</text><text x="64" y="368" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Use attachment-defined units</text><text x="64" y="389" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Legacy open/close only if absent</text><rect x="50" y="475" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve gripper attachment</text><text x="64" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Owner robot + arm/channel</text><text x="64" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw legacy order: left, right</text><path d="M210 405V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="440" y="245" width="360" height="410" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="452" y="270" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TESOLLO / RECORDED SHAPE</text><rect x="460" y="295" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="474" y="321" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback.joint_pos_deg</text><text x="474" y="347" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured finger joint configuration</text><text x="474" y="368" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Captures shape even without</text><text x="474" y="389" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">a stored home/zero event name</text><rect x="460" y="475" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="474" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">joint_move_to</text><text x="474" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay recorded joint targets</text><text x="474" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Motion time from sample spacing</text><path d="M620 405V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="850" y="245" width="360" height="410" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="862" y="270" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TESOLLO / COMMAND INTENT</text><rect x="870" y="295" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="884" y="321" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Mode + force + grasp state</text><text x="884" y="347" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Positive mode ID changes recipe</text><text x="884" y="368" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Missing/non-positive ID ≠ new mode</text><text x="884" y="389" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">State: release / grasp</text><rect x="870" y="475" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="884" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Mode → force → action</text><text x="884" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing robot_hand adapter</text><text x="884" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Profile support + result checks</text><path d="M1030 405V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="745" width="1180" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="771" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay-local last-sent state / first command must not vanish</text><text x="44" y="797" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Initialize per-run cache; dispatch changes with force to avoid stale runtime last_* suppression.</text><text x="44" y="818" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If both hand shape and grasp intent exist, the source loop sends joint targets before command-mode / grasp operations.</text><path d="M210 585V745" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M620 585V745" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1030 585V745" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="920" width="1180" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="946" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical result is a further observation</text><text x="44" y="972" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A replayed joint shape is not proof of restored contact forces, object pose or named grasp success. Match physical behavior separately.</text><path d="M620 845V920" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>