<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Tensor meaning / representation conversion and placeholder repair are different operations</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Tensor meaning / representation conversion and placeholder repair are different operations</text><rect x="30" y="80" width="1120" height="345" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MIXED ACTION / preserve non-pose slices</text><rect x="50" y="145" width="320" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="171" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Model internal: 54</text><text x="64" y="197" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position 6 + rotation 12</text><text x="64" y="218" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand joints 36</text><text x="64" y="239" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rotation uses two 6D blocks</text><rect x="430" y="145" width="320" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="171" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Decode pose only</text><text x="444" y="197" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">two 6D → two 3 × 3 matrices</text><text x="444" y="218" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">retain hand slice unchanged</text><text x="444" y="239" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">then concatenate again</text><rect x="810" y="145" width="320" height="140" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="824" y="171" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Expected target: 60</text><text x="824" y="197" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position 6 + rotation 18</text><text x="824" y="218" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand joints 36</text><text x="824" y="239" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not the physical joint DOF count</text><path d="M370 215H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 215H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="55" y="365" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Failure: returning pose 24 alone drops hand 36. Shrinking the label would hide the intended task.</text><rect x="30" y="480" width="1120" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="505" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INACTIVE TELEOP ROW / only for the known placeholder contract</text><rect x="50" y="545" width="320" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw teleop command</text><text x="64" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">six values all near zero</text><text x="64" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">mask tolerance: 1e−6</text><text x="64" y="639" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not every zero sensor array</text><rect x="430" y="545" width="320" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Aligned observation at t</text><text x="444" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current position + orientation</text><text x="444" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required keys present</text><text x="444" y="639" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">row counts consistent</text><rect x="810" y="545" width="320" height="140" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="824" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical action label</text><text x="824" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hold-current-pose for mask rows</text><text x="824" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">replace position AND orientation</text><text x="824" y="639" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">avoid false move-to-origin labels</text><path d="M370 615H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 615H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="55" y="780" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Also distinguish whole-body q from arm task-joint layout, and unchanged hand mode from invalid ownership.</text><text x="35" y="925" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Shape checks find structural mismatch; slice semantics explain which behavior was lost.</text></svg>