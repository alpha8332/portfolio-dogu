<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">MiMicX weight schedules / N=3, oldest → newest</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX weight schedules / N=3, oldest → newest</text><text x="30" y="95" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalized candidate share; analytical values, not measured task performance</text><text x="35" y="173" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">ones</text><rect x="265" y="145" width="283.3333333333333" height="50" fill="#9eb2bf" opacity="0.30" stroke="#9eb2bf"/><text x="280" y="175" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q1: 0.333</text><rect x="548.3333333333333" y="145" width="283.3333333333333" height="50" fill="#80d0f5" opacity="0.30" stroke="#80d0f5"/><text x="563.3333333333333" y="175" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q2: 0.333</text><rect x="831.6666666666665" y="145" width="283.3333333333333" height="50" fill="#eab67e" opacity="0.30" stroke="#eab67e"/><text x="846.6666666666665" y="175" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q3: 0.333</text><text x="35" y="273" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">linear</text><rect x="265" y="245" width="141.66666666666666" height="50" fill="#9eb2bf" opacity="0.30" stroke="#9eb2bf"/><text x="280" y="275" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q1: 0.167</text><rect x="406.66666666666663" y="245" width="283.3333333333333" height="50" fill="#80d0f5" opacity="0.30" stroke="#80d0f5"/><text x="421.66666666666663" y="275" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q2: 0.333</text><rect x="690.0" y="245" width="425.0" height="50" fill="#eab67e" opacity="0.30" stroke="#eab67e"/><text x="705.0" y="275" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q3: 0.500</text><text x="35" y="373" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">exp α=1</text><rect x="265" y="345" width="171.8393776275812" height="50" fill="#9eb2bf" opacity="0.30" stroke="#9eb2bf"/><text x="280" y="375" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q1: 0.202</text><rect x="436.8393776275812" y="345" width="294.96767208725623" height="50" fill="#80d0f5" opacity="0.30" stroke="#80d0f5"/><text x="451.8393776275812" y="375" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q2: 0.347</text><rect x="731.8070497148374" y="345" width="383.1929502851626" height="50" fill="#eab67e" opacity="0.30" stroke="#eab67e"/><text x="746.8070497148374" y="375" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q3: 0.451</text><text x="35" y="473" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">exp α=4</text><rect x="265" y="445" width="236.3292083446225" height="50" fill="#9eb2bf" opacity="0.30" stroke="#9eb2bf"/><text x="280" y="475" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q1: 0.278</text><rect x="501.3292083446225" y="445" width="298.62491131742024" height="50" fill="#80d0f5" opacity="0.30" stroke="#80d0f5"/><text x="516.3292083446224" y="475" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q2: 0.351</text><rect x="799.9541196620428" y="445" width="315.04588033795716" height="50" fill="#eab67e" opacity="0.30" stroke="#eab67e"/><text x="814.9541196620428" y="475" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q3: 0.371</text><text x="35" y="573" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">exp α=8</text><rect x="265" y="545" width="270.37387612631295" height="50" fill="#9eb2bf" opacity="0.30" stroke="#9eb2bf"/><text x="280" y="575" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q1: 0.318</text><rect x="535.373876126313" y="545" width="289.16038616005545" height="50" fill="#80d0f5" opacity="0.30" stroke="#80d0f5"/><text x="550.373876126313" y="575" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q2: 0.340</text><rect x="824.5342622863684" y="545" width="290.46573771363165" height="50" fill="#eab67e" opacity="0.30" stroke="#eab67e"/><text x="839.5342622863684" y="575" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">q3: 0.342</text><rect x="30" y="690" width="535" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="716" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Positive α close to zero</text><text x="44" y="742" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw weight ≈ αi/N</text><text x="44" y="763" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normalization cancels α → nearly linear</text><rect x="595" y="690" width="555" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="609" y="716" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Large α</text><text x="609" y="742" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">every raw weight approaches 1</text><text x="609" y="763" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normalized weights approach equal shares</text><text x="35" y="855" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Exactly α=0: raw sum is zero → explicit uniform fallback. Paper exp(−m·i) is a different weighting rule.</text></svg>