<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1050" width="1180" height="1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Manus / geometric retargeting and joint servo solve different problems</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Manus / geometric retargeting and joint servo solve different problems</text><rect x="35" y="75" width="1110" height="370" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UPPER LAYER / MiMicX</text><rect x="55" y="125" width="315" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Human hand shape</text><text x="69" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">wrist-local skeleton</text><text x="69" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source side + robot hand owner</text><rect x="425" y="125" width="315" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Retargeting</text><text x="439" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FK geometry + pinch targets</text><text x="439" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">constrained optimizer → q* [rad]</text><rect x="795" y="125" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command shaping</text><text x="809" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">degree → smoothing / fixed joints</text><text x="809" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">profile bounds / optional filter</text><path d="M370 175H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 175H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="425" y="305" width="700" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="331" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Driver / command transport</text><text x="439" y="357" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">motion time first → 0.1° integer position target; repeated-time cache</text><path d="M960 225V305" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="515" width="1110" height="340" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="540" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LOWER LAYER / hand controller</text><rect x="55" y="575" width="300" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Given joint target q_des</text><text x="69" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">profile time / gain mode</text><text x="69" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position error e = q_des − q_meas</text><rect x="425" y="575" width="300" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position servo</text><text x="439" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">P: error; D: change; I: sum</text><text x="439" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PD or PID configuration</text><rect x="795" y="575" width="330" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Joint / physical hand</text><text x="809" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">motor → joints → object contact</text><text x="809" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual measured joint state</text><path d="M775 395V485H205V575" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="380" y="475" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Modbus/TCP target</text><path d="M355 628H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M725 628H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M960 680V775H205V680" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="400" y="767" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback closes the lower position-following loop</text><rect x="35" y="910" width="1110" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="936" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PID does not decide which robot joint configuration represents the human grasp</text><text x="49" y="962" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">That desired configuration is the output of the upper geometry problem, before position following begins.</text></svg>