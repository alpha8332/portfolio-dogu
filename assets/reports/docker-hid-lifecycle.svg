<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1020" width="1180" height="1020" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">HID identity + lifecycle / two identical devices must not collapse into one</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">HID identity + lifecycle / two identical devices must not collapse into one</text><rect x="30" y="80" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">hidapi enumeration</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">VID / PID + raw USB branch token</text><text x="44" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Catalog entry is not an open handle</text><rect x="445" y="80" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">sysfs candidate lookup</text><text x="459" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Filter VID/PID; inspect physical branch</text><text x="459" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve to concrete /dev/hidrawN</text><path d="M370 130H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="380" y="115" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">identity</text><rect x="840" y="80" width="310" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="854" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Ambiguous identical devices</text><text x="854" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No branch match + multiple candidates</text><text x="854" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ no guessed first VID/PID match</text><path d="M775 130H840" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="775" y="115" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">ambiguous</text><rect x="30" y="250" width="520" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Candidate order</text><text x="44" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Concrete hidraw paths first → raw paths later</text><text x="44" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep selected identity through saved params / binding</text><path d="M610 180V220H290V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="380" y="210" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">resolved node</text><rect x="635" y="250" width="515" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="649" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Standard open_path + immediate validation</text><text x="649" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A returned Python object can still be closed</text><text x="649" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Accessor &quot;not open&quot; means this candidate failed</text><path d="M550 300H635" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="635" y="430" width="250" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="649" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Candidate rejected</text><text x="649" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Close failed handle</text><text x="649" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Try next candidate</text><rect x="930" y="430" width="220" height="95" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="944" y="456" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read / decode</text><text x="944" y="482" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Packet + axes + buttons</text><text x="944" y="503" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check actual changes</text><path d="M800 350V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="815" y="401" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">not open</text><path d="M1040 350V430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1054" y="401" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">validated</text><path d="M635 477H590V385H892V350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="594" y="420" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">retry</text><rect x="30" y="590" width="1120" height="310" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="615" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT OWNERSHIP / selecting a device and binding an arm are different operations</text><rect x="50" y="650" width="300" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input A / concrete node A</text><text x="64" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved identity A + current sample A</text><rect x="50" y="775" width="300" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input B / concrete node B</text><text x="64" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved identity B + current sample B</text><rect x="430" y="685" width="310" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="711" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit arm bindings</text><text x="444" y="737" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller identity → robot / arm</text><text x="444" y="758" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Calibration + operator action mapping</text><text x="444" y="779" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not reuse first discovered device</text><rect x="840" y="650" width="285" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="854" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm A command</text><text x="854" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Intended owner + matching input</text><rect x="840" y="775" width="285" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="854" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm B command</text><text x="854" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Intended owner + matching input</text><path d="M350 695H430V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M350 820H400V780H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 720H800V695H840" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 780H800V820H840" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="960" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Discovery → path resolution → open validation → packet read → binding → physical motion</text></svg>