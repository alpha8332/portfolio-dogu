<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 960" width="1180" height="960" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Tracked pose / translation basis and orientation conjugation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracked pose / translation basis and orientation conjugation</text><rect x="35" y="75" width="1110" height="350" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">POSITION EXAMPLE / C = Rz(90°), scale = 0.5</text><text x="170" y="350" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking base</text><path d="M200 280H340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="345" y="285" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">x</text><path d="M200 280V150" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="210" y="150" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">y</text><path d="M200 280L135 325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="120" y="330" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">z</text><text x="785" y="350" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot base</text><path d="M815 280H955" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="960" y="285" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">x</text><path d="M815 280V150" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="825" y="150" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">y</text><path d="M815 280L750 325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="735" y="330" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">z</text><path d="M210 250H310" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="85" y="120" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">δx = (20, 0, 0) mm</text><path d="M785 270V190" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="700" y="120" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">scaled δp = (0, 10, 0) mm</text><path d="M420 265H640" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="468" y="245" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">C then scale</text><text x="70" y="390" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Subtract tracking positions first. Add the transformed displacement to the current robot start position.</text><rect x="35" y="475" width="1110" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="500" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ORIENTATION / transport an activation-relative rotation through the correct basis</text><rect x="55" y="540" width="250" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device at activation</text><text x="69" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">relative ΔR is expressed here</text><path d="M305 588H327" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="330" y="540" width="250" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="344" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking base</text><text x="344" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_x0 maps into this basis</text><path d="M580 588H602" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="605" y="540" width="250" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot base</text><text x="619" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">C aligns the two bases</text><path d="M855 588H877" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="880" y="540" width="250" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="894" y="566" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">TCP at activation</text><text x="894" y="592" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_r0ᵀ maps into TCP basis</text><text x="70" y="690" fill="#80d0f5" font-size="25" font-family="Segoe UI,Malgun Gothic,sans-serif">B = R_r0ᵀ C R_x0</text><text x="570" y="690" fill="#e1eaf0" font-size="23" font-family="Segoe UI,Malgun Gothic,sans-serif">R_cmd = R_r0 B ΔR_scaled Bᵀ</text><text x="70" y="740" fill="#eab67e" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">B ΔR Bᵀ changes the basis of a rotation operator; it does not add Euler components.</text><rect x="35" y="825" width="1110" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="851" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Sanity checks</text><text x="49" y="877" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">zero relative motion → original robot pose | scale 1, deadzone 0 → full calibrated relative rotation</text></svg>