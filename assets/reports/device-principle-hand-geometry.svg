<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" width="1180" height="1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Hand retargeting / wrist vectors, fingertip pairs and pinch targets</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand retargeting / wrist vectors, fingertip pairs and pinch targets</text><rect x="35" y="75" width="1110" height="400" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">GEOMETRIC FEATURES / four selected tips, six unordered pairs</text><path d="M330 420L180 175" fill="none" stroke="#80d0f5" stroke-width="2"/><circle cx="180" cy="175" r="9" fill="#80d0f5"/><text x="192" y="165" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">tip 0</text><path d="M330 420L430 145" fill="none" stroke="#80d0f5" stroke-width="2"/><circle cx="430" cy="145" r="9" fill="#80d0f5"/><text x="442" y="135" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">tip 1</text><path d="M330 420L560 215" fill="none" stroke="#80d0f5" stroke-width="2"/><circle cx="560" cy="215" r="9" fill="#80d0f5"/><text x="572" y="205" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">tip 2</text><path d="M330 420L650 340" fill="none" stroke="#80d0f5" stroke-width="2"/><circle cx="650" cy="340" r="9" fill="#80d0f5"/><text x="662" y="330" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">tip 3</text><circle cx="330" cy="420" r="9" fill="#eab67e"/><text x="350" y="440" fill="#eab67e" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">wrist origin</text><path d="M180 175L430 145" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><path d="M180 175L560 215" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><path d="M180 175L650 340" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><path d="M430 145L560 215" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><path d="M430 145L650 340" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><path d="M560 215L650 340" fill="none" stroke="#47606e" stroke-width="1" stroke-dasharray="6 5"/><rect x="770" y="125" width="345" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="784" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Wrist-to-tip features</text><text x="784" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">4 vectors × 3 coordinates</text><text x="784" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">scaled with β</text><text x="784" y="219" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve overall finger spread</text><rect x="770" y="300" width="345" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="784" y="326" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tip-to-tip features</text><text x="784" y="352" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">6 vectors × 3 coordinates</text><text x="784" y="373" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve relative contact geometry</text><text x="784" y="394" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not 30 physical joint DOF</text><rect x="35" y="530" width="1110" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="555" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PINCH / change a target length and its importance</text><circle cx="150" cy="670" r="12" fill="#80d0f5"/><circle cx="230" cy="700" r="12" fill="#80d0f5"/><path d="M150 670L230 700" fill="none" stroke="#eab67e" stroke-width="4"/><text x="70" y="770" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Human tips become close.</text><path d="M335 700H470" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="330" y="682" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">distance threshold</text><rect x="500" y="595" width="610" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="514" y="621" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Thumb pair: target length η₁, high weight s₁</text><text x="514" y="647" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">maintain pair direction; prioritize contact geometry</text><rect x="500" y="745" width="610" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="514" y="771" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Two fingers simultaneously pinch the thumb</text><text x="514" y="797" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">non-thumb pair: at least η₂, weight s₂</text><text x="514" y="818" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">avoid collapsing all fingertip targets to one point</text><path d="M805 700V745" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="965" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Objective: fit robot FK to these targets within joint limits; the human and robot link geometry differs.</text><text x="35" y="1020" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Target distances are configuration choices, not measured physical grasp accuracy.</text></svg>