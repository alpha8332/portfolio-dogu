<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Enterprise teleoperation startup / two prerequisite paths</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Enterprise teleoperation startup / two prerequisite paths</text><rect x="25" y="65" width="550" height="430" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT SIDE / control state and endpoint readiness</text><rect x="45" y="115" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller + framework</text><text x="59" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Start and check live connection / robot response</text><rect x="45" y="245" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Servo / pendant control mode</text><text x="59" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Manual versus automatic mode changes command eligibility</text><rect x="45" y="375" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot state</text><text x="59" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read current joint and task pose before sending commands</text><path d="M300 200V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M300 330V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="605" y="65" width="550" height="430" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="617" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INPUT SIDE / pose and button generation</text><rect x="625" y="115" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SteamVR runtime</text><text x="639" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking system / controllers connected</text><rect x="625" y="245" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Valid live samples</text><text x="639" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose and button input are available and changing</text><rect x="625" y="375" width="510" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="401" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm correspondence</text><text x="639" y="427" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reference / calibration and left-right target mapping</text><path d="M880 200V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 330V375" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="590" width="510" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Minimum SDK path</text><text x="59" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Confirm dual-arm API support</text><text x="59" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Split task pose into left/right pose6</text><text x="59" y="684" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Address the intended arm and end tool</text><text x="59" y="705" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Send current pose / verify clean stop</text><rect x="625" y="590" width="510" height="155" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Task-level operation</text><text x="639" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare bottle / cap / initial contact state</text><text x="639" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Coordinate support, alignment and rotation</text><text x="639" y="684" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Evaluate actual grasp and separation</text><text x="639" y="705" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">API success alone is not task success</text><path d="M300 460V590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 460V550H300V590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 665H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="565" y="650" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">task</text><text x="45" y="835" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Redrawn from the historical operator procedure. Device indicators are version-specific observations, not universal control rules.</text></svg>