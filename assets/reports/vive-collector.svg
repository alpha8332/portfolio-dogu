<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Vive / one tracked frame, independent consumers</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive / one tracked frame, independent consumers</text><rect x="30" y="75" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SteamVR / OpenVR session</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tracking universe + device catalog; pose validity and controller input availability are separate</text><path d="M280 155V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M900 155V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="210" width="510" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="236" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Serial → runtime device index</text><text x="44" y="262" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve configured controller / tracker</text><text x="44" y="283" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">index is a live address, serial identifies the device</text><rect x="620" y="210" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="236" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read one pose frame for the loop</text><text x="634" y="262" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">device-to-tracking transform + velocity + valid flags</text><text x="634" y="283" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">controller state: axes / pressed and touched bitmasks</text><path d="M540 260H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 310V365" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="270" y="365" width="640" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="391" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalized per-device sample</text><text x="284" y="417" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">timestamp · identity · role · valid · position · quaternion · velocity</text><text x="284" y="438" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">controller input payload remains separate from tracked pose</text><path d="M590 465V505H205V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 505V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 505H970V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="550" width="350" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PyBullet viewer</text><text x="44" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">coordinate / mesh alignment</text><text x="44" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose triad and device shape</text><text x="44" y="644" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">visual interpretation</text><rect x="420" y="550" width="340" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live plot</text><text x="434" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">per-device time window</text><text x="434" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">display rate decoupled from polling</text><text x="434" y="644" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position / orientation / inputs</text><rect x="800" y="550" width="350" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="814" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CSV / JSONL logger</text><text x="814" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity + time + validity</text><text x="814" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">values at the logging boundary</text><text x="814" y="644" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a MiMicX training dataset</text><text x="30" y="725" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">First valid per-device position is used as a local display/recording origin in this collector loop.</text><text x="30" y="765" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A visible pose does not prove valid buttons, a calibrated robot frame, or permission to command a robot.</text></svg>