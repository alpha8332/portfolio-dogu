<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 950" width="1180" height="950" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Excel contract / content discovery and result writing are different mappings</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Excel contract / content discovery and result writing are different mappings</text><rect x="25" y="65" width="1130" height="235" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONTENT READ / header names and actual case rows</text><rect x="45" y="110" width="335" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Find content header</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">search first 120 rows</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">6 required Korean content headers</text><text x="59" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">use the active worksheet</text><rect x="420" y="110" width="335" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Filter actual case rows</text><text x="434" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">feature / content / steps / expected</text><text x="434" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">any non-empty field → include row</text><text x="434" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">skip formatting-only rows</text><rect x="795" y="110" width="335" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Display category context</text><text x="809" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">forward-fill screen / tab / feature</text><text x="809" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">for display only</text><text x="809" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">keep original merge structure</text><path d="M380 180H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M755 180H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="350" width="1130" height="175" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="375" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROW IDENTITY / schematic example, not source-sheet values</text><rect x="45" y="400" width="300" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI index: 0 / 1 / 2</text><text x="59" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position in filtered list</text><rect x="440" y="400" width="300" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="454" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">data_rows: [5, 8, 11]</text><text x="454" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit index → actual row mapping</text><rect x="835" y="400" width="295" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="849" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual Excel row</text><text x="849" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">read and write the same case</text><path d="M345 440H440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 440H835" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="580" width="1130" height="235" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="605" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">COLUMN + METADATA CONTRACT / observed schema differences</text><rect x="45" y="630" width="515" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Earlier sheet format</text><text x="59" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Result: V   |   Time: W   |   Remark: X</text><text x="59" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspector metadata: W3 family</text><text x="59" y="724" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Writer retains fixed V / W positions</text><rect x="600" y="630" width="530" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Later sheet format</text><text x="614" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Result: W   |   Time: X   |   Remark: Y</text><text x="614" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspector metadata: X3 family</text><text x="614" y="724" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">An added equipment column shifts the result columns</text><text x="45" y="855" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Current code: start writes inspector to X3; item reading and judgment writing still use W3.</text><text x="45" y="895" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">A robust next step is one shared schema for load / read / write — header discovery alone does not solve this.</text></svg>