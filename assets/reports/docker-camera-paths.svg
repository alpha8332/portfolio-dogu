<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1030" width="1240" height="1030" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Camera / physical acquisition, browser preview and saved media are separate paths</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera / physical acquisition, browser preview and saved media are separate paths</text><rect x="30" y="75" width="330" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical camera → container handler</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stable identity / open / actual profile</text><text x="44" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">New frames + capture timestamps</text><rect x="450" y="75" width="345" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend frame cache</text><text x="464" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fresh image can exist here</text><text x="464" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">while a browser preview remains blank</text><path d="M360 122H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="370" y="111" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB frame</text><rect x="30" y="225" width="1180" height="295" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="250" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PREVIEW / compare where bytes stop</text><rect x="50" y="280" width="340" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">MJPEG stream endpoint</text><text x="64" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Multipart first frame may stall</text><text x="64" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HTTP route exists ≠ image delivered</text><rect x="450" y="280" width="345" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Single JPEG frame endpoint</text><text x="464" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Snapshot request / response</text><text x="464" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Unique cache token per reload</text><rect x="880" y="280" width="310" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="894" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser img element</text><text x="894" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Set src → load/error → schedule</text><text x="894" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not freeze on an empty phase object</text><path d="M620 170V205H220V280" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="240" y="199" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">legacy path</text><path d="M620 205V280" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="638" y="246" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">direct-camera default</text><path d="M795 325H880" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="802" y="311" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">JPEG</text><path d="M1035 370V445H620V370" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="693" y="435" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next request</text><rect x="30" y="575" width="1180" height="330" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="600" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CAPTURE / not the browser preview image loop</text><rect x="50" y="630" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CapturePlan + sample selection</text><text x="64" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected camera / canonical stream key</text><text x="64" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Sample validity + time association</text><rect x="450" y="630" width="345" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="656" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">HDF5</text><text x="464" y="682" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot / device arrays</text><text x="464" y="703" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera timing + validity + metadata</text><rect x="450" y="775" width="345" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Bounded RGB queue + encoder</text><text x="464" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Frame shape padding / codec attempts</text><text x="464" y="848" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ffmpeg failure → mp4v fallback</text><rect x="880" y="775" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="894" y="801" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">MP4 sidecar + finalization</text><text x="894" y="827" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Close writer; inspect frame / error stats</text><text x="894" y="848" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Media and integrity checks together</text><path d="M30 145H15V550H220V630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="40" y="543" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">capture frames</text><path d="M390 680H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="393" y="663" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">timing</text><path d="M220 730V825H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="330" y="816" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB</text><path d="M795 825H880" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1035 775V680H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="878" y="670" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">writer result / warnings</text><text x="30" y="970" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Preview success does not prove the recording exists; HDF5 timing does not prove RGB sidecar completeness.</text></svg>