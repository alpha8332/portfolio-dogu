<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1110" width="1240" height="1110" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Multi-robot session / concurrent alignment, shared barrier and ordered dispatch</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Multi-robot session / concurrent alignment, shared barrier and ordered dispatch</text><rect x="30" y="70" width="1180" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dataset session contract</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot keys + participant order + models / joints / end-effector ownership; no first-robot fallback for a multi-robot episode</text><rect x="30" y="230" width="340" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare participants</text><text x="44" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve workers and initial targets</text><text x="44" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not start independent timelines</text><rect x="450" y="230" width="330" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Alignment thread A</text><text x="464" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Wait shared start event</text><text x="464" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Align q₀,A and settle</text><rect x="850" y="230" width="360" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Alignment thread B … N</text><text x="864" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Wait shared start event</text><text x="864" y="303" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Align q₀,B … q₀,N and settle</text><path d="M370 277H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="375" y="261" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">release event</text><path d="M200 325V360H1030V325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="540" y="350" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">same start event</text><rect x="450" y="445" width="760" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="471" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Join / all-ready barrier</text><text x="464" y="497" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">All aligned → enable required task modes → start ONE replay clock</text><text x="464" y="518" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One alignment failure sets abort and requests all participants to stop</text><path d="M615 325V445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1030 325V445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="645" width="340" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="671" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared source sample i</text><text x="44" y="697" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Project robot A / B / N streams</text><text x="44" y="718" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep per-robot frame cursors</text><text x="44" y="739" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EE last-sent state per owner</text><rect x="450" y="645" width="330" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="671" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dispatch participant A</text><text x="464" y="697" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm command → gripper / hand</text><text x="464" y="718" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Worker / adapter result</text><rect x="850" y="645" width="360" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="671" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dispatch B … N</text><text x="864" y="697" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same source index, ordered calls</text><text x="864" y="718" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not simultaneous network arrival</text><path d="M830 540V590H200V645" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M370 700H450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M780 700H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1030 755V825H200V755" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="400" y="815" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">update all status → shared deadline wait → i+1</text><rect x="30" y="920" width="1180" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="946" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Failure exits the session; cleanup targets every participating robot</text><text x="44" y="972" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Record session error / per-robot results and attempt idle return. Preserve cleanup warnings.</text><text x="44" y="993" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared source indexing avoids independent cursor drift; it does not measure cross-controller synchronization error.</text><path d="M1210 700H1225V970H1210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1125" y="875" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">failure</text></svg>