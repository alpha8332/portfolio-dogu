<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1050" width="1180" height="1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Mixed output / mechanical DOF is not action-vector width</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Mixed output / mechanical DOF is not action-vector width</text><text x="30" y="95" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Example: two arm task poses + two 18-joint hands; intervals are half-open [start:end).</text><text x="30" y="130" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">INTERNAL HEAD / 54 values</text><rect x="30" y="155" width="230" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="181" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position [0:6)</text><rect x="280" y="155" width="290" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="181" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rotation 6D [6:18)</text><rect x="590" y="155" width="500" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="604" y="181" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand tail [18:54)</text><text x="30" y="385" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">RESTORED TARGET LAYOUT / 60 values</text><rect x="30" y="410" width="230" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position [0:6)</text><rect x="280" y="410" width="290" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Matrix [6:24)</text><rect x="590" y="410" width="500" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="604" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand tail [24:60)</text><text x="30" y="640" fill="#eab67e" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">FAULTY DECODE / 24 values</text><rect x="30" y="665" width="230" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="691" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position [0:6)</text><rect x="280" y="665" width="290" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="691" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Matrix [6:24)</text><rect x="590" y="665" width="500" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="604" y="691" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand tail lost</text><path d="M410 230V410" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="430" y="315" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">2 rotations: 6 each → 9 each</text><path d="M800 230V315H850V410" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="810" y="297" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve values + order</text><path d="M295 485V665" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="315" y="565" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">old branch returned only pose</text><rect x="30" y="855" width="1120" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="881" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Correct restoration</text><text x="44" y="907" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">head = raw[..., :18]; tail = raw[..., 18:]</text><text x="44" y="928" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">restored = concatenate(decode_pose(head), tail) → 24 + 36 = 60</text><text x="44" y="949" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Apply the same preservation in training forward and inference select_action; check actual tail contents as well as width.</text></svg>