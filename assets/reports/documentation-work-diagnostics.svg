<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1070" width="1180" height="1070" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Diagnostic writing / turn zero input into discriminating questions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Diagnostic writing / turn zero input into discriminating questions</text><rect x="250" y="80" width="680" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observed on the EIR setup task</text><text x="264" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose updates, but trigger / squeeze / button values stay zero</text><path d="M590 170V215" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="250" y="215" width="680" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="241" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not treat all zero values as the same state</text><text x="264" y="267" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inspect pose validity and action activity separately</text><text x="264" y="288" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">then inspect the actual application session</text><path d="M590 315V350H295V395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="320" y="344" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">action active</text><path d="M590 350H890V395" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="660" y="344" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">action inactive / session unhealthy</text><rect x="30" y="395" width="530" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Active input / value currently zero</text><text x="44" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actuate the intended control and sample changes</text><text x="44" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">check selected device / binding / gate</text><text x="44" y="489" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">zero can mean a valid neutral or released value</text><rect x="610" y="395" width="540" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime / render / focus investigation</text><text x="624" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inspect session state, renderer, frame and swapchain</text><text x="624" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose tracking does not prove action delivery</text><text x="624" y="489" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">separate OS input from application runtime</text><path d="M890 525V575" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="610" y="575" width="540" height="130" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="624" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation can alter the observed system</text><text x="624" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">a simultaneous debug client can take focus</text><text x="624" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">stop competing diagnostic sessions</text><text x="624" y="669" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">verify the MiMicX session used by command dispatch</text><rect x="30" y="575" width="530" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Write a useful failure branch</text><text x="44" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">condition → observable → next action</text><text x="44" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not: “reinstall and try again”</text><text x="44" y="669" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not: “pose exists, so the controller is ready”</text><path d="M295 525V575" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 705V750H590V790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 705V750H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="250" y="790" width="680" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Close with the actual path and conditions</text><text x="264" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">confirm input changes in the application session</text><text x="264" y="863" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">then verify the relevant robot TeleT path</text><text x="264" y="884" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">record the environment, change and observed result</text><text x="35" y="980" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reconstructed from the original EIR setup incident report. This is a case-specific diagnostic structure.</text><text x="35" y="1025" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">It explains what to distinguish; it does not claim every OpenXR runtime has the same failure cause.</text></svg>