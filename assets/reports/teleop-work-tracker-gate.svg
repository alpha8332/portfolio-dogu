<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Pose-only tracker / explicit activation and reference lifecycle</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose-only tracker / explicit activation and reference lifecycle</text><rect x="35" y="85" width="490" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracking available</text><text x="49" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose + validity + timestamp</text><text x="49" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No controller trigger is assumed</text><rect x="655" y="85" width="490" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Application activation</text><text x="669" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">teleop_active + teleop_epoch</text><text x="669" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit control, independent of pose availability</text><path d="M525 135H655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="550" y="119" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">read gate</text><rect x="35" y="275" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inactive / tracking unavailable</text><text x="49" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">do not apply relative motion</text><text x="49" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clear live reference / stabilize current robot pose</text><rect x="655" y="275" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rising active or new epoch</text><text x="669" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">capture current tracker pose + current robot pose</text><text x="669" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">new relative origin</text><path d="M900 190V275" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="915" y="239" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">active + new reference</text><path d="M655 210H280V275" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="340" y="201" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">inactive / invalid</text><rect x="655" y="475" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Continuous active tracking</text><text x="669" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">relative translation + SO(3) rotation</text><text x="669" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">calibration basis → robot-base task target</text><path d="M900 385V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="915" y="434" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">fresh pose</text><path d="M1145 530H1165V230H900V275" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1000" y="222" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">new epoch</text><path d="M655 530H570V330H525" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="550" y="450" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">release / invalid</text><rect x="35" y="475" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Attachment is a physical transform</text><text x="49" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">body / fixture → tracker; mount can move</text><text x="49" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A stable pose stream cannot prove stable attachment</text><rect x="35" y="670" width="1110" height="110" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="695" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PRE-MOTION CHECK</text><text x="55" y="715" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Small single-axis move → check sign and scale → small rotation → release → re-activate</text><text x="55" y="753" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Check tracking quality AND attachment movement. Explicit activation prevents accidental arm motion.</text></svg>