<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1020" width="1180" height="1020" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Visualization follows Replay / backend progress is not a physical pose sensor</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Visualization follows Replay / backend progress is not a physical pose sensor</text><rect x="30" y="70" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="96" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">starting / aligning</text><text x="44" y="122" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot aligns to the start pose. Stop local playback / interpolation; keep graph, table and media cursor fixed.</text><rect x="30" y="240" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend running status</text><text x="44" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current_index = processed sample count</text><text x="44" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Source timestamp / progress</text><text x="44" y="334" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Poll nominally every 120 ms</text><rect x="445" y="240" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser anchor</text><text x="459" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Display index = max(0, count−1)</text><text x="459" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Re-anchor on each status response</text><path d="M370 290H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="435" width="340" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Local animation between polls</text><text x="44" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Source time-axis rate first</text><text x="44" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observed progress rate as fallback</text><text x="44" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Bound visual runahead</text><path d="M610 340V380H200V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="445" y="435" width="330" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Fractional cursor</text><text x="459" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Interpolate chart-pixel position</text><text x="459" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Smooth graph / progress display</text><text x="459" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not a new robot target</text><rect x="850" y="435" width="300" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Nearest real sample</text><text x="864" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Round / clamp for table / RGB</text><text x="864" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pika viewer reconstructs its frame</text><text x="864" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep selected dataset identity</text><path d="M370 490H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M775 490H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1030 550V630H200V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="400" y="619" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">new backend status replaces prediction anchor</text><rect x="30" y="740" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="766" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause / stop / terminal states</text><text x="44" y="792" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop animation and use reported source position. Cursor measures source dispatch progress, not actual target arrival.</text><text x="44" y="813" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Smoother drawing does not reduce robot tracking error; compare physical readback on an aligned time interval.</text><rect x="30" y="895" width="1120" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="921" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One-way authority</text><text x="44" y="947" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Browser displays the replay job; dragging a graph cursor does not dispatch a physical replay command.</text></svg>