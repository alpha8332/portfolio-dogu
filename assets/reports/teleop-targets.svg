="detail">relative device change → robot</text><path d="M425 262 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="212" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="240" class="head">Robot task pose</text><text x="724" y="294" class="detail">binding / owner / mode</text><path d="M685 262 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="378" class="label">GLOVE</text><rect x="190" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="380" class="head">Manus hand sample</text><text x="204" y="434" class="detail">skeleton / ergonomic / wrist</text><rect x="450" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="380" class="head">Retarget + hand profile</text><text x="464" y="434" class="detail">human hand → robot joint target</text><path d="M425 402 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="352" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="380" class="head">Tesollo hand runtime</text><text x="724" y="434" class="detail">command / feedback are separate</text><path d="M685 402 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><line x1="32" y1="498" x2="968" y2="498" stroke="#34434c"/><text x="32" y="525" class="detail">입력 생성·목표 변환·장치 실행은 다른 책임이다. MiMicX 사용·연동 경험을 설명한 구조도다.</text></svg>