<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Frames / axis convention, translation origin and mesh-local corrections</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Frames / axis convention, translation origin and mesh-local corrections</text><rect x="30" y="75" width="530" height="275" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">OPENVR TRACKING SPACE / right-handed</text><rect x="620" y="75" width="530" height="275" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PROJECT DISPLAY CONVENTION / after complete helper</text><path d="M260 255h155" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M260 255v-110" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M260 255l-110 55" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="270" y="282" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">+X right</text><text x="240" y="131" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">+Y up</text><text x="120" y="331" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">+Z backward</text><path d="M850 255h155" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M850 255v-110" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M850 255l-110 55" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="860" y="282" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">display +Y = VR +X</text><text x="830" y="131" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">display +Z = VR +Y</text><text x="710" y="331" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">display +X = VR +Z</text><rect x="30" y="435" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position helper: (−z, −x, y), then flip its first two components</text><text x="44" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Final p_display = (z, x, y) = C p_VR</text><text x="44" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Example only: (0.10, 0.20, −0.30) m → (−0.30, 0.10, 0.20) m</text><path d="M295 350V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 350V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="620" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="646" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Orientation helper / composed rotations</text><text x="44" y="672" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_display = S M R_VR S = C R_VR S</text><text x="44" y="693" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">S = diag(−1,−1,1), C = S M</text><text x="44" y="714" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Includes device-axis convention, not C R Cᵀ</text><rect x="620" y="620" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="646" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-device origin / translation only</text><text x="634" y="672" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_relative,d = p_display,d − first_valid_p_d</text><text x="634" y="693" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Orientation is not zeroed by this subtraction</text><text x="634" y="714" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not a shared physical world calibration</text><path d="M295 535V620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 535V620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="815" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="841" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Mesh-local visual frame is a separate correction</text><text x="44" y="867" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Body pose drives the tracked object; OBJ scale / visual RPY / visual quaternion align only the rendered geometry.</text><text x="44" y="888" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not fix a mesh orientation issue by silently changing all logged position data.</text><path d="M295 720V815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 720V815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>