<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Rotation blending / numerical mean → projection onto SO(3)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Rotation blending / numerical mean → projection onto SO(3)</text><rect x="30" y="90" width="345" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Candidate R₁ = I</text><text x="44" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 1    0    0 ]</text><text x="44" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0    1    0 ]</text><text x="44" y="184" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0    0    1 ]</text><rect x="435" y="90" width="345" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Candidate R₂ = Rz(90°)</text><text x="449" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0   −1    0 ]</text><text x="449" y="163" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 1    0    0 ]</text><text x="449" y="184" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0    0    1 ]</text><text x="840" y="130" fill="#80d0f5" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">w₁ = w₂ = 0.5</text><path d="M200 235V275H295V315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M605 235V275H295V315" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="315" width="530" height="160" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">M = 0.5R₁ + 0.5R₂</text><text x="44" y="367" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0.5  −0.5   0 ]</text><text x="44" y="388" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0.5   0.5   0 ]</text><text x="44" y="409" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0       0      1 ]</text><text x="44" y="430" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MᵀM = diag(0.5, 0.5, 1) ≠ I</text><rect x="620" y="315" width="530" height="160" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="634" y="341" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SVD + determinant correction</text><text x="634" y="367" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">M = UΣVᵀ</text><text x="634" y="388" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R = U diag(1,1,det(UVᵀ)) Vᵀ</text><text x="634" y="409" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If det(UVᵀ) &lt; 0: flip last U column</text><text x="634" y="430" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prevent a reflection, not only axis scaling</text><path d="M560 395H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 475V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="620" y="535" width="530" height="175" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="634" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Projected R = Rz(45°)</text><text x="634" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ √2/2  −√2/2   0 ]</text><text x="634" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ √2/2   √2/2   0 ]</text><text x="634" y="629" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[ 0          0        1 ]</text><text x="634" y="650" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RᵀR = I; det(R) = 1</text><rect x="30" y="535" width="530" height="175" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Why flattening is not enough</text><text x="44" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Nine numbers encode constrained axes.</text><text x="44" y="608" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Averaging valid matrices may shrink axes.</text><text x="44" y="629" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Projection restores a proper rotation;</text><text x="44" y="650" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">it does not validate arbitrary output schemas.</text><text x="35" y="785" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Each 9-value orientation block is handled separately, after the ACT executor decodes the 6D head.</text><text x="35" y="820" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Illustrative equal-weight example, not a measured robot rotation or a claim of geodesic interpolation.</text></svg>