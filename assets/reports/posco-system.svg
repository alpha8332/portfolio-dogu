if">Robot snapshots</text><text x="564" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured q / p</text><text x="564" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">state / EE feedback</text><rect x="345" y="405" width="390" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="359" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Episode capture + inspection</text><text x="359" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Images + proprio + control + timestamps</text><text x="359" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw HDF5 / associated video</text><rect x="345" y="545" width="390" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="359" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay manager</text><text x="359" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare → align → recorded-time playback</text><path d="M435 190V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M645 190V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M435 345V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M645 345V405" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M540 505V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M275 160H310V150H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M275 295H310V150H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M275 430H310V150H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M275 565H310V150H345" fill="none" stroke="#80d0f5" stroke-widt