<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">False pass / existence, completeness and episode identity</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">False pass / existence, completeness and episode identity</text><rect x="30" y="75" width="545" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FAILURE: declared device is not recorded telemetry</text><rect x="50" y="125" width="505" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture plan: two Tesollo rows</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Expected TT; this is intent, not evidence of storage</text><rect x="50" y="250" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw: no hand runtime IDs</text><text x="64" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">all(required keys for IDs) on an empty list can look True</text><path d="M302 200V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="315" y="229" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">wrong inference: plan ⇒ pass</text><rect x="605" y="75" width="545" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="617" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CORRECTION: require actual runtime IDs AND keys</text><rect x="625" y="125" width="505" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Count actual IDs in raw HDF5</text><text x="639" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TT expects two; zero IDs is explicitly a failure</text><rect x="625" y="250" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Check each actual hand keyset</text><text x="639" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Expected / found / missing shown together</text><path d="M877 200V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="890" y="229" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">existence before completeness</text><rect x="30" y="430" width="1120" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="455" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SAME TASK DOES NOT MEAN SAME EPISODE</text><rect x="50" y="485" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="511" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Episode 0000 / GG</text><text x="64" y="537" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Binary gripper keys</text><text x="64" y="558" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No Tesollo telemetry</text><rect x="435" y="485" width="310" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="449" y="511" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Episode 0001 / TT selected</text><text x="449" y="537" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Two hand runtimes</text><text x="449" y="558" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No legacy binary aliases</text><rect x="820" y="485" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="511" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training schema inspector</text><text x="834" y="537" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Use selected 0001 path</text><text x="834" y="558" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not pick first file in task</text><path d="M745 535H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="754" y="522" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit path</text><rect x="435" y="675" width="695" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="701" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">TT result / binary aliases must be absent</text><text x="449" y="727" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw schema and converted-schema inspection share the selected source</text><path d="M975 585V675" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="852" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Illustrative episodes, not a published company dataset or a newly executed test result.</text></svg>