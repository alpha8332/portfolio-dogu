<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1140" width="1180" height="1140" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Deploy / compatibility, command arbitration and fail-fast execution</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Deploy / compatibility, command arbitration and fail-fast execution</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint requirements ↔ current runtime</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected input/output owners + profile + joint count; live telemetry must actually supply required observations</text><rect x="30" y="245" width="1120" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Per-step preflight for all selected hand targets</text><text x="44" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve robot / segment / exact attached hand; validate contract and command before sending the step</text><path d="M590 160V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="435" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">grasp_state = HOLD / no primitive</text><text x="44" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If joint target exists: validate / clamp target</text><text x="44" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Respect configured motion time</text><text x="44" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">joint_move_to</text><rect x="620" y="435" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">grasp_state = RELEASE or GRASP</text><text x="634" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Suppress competing joint target</text><text x="634" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Supported explicit mode / optional force</text><text x="634" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical mode → profile vendor mode</text><path d="M295 335V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="310" y="390" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">joint branch</text><path d="M885 335V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="900" y="390" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">primitive branch</text><rect x="620" y="650" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Ordered primitive commands</text><text x="634" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">set_grasp_mode (if specified)</text><text x="634" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ set_grasp_force (if supplied) → grasp / release</text><path d="M885 550V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="650" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Repeated / unchanged values</text><text x="44" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Deduplicate unchanged grasp commands</text><text x="44" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Joint near-current guard avoids redundant targets</text><text x="44" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Command status and physical feedback stay distinct</text><path d="M295 550V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="900" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="926" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Success</text><text x="44" y="952" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Update previous-command context</text><text x="44" y="973" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Continue with new live observation</text><text x="44" y="994" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical telemetry is a separate feedback stream</text><rect x="620" y="900" width="530" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="926" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Failure</text><text x="634" y="952" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preflight failure → do not dispatch step</text><text x="634" y="973" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Send failure → stop later commands / runtime</text><text x="634" y="994" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Record target, reason and applied commands</text><rect x="30" y="790" width="1120" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="816" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dispatch result</text><text x="44" y="842" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Both command branches can succeed or fail; inspect backend results before continuing</text><path d="M295 750V790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 750V790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 855V875H295V900" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="310" y="891" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">success</text><path d="M590 875H885V900" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="900" y="891" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">failure</text><text x="30" y="1090" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preflight is not atomic multi-device execution. A later hardware failure cannot undo commands already sent.</text></svg>