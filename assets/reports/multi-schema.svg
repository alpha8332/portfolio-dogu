<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 810" width="1180" height="810" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Schema migration / add robot-keyed ownership without rewriting legacy meaning</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Schema migration / add robot-keyed ownership without rewriting legacy meaning</text><rect x="30" y="80" width="500" height="550" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EXISTING SINGLE / DUAL-ARM CONTRACT</text><rect x="50" y="130" width="460" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw v4 / legacy side-qualified streams</text><text x="64" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">proprio.q</text><text x="64" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">control.left/right.teleop_command</text><text x="64" y="224" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand.tesollo.&lt;runtime&gt;.feedback.*</text><rect x="50" y="295" width="460" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="321" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical keys</text><text x="64" y="347" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">observation.qpos / qvel</text><text x="64" y="368" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action.left/right.*</text><text x="64" y="389" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action.hand.left/right.*</text><path d="M280 235V295" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="465" width="460" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Legacy interpretation remains valid</text><text x="64" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">one robot with its own segment layout</text><text x="64" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserved dataset/checkpoint compatibility</text><text x="64" y="559" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no invented physical left/right for new robots</text><path d="M280 400V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="580" y="80" width="570" height="550" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="592" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">NEW MULTI SINGLE-ARM CONTRACT</text><rect x="600" y="130" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw v5 / one owner namespace per robot</text><text x="614" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.&lt;key&gt;.proprio.q</text><text x="614" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.&lt;key&gt;.control.arm.teleop_command</text><text x="614" y="224" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot.&lt;key&gt;.hand.feedback/command.*</text><rect x="600" y="295" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="321" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Canonical keys</text><text x="614" y="347" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">observation.robot.&lt;key&gt;.*</text><text x="614" y="368" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">action.robot.&lt;key&gt;.*</text><text x="614" y="389" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_key_order + labels from backend</text><path d="M865 235V295" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="600" y="465" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Bundle / current deployment comparison</text><text x="614" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot keys + robot model + joint width</text><text x="614" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">EE type / hand profile / joint count</text><text x="614" y="559" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reject mismatched ownership before dispatch</text><path d="M865 400V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="700" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Order is a serialization contract; identity is an ownership contract. Neither replaces the other.</text><text x="30" y="750" fill="#eab67e" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Common sample index gives application-level coordination, not simultaneous controller arrival or hardware clock synchronization.</text></svg>