<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1010" width="1180" height="1010" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Documentation migration / preserve material, clarify its role</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Documentation migration / preserve material, clarify its role</text><rect x="30" y="85" width="450" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI developer guides</text><rect x="600" y="85" width="550" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">developer_manual</text><text x="614" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">feature → code / contract / test</text><path d="M480 125H600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="488" y="109" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">move / reclassify</text><rect x="30" y="193" width="450" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="219" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">API / schema / device facts</text><rect x="600" y="193" width="550" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="219" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">reference</text><text x="614" y="245" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current definitions, not historical guesses</text><path d="M480 233H600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="488" y="217" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">move / reclassify</text><rect x="30" y="301" width="450" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="327" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Feature guides + setup notes</text><rect x="600" y="301" width="550" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="327" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">features + runbooks</text><text x="614" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">behavior vs repeatable procedure</text><path d="M480 341H600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="488" y="325" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">move / reclassify</text><rect x="30" y="409" width="450" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="435" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Internal development / refactor notes</text><rect x="600" y="409" width="550" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="435" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">development_notes + refactors</text><text x="614" y="461" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">rationale and rollout boundaries</text><path d="M480 449H600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="488" y="433" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">move / reclassify</text><rect x="30" y="517" width="450" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="543" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Changelog + handoff records</text><rect x="600" y="517" width="550" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="543" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">history</text><text x="614" y="569" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">chronological change context</text><path d="M480 557H600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="488" y="541" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">move / reclassify</text><rect x="30" y="625" width="450" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Old guides / research / needs review</text><rect x="600" y="625" width="550" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="614" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">archive</text><text x="614" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve without becoming current authority</text><path d="M480 665H600" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="488" y="649" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">move / reclassify</text><rect x="30" y="765" width="1120" height="160" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="790" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROLLOUT / mechanical moves and substantive writing are distinct</text><text x="50" y="815" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">Stabilize manual → move reference → move feature/runbook → preserve history/archive</text><text x="50" y="855" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Then: onboarding skeleton → substantive content → reading-path / link / environment-assumption review</text><text x="50" y="895" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Fix outgoing and incoming links. Preserve intentional old paths in migration maps and history.</text><text x="35" y="975" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">A path exists ≠ a document is complete ≠ the explanation matches the current implementation.</text></svg>