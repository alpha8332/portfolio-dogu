<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1280" width="1180" height="1280" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Tesollo learning / capture, learning and live execution boundaries</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Tesollo learning / capture, learning and live execution boundaries</text><rect x="25" y="70" width="1130" height="240" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PHYSICAL SYSTEM + DEVICE RUNTIME</text><rect x="45" y="115" width="315" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator input / controls</text><text x="59" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Glove or manual controls</text><text x="59" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Retarget / grasp intent</text><rect x="430" y="115" width="315" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot hand runtime</text><text x="444" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Owner + profile + command state</text><text x="444" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Joint / mode / force dispatch</text><rect x="815" y="115" width="315" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">DG-4F hands on robot</text><text x="829" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Joint feedback + validity + time</text><text x="829" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm state is a separate stream</text><path d="M360 160H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="367" y="144" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">targets</text><path d="M745 160H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 205V260H590V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="650" y="249" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">telemetry / command state</text><rect x="25" y="355" width="545" height="470" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="380" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CAPTURE → CANONICAL DATA</text><rect x="45" y="400" width="505" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture worker / recording clock</text><text x="59" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Sample feedback and command streams</text><text x="59" y="473" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Persist owner attachment metadata / timestamp / valid</text><rect x="45" y="550" width="505" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw episode / HDF5 + camera sidecars</text><text x="59" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">runtime-qualified hand keys / arm control keys</text><text x="59" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB references where selected; no camera required for hand-only</text><rect x="45" y="705" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="731" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Conversion + mapping selection</text><text x="59" y="757" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve owner / profile / count; select observation + action</text><text x="59" y="778" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Command preferred; explicit legacy feedback fallback</text><path d="M590 260V330H295V400" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 495V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 645V705" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="610" y="355" width="545" height="470" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="380" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING + PORTABLE ARTIFACT</text><rect x="630" y="400" width="505" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dataset + ordered action layout</text><text x="644" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">State / RGB → observation; target chunks → supervision</text><text x="644" y="473" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stats + selected IO keys + hand contract</text><rect x="630" y="550" width="505" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="576" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT / representation boundary</text><text x="644" y="602" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CVAE during training; task pose 6D head if selected</text><text x="644" y="623" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Restore rotation matrices and preserve non-pose tail</text><rect x="630" y="705" width="505" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="731" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint bundle</text><text x="644" y="757" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Weights + normalizers + ordered keys</text><text x="644" y="778" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_hand_contract / robot-keyed EE contract</text><path d="M550 750H590V448H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="565" y="688" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">selected tensors</text><path d="M880 495V550" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 645V705" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="875" width="1130" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="900" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LIVE INFERENCE / not recorded-data replay</text><rect x="45" y="925" width="315" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="951" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live observations</text><text x="59" y="977" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend hand telemetry</text><text x="59" y="998" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">+ arm / image inputs as required</text><text x="59" y="1019" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Previous executed hand command</text><rect x="430" y="925" width="315" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="951" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Model runtime</text><text x="444" y="977" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Required keys / expected shapes</text><text x="444" y="998" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy → restored action chunk</text><text x="444" y="1019" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Split by ordered canonical keys</text><rect x="815" y="925" width="315" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="951" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command + preflight</text><text x="829" y="977" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Exact owner / profile / joint count</text><text x="829" y="998" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Primitive or joint arbitration</text><text x="829" y="1019" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">All selected hand targets checked</text><path d="M880 795V850H590V925" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="610" y="846" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">load + compatibility</text><path d="M360 980H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M745 980H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="1100" width="1085" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="1126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dispatch + next-step feedback</text><text x="59" y="1152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Validated commands → backend hand runtime → physical hand; executed command context and new telemetry feed the next step</text><path d="M970 1040V1100" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M200 1100V1040" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="235" y="1080" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">context</text><path d="M1130 1140H1168V225H590V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="30" y="1250" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Architecture is reconstructed from module responsibilities. It is not a diagram of separate threads or a measured latency path.</text></svg>