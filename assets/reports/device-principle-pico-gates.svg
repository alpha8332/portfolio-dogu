<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1120" width="1180" height="1120" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Pico / profile strategy, value normalization and gate fallback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Pico / profile strategy, value normalization and gate fallback</text><rect x="35" y="75" width="1110" height="160" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A / SESSION BINDING STRATEGY</text><rect x="55" y="125" width="250" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">analog + click</text><path d="M305 157H327" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="330" y="125" width="250" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="344" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">analog only</text><path d="M580 157H602" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="605" y="125" width="250" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">digital click</text><path d="M855 157H877" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="880" y="125" width="250" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="894" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger only</text><rect x="35" y="285" width="1110" height="185" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="310" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">B / SAMPLE INPUT NORMALIZATION</text><rect x="55" y="335" width="480" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Numeric value + boolean click</text><text x="69" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">value ≤ 0 and click=true → value := 1</text><text x="69" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">a digital press is not analog pressure</text><rect x="655" y="335" width="470" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Action activity kept separately</text><text x="669" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">value 0 with an active action can be release</text><text x="669" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">inactive action can mean unsupported input</text><path d="M535 383H655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="520" width="1110" height="430" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="545" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">C / PICO HOLD GATE WITH POSE FALLBACK ENABLED</text><rect x="55" y="575" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Configured axis active?</text><text x="69" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">yes → compare normalized value</text><text x="69" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">with threshold</text><rect x="425" y="575" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Matching click active?</text><text x="439" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">axis inactive, click active</text><text x="439" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ use normalized click value</text><rect x="795" y="575" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Neither usable</text><text x="809" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">allow pose gate fallback</text><text x="809" y="648" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">for Pico hold mode only</text><path d="M385 625H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="395" y="606" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">no</text><path d="M755 625H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="765" y="606" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">no</text><path d="M220 675V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 675V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M960 675V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="55" y="735" width="1070" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Outer conditions remain: connected / focused / valid hand + profile / robot Task TeleMove</text><text x="69" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose fallback bypasses the missing hold input, not the entire motion state contract</text><rect x="55" y="865" width="1070" height="60" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="891" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Gripper trigger / button actions require their OWN usable inputs</text><text x="35" y="1015" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Test cases: active zero + click=false → release; click-only press → 1; no actions → pose-only fallback.</text><text x="35" y="1070" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">The decision graph explains implementation conditions; it is not a measurement of controller performance.</text></svg>