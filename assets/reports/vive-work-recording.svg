<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Persistence / common device payload is not the same as every plotted channel</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Persistence / common device payload is not the same as every plotted channel</text><rect x="30" y="75" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device update + per-device translation origin</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Identity / validity / timestamp / relative position / quaternion / optional provided velocity / optional controller input</text><path d="M295 170V265" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 170V265" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="265" width="530" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="290" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LOGGER / before plot processing</text><rect x="50" y="320" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="346" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">CSV / fixed header</text><text x="64" y="372" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">t_abs + first-row-relative t_rel</text><text x="64" y="393" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Device metadata / valid / position / xyzw</text><text x="64" y="414" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Provided velocity / flattened analog + pressed bits</text><rect x="50" y="465" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">JSONL / device dict</text><text x="64" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Nested input, including touched map when present</text><text x="64" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No automatic addition of all derived plot values</text><rect x="620" y="265" width="530" height="335" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="290" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PLOT / presentation and derived values</text><rect x="640" y="320" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="346" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Transforms for inspection</text><text x="654" y="372" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">mm-based display / position EMA / RPY</text><text x="654" y="393" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Velocity fallback / acceleration / STOP-MOVE</text><text x="654" y="414" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Draw throttling and rolling time window</text><rect x="640" y="465" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">No reverse write into CSV</text><text x="654" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Tracker plot velocity is not a CSV velocity source</text><text x="654" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RPY and acceleration are not CSV columns</text><rect x="30" y="715" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="741" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session file and interpretation</text><text x="44" y="767" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Filename carries session + start timestamp. Rows carry device identity and time; missing fields are not real zero signals.</text><text x="44" y="788" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The first CSV row defines t_rel=0; it is not guaranteed to be process launch or each device’s first valid sample.</text><path d="M295 600V715" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 600V715" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>