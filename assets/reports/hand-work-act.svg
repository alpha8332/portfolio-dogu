<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">ACT integration / original chunk learning and project-specific action layout</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT integration / original chunk learning and project-specific action layout</text><rect x="30" y="75" width="530" height="325" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING ONLY / CVAE STYLE ENCODER</text><rect x="50" y="125" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">State + demonstrated target chunk</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Target rotation matrices → internal 6D columns</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve hand / gripper / auxiliary tail</text><rect x="50" y="270" width="490" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Latent posterior</text><text x="64" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Transformer encoder → μ, log σ² → sample z</text><text x="64" y="343" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">KL regularization against prior</text><path d="M295 210V270" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="620" y="75" width="530" height="325" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TRAINING AND INFERENCE / OBSERVATION</text><rect x="640" y="125" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected observation inputs</text><text x="654" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand position / velocity / previous command</text><text x="654" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm state and RGB only when selected</text><rect x="640" y="270" width="490" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input embedding</text><text x="654" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">State projection / image features when used</text><text x="654" y="343" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Ordered keys and normalizers retained</text><path d="M885 210V270" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="490" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT policy encoder + transformer decoder</text><text x="44" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation features + latent → H-step internal action chunk. At inference use prior mean z=0; no demonstration chunk is provided.</text><path d="M295 365V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="310" y="445" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">training z</text><path d="M885 365V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="900" y="445" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">observation</text><rect x="30" y="685" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="711" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Task pose restoration</text><text x="44" y="737" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Position prefix + orthogonalized 6D rotations</text><text x="44" y="758" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">→ position + flattened 3×3 matrices</text><text x="44" y="779" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Append untouched non-pose channels</text><rect x="620" y="685" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="711" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training objective</text><text x="634" y="737" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Restored chunk ↔ target chunk</text><text x="634" y="758" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">L1 reconstruction + β KL when VAE enabled</text><text x="634" y="779" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same semantic layout before comparison</text><path d="M295 585V685" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 740H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="900" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="926" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inference path</text><text x="44" y="952" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Restored chunk → action selection / unnormalization → canonical key split → hand command builder → backend dispatch</text><path d="M295 795V900" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>