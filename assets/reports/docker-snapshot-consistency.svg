<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Snapshot publication / reject a payload that changed during the read</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Snapshot publication / reject a payload that changed during the read</text><text x="65" y="92" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">HOST WRITER</text><text x="455" y="92" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">MAPPED FILE</text><text x="850" y="92" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">CONTAINER READER</text><rect x="30" y="130" width="300" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Completed snapshot</text><text x="44" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">seq = 10 (even)</text><rect x="420" y="130" width="310" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Header + JSON payload</text><text x="434" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reader observes seq₁ = 10</text><rect x="820" y="130" width="330" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read header, copy payload</text><text x="834" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not decode before final check</text><path d="M330 165H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 165H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="270" width="300" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Begin update</text><text x="44" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Write seq = 11 (odd)</text><rect x="420" y="270" width="310" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Payload update in progress</text><text x="434" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Position / input / status may differ</text><path d="M330 305H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M180 200V270" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="410" width="300" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Commit update</text><text x="44" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Write seq = 12 (even)</text><rect x="420" y="410" width="310" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Completed new payload</text><text x="434" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same header format, next sequence</text><rect x="820" y="410" width="330" height="70" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="834" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read header again</text><text x="834" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">seq₂ = 12 ≠ seq₁ → reject / retry</text><path d="M180 340V410" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M330 445H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 445H820" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M985 200V410" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="997" y="330" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">read spans update</text><rect x="30" y="565" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Accept only a completed, stable read — then validate freshness and runtime status</text><text x="44" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">seq₁ = seq₂ and even; correct magic/version; payload fits mapped file; JSON root is an object.</text><text x="44" y="638" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Freshness is a separate timestamp check. A stable read can still contain old data from a stopped collector.</text><text x="44" y="659" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This illustrates application-level consistency checks, not a measured timing chart or a hard real-time guarantee.</text></svg>