<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 960" width="1180" height="960" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Media lineage / staged paths are not the original capture location</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Media lineage / staged paths are not the original capture location</text><rect x="30" y="80" width="540" height="320" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SOURCE TASK / conceptual paths</text><rect x="50" y="140" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">episode.h5</text><text x="64" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">metadata.video_files[front] = front.mp4</text><text x="64" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">state + timing + command arrays</text><rect x="50" y="285" width="500" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">front.mp4</text><text x="64" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB sidecar captured with the episode</text><path d="M300 235V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="310" y="267" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">relative source media</text><rect x="610" y="80" width="540" height="320" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">STAGED SELECTION / filename may change</text><rect x="630" y="140" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">00_episode.h5</text><text x="644" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same origin, different path / basename</text><text x="644" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">looking beside this file alone can miss media</text><rect x="630" y="285" width="500" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">selection manifest</text><text x="644" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source H5 ↔ destination H5 correspondence</text><path d="M550 185H630" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="565" y="165" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">stage</text><path d="M880 235V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="465" width="1120" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="490" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RESOLUTION AND VALIDATION</text><rect x="50" y="525" width="320" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="551" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve candidates</text><text x="64" y="577" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">absolute video path if present</text><text x="64" y="598" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">staged H5 parent + video path</text><text x="64" y="619" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">source H5 parent from manifest</text><rect x="430" y="525" width="320" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="551" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Materialize linked sidecar</text><text x="444" y="577" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve original video_files</text><text x="444" y="598" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">link media alongside selection</text><text x="444" y="619" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preserve source correspondence</text><rect x="810" y="525" width="320" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="551" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Then verify the media</text><text x="824" y="577" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">existence → decode → alignment</text><text x="824" y="598" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">sequential decode fallback differs</text><text x="824" y="619" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">from repairing a missing recording</text><path d="M880 355V435H210V525" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="430" y="425" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">follow provenance</text><path d="M370 600H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 600H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="55" y="760" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A fake-video path fixture checks resolution. It does not establish that all MP4 frames decode.</text><text x="35" y="895" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Directory exists ≠ readable HDF5 ≠ selected schema matches ≠ media is fully aligned.</text></svg>