<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1050" width="1180" height="1050" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Onboarding / mental model → first bounded, verifiable change</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Onboarding / mental model → first bounded, verifiable change</text><rect x="30" y="95" width="208" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="121" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">01 / Product</text><text x="44" y="147" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">purpose + workflow</text><path d="M238 145H258" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="258" y="95" width="208" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="272" y="121" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">02 / System flow</text><text x="272" y="147" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">runtime + artifacts</text><path d="M466 145H486" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="486" y="95" width="208" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="500" y="121" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">03 / Repo map</text><text x="500" y="147" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">task → owner</text><path d="M694 145H714" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="714" y="95" width="208" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="728" y="121" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">04 / Run and test</text><text x="728" y="147" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">environment + checks</text><path d="M922 145H942" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="942" y="95" width="208" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="956" y="121" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">05 / First task</text><text x="956" y="147" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">scope + review</text><rect x="30" y="260" width="1120" height="255" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="285" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DEEPEN ONLY THE RELEVANT BRANCH</text><rect x="50" y="310" width="330" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI / data / model work</text><text x="64" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">workspace manual + reference</text><text x="64" y="383" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual owner code + artifacts</text><text x="64" y="404" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">focused contract tests</text><rect x="420" y="310" width="330" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Device / deployment work</text><text x="434" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">device facts + runbook</text><text x="434" y="383" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">host / container / bridge scopes</text><text x="434" y="404" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual inputs and product version</text><rect x="790" y="310" width="340" height="140" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="336" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Architecture review</text><text x="804" y="362" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current ownership + senior questions</text><text x="804" y="383" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">separate current answers</text><text x="804" y="404" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">from open design follow-ups</text><path d="M590 195V260" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="625" y="236" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">select the task area</text><rect x="30" y="585" width="1120" height="290" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="610" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FIRST CONTRIBUTION / carry the decision to the next person</text><rect x="50" y="640" width="250" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="666" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Bound scope</text><text x="64" y="692" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">what changes?</text><path d="M300 685H328" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="328" y="640" width="250" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="342" y="666" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trace owner</text><text x="342" y="692" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">who decides?</text><path d="M578 685H606" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="606" y="640" width="250" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="620" y="666" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Change + test</text><text x="620" y="692" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">what proves it?</text><path d="M856 685H884" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="884" y="640" width="250" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="898" y="666" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Update docs</text><text x="898" y="692" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">what is now wrong?</text><rect x="330" y="780" width="520" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="344" y="806" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Handoff: conditions / results / limits / rollback</text><path d="M1009 730V815H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M330 815H175V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="55" y="800" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next review / iteration</text><text x="35" y="950" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Detailed commands live in Run And Test; the checklist links there instead of duplicating them.</text><text x="35" y="1000" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reading path adapted from the authored onboarding, repository and learning maps.</text></svg>