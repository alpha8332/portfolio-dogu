<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" width="1180" height="1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Knot manipulation / crossing topology and accessible loop space</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Knot manipulation / crossing topology and accessible loop space</text><rect x="35" y="75" width="1110" height="380" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FIRST CROSSING / A over B → pass under → pull apart</text><text x="65" y="135" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Cross</text><text x="435" y="135" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">2. Pass the free end</text><text x="805" y="135" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">3. Pull both ends</text><path d="M90 200L300 360" fill="none" stroke="#80d0f5" stroke-width="7"/><path d="M300 200L90 360" fill="none" stroke="#eab67e" stroke-width="7"/><path d="M178 267L213 293" stroke="#101619" stroke-width="13"/><path d="M178 267L213 293" fill="none" stroke="#80d0f5" stroke-width="7"/><path d="M475 350C680 380 690 205 495 220L655 355" fill="none" stroke="#80d0f5" stroke-width="7"/><path d="M500 370L660 200" fill="none" stroke="#eab67e" stroke-width="7"/><path d="M535 305Q550 245 600 255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="550" y="320" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">pass</text><path d="M830 275C920 275 920 320 970 300L1100 260" fill="none" stroke="#80d0f5" stroke-width="7"/><path d="M830 310L1100 310" fill="none" stroke="#eab67e" stroke-width="7"/><path d="M860 365H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1060 365H1120" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="65" y="420" fill="#9eb2bf" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">First crossing and a full two-loop bow require different grasp and access sequences.</text><rect x="35" y="510" width="1110" height="370" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="535" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SLIP-LOOP MANIPULATION / preserve room for opening and regrasping</text><path d="M170 815C170 735 80 680 125 620C230 525 330 665 260 735L190 820" fill="none" stroke="#80d0f5" stroke-width="7"/><path d="M225 790L400 610" fill="none" stroke="#eab67e" stroke-width="7"/><text x="70" y="855" fill="#9eb2bf" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hold a droplet-shaped loop.</text><path d="M510 640L555 640L575 670L562 678L542 655L523 655L503 678L490 670Z" fill="#18232a" stroke="#eab67e" stroke-width="2"/><path d="M430 700H505" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="430" y="730" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">enter → open</text><rect x="660" y="585" width="450" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="611" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inside the loop</text><text x="674" y="637" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">open tool → regrasp free end</text><text x="674" y="658" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">loop opening must fit tool geometry</text><rect x="660" y="735" width="450" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="674" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pull outward</text><text x="674" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hold support and keep the free end accessible</text><text x="674" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">remaining length creates manipulation room</text><path d="M885 690V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="945" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">The operation problem is geometric access and topology as well as robot target accuracy.</text><text x="35" y="1000" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Longer free-end length was an improvement idea, not a measured comparison result.</text></svg>