<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" width="1180" height="790" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">External action boundary / a shorter vector can change physical meaning</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">External action boundary / a shorter vector can change physical meaning</text><text x="30" y="92" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Version transition examined during integration</text><rect x="30" y="125" width="525" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Earlier wrapper / 22 values</text><text x="44" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper force 2 + position 2 + left pose 6</text><text x="44" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">+ right pose 6 + torso pose 6</text><rect x="605" y="125" width="545" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="619" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Received newer output / 16 values</text><text x="619" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">force [0:2] + position [2:4]</text><text x="619" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">left delta [4:10] + right delta [10:16]</text><path d="M555 180H605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="285" width="1120" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="310" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ADAPTER CONVERSION / design boundary for rotvec-delta output</text><rect x="50" y="335" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position delta</text><text x="64" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_target = p_current + Δp</text><text x="64" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">convert source units explicitly</text><rect x="390" y="335" width="345" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="404" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rotation-vector delta</text><text x="404" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ΔR = exp([r]×), r in radians</text><text x="404" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_target = ΔR · R_current</text><rect x="780" y="335" width="350" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="794" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Native teleop pose</text><text x="794" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[x,y,z,roll,pitch,yaw]</text><text x="794" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">absolute pose / mm / degrees</text><path d="M350 385H375V470H955V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M735 385H780" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="525" width="1080" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="551" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Manifest + postprocessor + mapping must change together</text><text x="64" y="577" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A stale [16:22] torso slice is invalid; three rotvec values cannot be passed through as three RPY-degree values.</text><text x="30" y="705" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Zero rotation / known-axis rotation / left-right slices / unit scale are independent checks before a real robot run.</text><text x="30" y="743" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This figure explains the reviewed conversion. It is not a claim that every later model version completed robot validation.</text></svg>