<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Release record tool / browser, process state and workbook boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Release record tool / browser, process state and workbook boundary</text><rect x="25" y="65" width="1130" height="175" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BROWSER / HTML + CSS + JavaScript</text><rect x="45" y="110" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">File selection + start metadata</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">loaded / total / current index</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DOMContentLoaded initialization</text><rect x="420" y="110" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Case view + navigation</text><text x="434" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">steps / expected / current result</text><text x="434" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">previous / next / selection restore</text><rect x="795" y="110" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Judgment + reason</text><text x="809" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pass / Fail + inspector + pendant</text><text x="809" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fail requires a non-empty reason</text><rect x="25" y="300" width="1130" height="320" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="325" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SERVER PROCESS / FastAPI</text><rect x="45" y="350" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">File list / load endpoints</text><text x="59" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">find XLSX → copy → open active sheet</text><rect x="420" y="350" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Item query endpoint</text><text x="434" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI index → actual sheet row</text><text x="434" y="423" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">return display + stored metadata</text><rect x="795" y="350" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pass / Fail endpoints</text><text x="809" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">validate load + index / pass payload</text><text x="809" y="423" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">forward all fields to common writer</text><path d="M210 210V350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="225" y="284" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">load</text><path d="M590 210V350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="605" y="284" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">query</text><path d="M960 210V350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="975" y="284" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">judgment</text><rect x="45" y="500" width="710" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="526" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Process-global ReleaseState</text><text x="59" y="552" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">workbook / active sheet / output path / header map</text><text x="59" y="573" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">data_rows / display-forward-filled categories</text><rect x="795" y="500" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="526" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Workbook lock</text><text x="809" y="552" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">serialize load / result writing</text><text x="809" y="573" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not an independent user session</text><path d="M210 440V500" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 440V500" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M960 440V500" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="680" width="1130" height="175" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="705" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FILESYSTEM / openpyxl reads and saves a separate output workbook</text><rect x="45" y="730" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Input XLSX</text><text x="59" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">format / merged cells / case content</text><rect x="420" y="730" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Timestamped result copy</text><text x="434" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">one current result per sheet row</text><text x="434" y="803" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fixed result / time columns in writer</text><rect x="795" y="730" width="335" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Export API</text><text x="809" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">save + return workbook file</text><text x="809" y="803" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">retained HTML has no export button</text><path d="M210 590V650H15V715H210V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="45" y="644" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">load input</text><path d="M960 590V650H590V730" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="685" y="644" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">locked write / save</text><path d="M380 775H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="385" y="760" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">copy</text><path d="M755 775H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="910" width="1085" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="936" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate responsibility: human-operated physical product testing</text><text x="59" y="962" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Conty / controller / pendant / NURI + peripherals → operator observation → browser judgment</text><text x="59" y="983" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No hardware SDK or robot-control command path is provided by this record application.</text></svg>