<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Session replay / parallel alignment, one barrier, one timeline</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Session replay / parallel alignment, one barrier, one timeline</text><rect x="30" y="80" width="1120" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepared participants</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">preflight each owner → prepare Idle → create per-robot alignment workers</text><path d="M590 155V195H300V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 195H880V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="250" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot A alignment</text><text x="44" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">issue start q → maintain target → poll state</text><text x="44" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reach and settle independently</text><text x="44" y="344" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">report alignment_index or failure</text><rect x="620" y="250" width="530" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot B alignment</text><text x="634" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">issue start q → maintain target → poll state</text><text x="634" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reach and settle independently</text><text x="634" y="344" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">report alignment_index or failure</text><path d="M300 370V430H590V465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 370V430H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="300" y="465" width="580" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="314" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">All-participant barrier</text><text x="314" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">all successful → enable replay modes and start clock</text><path d="M590 550V595" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="595" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="621" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Shared source index i</text><text x="44" y="647" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">iterate participants → A arm + owned EE / B arm + owned EE → publish current_index and robot_results</text><rect x="30" y="730" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Failure fan-out</text><text x="44" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">alignment error / dispatch failure / user stop → abort session → stop all workers → 