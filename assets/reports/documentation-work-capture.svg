<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1180" width="1180" height="1180" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">CapturePlan / connect a screen to contracts, storage and tests</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">CapturePlan / connect a screen to contracts, storage and tests</text><rect x="30" y="75" width="330" height="940" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI / developer manual entry</text><rect x="50" y="125" width="290" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Select a task</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">show saved or draft plan</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">render backend result</text><rect x="50" y="355" width="290" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="381" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Review the plan</text><text x="64" y="407" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required / optional / unavailable</text><text x="64" y="428" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">canonical camera order</text><text x="64" y="449" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ready / warn / blocked</text><text x="64" y="470" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">edit optional inclusion only</text><rect x="50" y="705" width="290" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="731" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Save / Save As</text><text x="64" y="757" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">submit intent</text><text x="64" y="778" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reload returned plan</text><text x="64" y="799" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">do not invent required schema</text><rect x="400" y="75" width="750" height="940" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="412" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BACKEND / contract, policy and artifact owners</text><rect x="425" y="125" width="315" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing saved plan</text><text x="439" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">read task-bound artifact</text><rect x="790" y="125" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">No saved plan → draft</text><text x="804" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">derive from current configuration</text><path d="M340 175H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="350" y="158" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">query</text><path d="M740 175H790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="742" y="157" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">not found</text><path d="M582 225V265H775V305" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M955 225V265H775" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="425" y="305" width="700" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="331" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve / validate the current plan</text><text x="439" y="357" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required streams + camera order + availability + blockers / warnings</text><text x="439" y="378" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">saved vs draft describes persistence, not readiness</text><path d="M425 360H340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="351" y="345" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">render</text><path d="M340 765H385V480H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="425" y="460" width="700" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Normalize with current session and stream catalog</text><text x="439" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">restore required streams even if the client omits them</text><text x="439" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">check existing episodes and schema-affecting changes</text><rect x="425" y="605" width="315" height="130" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="439" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Allowed change</text><text x="439" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">persist task plan</text><text x="439" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">return authoritative result</text><text x="439" y="699" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI refreshes from backend</text><rect x="790" y="605" width="335" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Schema locked</text><text x="804" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reject overwrite</text><text x="804" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">operator may branch a new task</text><text x="804" y="699" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">existing episodes stay consistent</text><path d="M775 560V580H582V605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M775 580H955V605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M582 735V785" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="425" y="785" width="700" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="811" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start is a separate transition</text><text x="439" y="837" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">task-bound plan → session preflight → capture lifecycle</text><text x="439" y="858" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">stop / save → episode remains bound to the original task</text><text x="439" y="879" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Persisted plan is not proof that live inputs are ready.</text><rect x="30" y="1055" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="1081" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Verification links in the manual</text><text x="44" y="1107" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">save/reload | missing required row restored | locked schema rejected | Save As creates a separate task</text><path d="M775 930V1055" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="790" y="995" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">contract-level regression examples</text></svg>