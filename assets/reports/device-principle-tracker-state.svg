<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Vive Tracker / explicit use permission and reference epochs</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive Tracker / explicit use permission and reference epochs</text><rect x="35" y="75" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose-only source</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose + timestamp / has_buttons = false</text><rect x="655" y="75" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Application binding</text><text x="669" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">teleop_active + teleop_epoch</text><path d="M525 120H655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="245" width="490" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Inactive</text><text x="49" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no pose motion target</text><text x="49" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">active → inactive: current-pose one-shot</text><rect x="655" y="245" width="490" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Active: epoch changed?</text><text x="669" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">yes → capture current robot + device reference</text><text x="669" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no → inspect existing reference</text><path d="M900 165V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="916" y="211" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">true</text><path d="M655 200H280V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="360" y="190" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">false</text><rect x="35" y="455" width="490" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">No reference yet</text><text x="49" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">store first valid tracker sample</text><text x="49" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">wait for next sample before relative motion</text><rect x="655" y="455" width="490" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="481" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Paired reference available</text><text x="669" y="507" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current − reference position</text><text x="669" y="528" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">referenceᵀ × current rotation</text><path d="M655 315H570V400H280V455" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="330" y="392" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">reference missing</text><path d="M900 350V455" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="675" y="413" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">reference exists / newly paired</text><path d="M525 515H655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="535" y="499" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next valid sample</text><rect x="655" y="670" width="490" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="696" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Calibrated relative pose → absolute target</text><text x="669" y="722" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position [mm] + RPY [degree]</text><text x="669" y="743" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task TeleMove / arm binding</text><path d="M900 570V670" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1145 720H1165V205H900V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1000" y="192" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">new epoch</text><text x="35" y="850" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">teleop_active authorizes use. A changed epoch explicitly asks for a NEW paired start pose.</text><text x="35" y="912" fill="#eab67e" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">A tracked sensor being attached or visible does not itself authorize arm motion.</text></svg>