<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 870" width="1180" height="870" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Vision / physical observation and shared transport topology</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Vision / physical observation and shared transport topology</text><rect x="30" y="75" width="490" height="315" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PHYSICAL OBSERVATION</text><rect x="50" y="125" width="210" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Left end tool + D405</text><text x="64" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Near view of grasp / material</text><text x="64" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera frame before gripper</text><rect x="290" y="125" width="210" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="304" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Right end tool + D405</text><text x="304" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Near view of grasp / material</text><text x="304" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Moving cable route</text><rect x="110" y="270" width="330" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="124" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Frame-mounted D435IF cameras</text><text x="124" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe workspace and bilateral interaction</text><rect x="560" y="75" width="590" height="315" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="572" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HOST TRANSPORT / logical model</text><rect x="580" y="125" width="260" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="594" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Motherboard / top ports</text><text x="594" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A connector is not proof of</text><text x="594" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">an independent controller</text><rect x="860" y="125" width="270" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="874" y="151" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">PCIe USB expansion board</text><text x="874" y="177" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Board ports still share resources</text><text x="874" y="198" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Port grouping tested empirically</text><rect x="580" y="270" width="550" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="594" y="296" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">AI PC → librealsense → Viewer / MiMicX</text><text x="594" y="322" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read negotiated link and test simultaneous streams in the actual client</text><path d="M710 210V270" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M995 210V270" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M500 170H540V240H710V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="560" y="232" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">USB / cable</text><path d="M440 310H540V250H995V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="30" y="445" width="1120" height="235" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="470" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">WHY ADDING CONNECTORS DOES NOT CREATE THE SAME STREAM CAPACITY</text><rect x="50" y="495" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera A</text><path d="M122 560V610H600V540H610" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="220" y="495" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="234" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera B</text><path d="M292 560V610H600V540H610" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="390" y="495" width="145" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="404" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera C</text><path d="M462 560V610H600V540H610" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="610" y="495" width="215" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="624" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">USB hub</text><text x="624" y="547" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Ports share an upstream link</text><rect x="900" y="495" width="230" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="914" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Host controller</text><text x="914" y="547" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Bus + software processing</text><text x="914" y="568" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No independent link assumed</text><path d="M825 540H900" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="825" y="485" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">shared upstream</text><text x="50" y="640" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A powered hub supplies power; it does not give every downstream camera a separate upstream bandwidth budget.</text><rect x="30" y="725" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="751" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Record topology, not just total camera count</text><text x="44" y="777" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera model → cable → physical port / hub / PCIe branch → negotiated link → RGB / Depth profile → actual image output</text></svg>