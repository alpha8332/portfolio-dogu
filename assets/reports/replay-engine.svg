<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 910" width="1180" height="910" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Robot Replay / source interpretation, alignment and execution are distinct</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot Replay / source interpretation, alignment and execution are distinct</text><rect x="30" y="75" width="1120" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI intent only</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">selected episode / start / pause / resume / stop; chart playback never emits robot commands</text><path d="M590 145V190" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="260" y="190" width="660" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="274" y="216" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend manager + source/session plan</text><text x="274" y="242" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw episode → owners / modes / initial targets / source timestamps</text><path d="M590 275V320" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="260" y="320" width="660" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="274" y="346" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preflight / prepare</text><text x="274" y="372" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">identity + model + joint/EE contract → drain → Idle / settle</text><path d="M590 405V430H265V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="450" width="470" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Safe Logic / initial alignment</text><text x="44" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">recorded q preferred; task pose fallback</text><text x="44" y="523" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">maintain start target + readback + settle</text><text x="44" y="544" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">recorded timeline remains stopped</text><rect x="650" y="450" width="500" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay scheduler / after alignment barrier</text><text x="664" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">one source index + elapsed-time schedule</text><text x="664" y="523" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">paused duration excluded from replay clock</text><path d="M500 508H650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="505" y="490" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">reached + settled</text><path d="M900 565V620H230V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M900 620H620V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M900 620H1000V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="660" width="370" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm mode</text><text x="44" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">task teleop target OR joint frames</text><text x="44" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">worker-serialized controller access</text><rect x="450" y="660" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="464" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Owned end effectors</text><text x="464" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper target / force</text><text x="464" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hand joints + grasp primitives</text><rect x="820" y="660" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Status / shared cursor</text><text x="834" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current_index → chart/table/media</text><text x="834" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UI interpolation is display-only</text><text x="30" y="835" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Any alignment/dispatch failure → stop the session → attempt Idle cleanup → retain failure and cleanup diagnostics.</text></svg>