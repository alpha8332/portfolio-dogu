<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">XR application / robot mode and recording are independent states</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">XR application / robot mode and recording are independent states</text><rect x="30" y="75" width="1120" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT MODE / actual operation state matters</text><rect x="65" y="145" width="400" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="79" y="171" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Idle / no pose motion</text><text x="79" y="197" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Button-only polling remains active</text><text x="79" y="218" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONNECTED + FOCUSED + hand + profile</text><rect x="715" y="145" width="400" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="729" y="171" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Task Teleoperation</text><text x="729" y="197" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose / stick motion path allowed</text><text x="729" y="218" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input validity and bindings still checked</text><path d="M465 170H715" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="470" y="150" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">TaskTeleop action → backend transition</text><path d="M715 225H465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="270" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Idle action → explicit stop_teleop</text><text x="65" y="330" fill="#eab67e" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Stored mode = Idle does not override live op_state = 17.</text><rect x="30" y="430" width="1120" height="350" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="455" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RECORDING / current Collect task and collection-session participants</text><rect x="65" y="495" width="400" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="79" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Not recording</text><text x="79" y="547" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Collect start → existing preflight</text><text x="79" y="568" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve current robot mode</text><rect x="715" y="495" width="400" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="729" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recording</text><text x="729" y="547" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Collect stop → stop recording</text><text x="729" y="568" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Then force session robots to Idle</text><path d="M465 525H715" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="525" y="510" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">collect_start</text><path d="M715 575H465" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="505" y="625" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">collect_stop + safety path</text><text x="65" y="705" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A/B/X/Y → rising edge → configured action. Default None avoids an unintended start.</text><path d="M1115 545H1165V285H265V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="985" y="408" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">stop safety → Idle</text><text x="30" y="845" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reading a button in Idle does not grant motion permission. Recording start does not implicitly enter TeleT.</text></svg>