<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 940" width="1180" height="940" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Unexpected result / separate the next action before reporting a failure</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Unexpected result / separate the next action before reporting a failure</text><rect x="270" y="75" width="640" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Expected result differs / case cannot be executed</text><text x="284" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture case identity, current state and actual observation first</text><path d="M590 160V205" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="270" y="205" width="640" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="284" y="231" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Are the required conditions available?</text><text x="284" y="257" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">device / fixture / cable / mode / prior configuration</text><path d="M270 247H180V350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="190" y="235" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">NO</text><rect x="30" y="350" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Missing condition / deferred</text><text x="44" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">missing end-tool fixture</text><text x="44" y="423" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FT cable–port incompatibility</text><text x="44" y="444" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">required external equipment absent</text><path d="M590 290V350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="605" y="325" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">YES</text><rect x="430" y="350" width="700" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Do the written steps match the actual feature?</text><text x="444" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">menu path / object name / prerequisites / expected state</text><path d="M430 400H390V530H190V590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="355" y="520" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">NO</text><rect x="30" y="590" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="616" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Procedure correction</text><text x="44" y="642" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">correct route, terminology and order</text><text x="44" y="663" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">make the expected result observable</text><path d="M780 450V505" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="797" y="483" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">YES</text><rect x="430" y="505" width="700" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="531" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reproduce the actual discrepancy</text><text x="444" y="557" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">central deceleration behavior / configuration save permission</text><text x="444" y="578" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">keep hypotheses distinct from the observed symptom</text><path d="M780 615V680" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="430" y="680" width="700" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Product / environment issue handoff</text><text x="444" y="732" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">conditions + steps + expected / actual → responsible developer</text><text x="444" y="753" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">modification and recheck tracked separately</text><path d="M190 470V500H15V835H590V860" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="825" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">prepare equipment / retry</text><path d="M190 700V800H590V860" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="215" y="790" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">correct procedure / retry</text><path d="M780 780V860" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="430" y="860" width="700" height="55" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="886" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Return to the same test with an explicit changed condition</text></svg>