<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" width="1180" height="1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Training state / editable workspace, run lineage and queue lifecycle</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Training state / editable workspace, run lineage and queue lifecycle</text><rect x="30" y="80" width="1120" height="350" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RESTORE THE SELECTED RUN, NOT THE LAST EDITED WORKSPACE</text><rect x="50" y="140" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Workspace / reusable preset</text><text x="64" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current editable source + mapping</text><text x="64" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">may already contain setup B</text><rect x="430" y="140" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit checkpoint A</text><text x="444" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve selected path</text><text x="444" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">read associated run manifest</text><rect x="810" y="140" width="320" height="115" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="824" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resume A settings</text><text x="824" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">selection / curation / IO / config</text><text x="824" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">workspace B must not override A</text><path d="M750 200H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="755" y="180" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">selected lineage</text><rect x="430" y="305" width="700" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="331" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">No explicit checkpoint selected</text><text x="444" y="357" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">use resume_state.checkpoint_path → corresponding run manifest</text><path d="M1130 342H1140V275H970V255" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="490" width="1120" height="345" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="515" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ACTIVE JOB AND PENDING QUEUE / separate state owners</text><rect x="50" y="555" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="581" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Active A: running</text><text x="64" y="607" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pause → A paused</text><text x="64" y="628" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resume → A running</text><rect x="430" y="555" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="581" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pending B waits</text><text x="444" y="607" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">cancel B → only B removed</text><text x="444" y="628" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">clear pending ≠ erase active A</text><rect x="810" y="555" width="320" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="824" y="581" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop active A</text><text x="824" y="607" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current service promotes B</text><text x="824" y="628" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a global queue shutdown</text><path d="M370 605H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="375" y="586" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">A paused</text><path d="M750 605H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="755" y="586" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">A stopped</text><rect x="50" y="715" width="1080" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="741" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Monitor: current active first; terminal results belong to history</text><text x="64" y="767" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">New preset/reset clears editing state while preserving historical runs.</text><rect x="30" y="900" width="1120" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="926" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">An epoch is not the end of the artifact transaction</text><text x="44" y="952" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">forward/backward → checkpoint → run metadata / resume-state JSON</text><text x="44" y="973" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A non-JSON provider enum can fail after computation. Serialization belongs to the persisted contract.</text></svg>