<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" width="1180" height="1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Demonstration / requirement, executable session and physical review</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Demonstration / requirement, executable session and physical review</text><rect x="25" y="70" width="1130" height="180" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">REQUIREMENT AND IMPLEMENTATION</text><rect x="45" y="115" width="260" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Project contact</text><text x="59" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Requested Replay capability</text><text x="59" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Project requirement</text><rect x="365" y="115" width="250" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="379" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Group leader</text><text x="379" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Convey scope and constraints</text><text x="379" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Discuss implementation</text><rect x="675" y="115" width="460" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="689" y="141" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">My responsibility</text><text x="689" y="167" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Develop Replay + prepare actual robot execution</text><text x="689" y="188" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check source / actual and arm–tool behavior</text><path d="M305 160H365" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M615 160H675" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="310" width="1130" height="450" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="335" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">INTERNAL TESTBED / human checks and backend runtime</text><rect x="45" y="355" width="325" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="381" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Source + attachment match</text><text x="59" y="407" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Choose the raw episode</text><text x="59" y="428" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot / left-right arm / EE ownership</text><text x="59" y="449" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare material and starting state</text><rect x="425" y="355" width="325" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="381" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preflight + initial alignment</text><text x="439" y="407" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read current robot state</text><text x="439" y="428" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reach and settle at recorded start</text><text x="439" y="449" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep playback cursor fixed here</text><rect x="810" y="355" width="325" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="381" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded-time execution</text><text x="824" y="407" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend sends arm and EE targets</text><text x="824" y="428" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause / Resume / Stop intent</text><text x="824" y="449" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Status and sample-index feedback</text><path d="M370 410H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 410H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="810" y="560" width="325" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical observation</text><text x="824" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Left + right concurrent motion</text><text x="824" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Tool open/close and subsequent motion</text><text x="824" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Actual material contact / grasp state</text><text x="824" y="675" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check behavior, not status text alone</text><path d="M970 465V560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="425" y="560" width="325" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">If behavior differs</text><text x="439" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop the execution / review the interval</text><text x="439" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare aligned source and actual</text><text x="439" y="654" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Correct and recheck on hardware</text><text x="439" y="675" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Development verification loop</text><path d="M810 625H750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="757" y="609" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">mismatch</text><path d="M425 625H12V290H905V210" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="500" y="282" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">implementation feedback</text><rect x="25" y="820" width="1130" height="190" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="845" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">REVIEW AND HANDOFF</text><rect x="45" y="865" width="510" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="891" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Five confirmed Replay motions</text><text x="59" y="917" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Straight / Circle / Knot / Ring / Shoveling</text><text x="59" y="938" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Dual NURI execution; original corporate videos stay private</text><rect x="625" y="865" width="510" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="891" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Customer + group leader + colleagues</text><text x="639" y="917" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Review actual robot behavior</text><text x="639" y="938" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Approval of the implemented requirement</text><path d="M1135 625H1165V790H300V865" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="866" y="783" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">physical result</text><path d="M555 915H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>