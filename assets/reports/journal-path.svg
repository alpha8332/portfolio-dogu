<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title"><title id="title">Runtime Log / App-Layer Journal</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8caabb"/></marker></defs><rect width="1000" height="550" fill="#141a1e"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#dbe5eb}.label{fill:#85c9ed;font-size:13px}.detail{fill:#9db0bb;font-size:13px}.head{font-size:17px;font-weight:600}</style><text x="32" y="40" font-size="22" font-weight="600">Runtime Log / App-Layer Journal</text><text x="32" y="98" class="label">EVENT</text><rect x="190" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="100" class="head">Lifecycle routes</text><text x="204" y="154" class="detail">run / pause / resume / stop</text><rect x="450" y="72" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="100" class="head">Snapshot observer</text><text x="464" y="154" class="detail">last_output / last_error only</text><rect x="710" y="72" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="100" class="head">Journal events</text><text x="724" y="154" class="detail">dedupe / major transitions</text><path d="M306 72 V60 H826 V70" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><path d="M685 122 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="238" class="label">WRITE</text><rect x="190" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="240" class="head">One formatter</text><text x="204" y="294" class="detail">time / category / action / fields</text><rect x="450" y="212" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="240" class="head">Write queue + thread</text><text x="464" y="294" class="detail">file I/O outside control path</text><path d="M425 262 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="212" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="240" class="head">Active run log</text><text x="724" y="294" class="detail">append / writer error</text><path d="M685 262 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><text x="32" y="378" class="label">DISPLAY</text><rect x="190" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="204" y="380" class="head">Dedicated log API</text><text x="204" y="434" class="detail">read active persisted lines</text><rect x="450" y="352" width="232" height="100" rx="2" fill="#1b272f" stroke="#597586"/><text x="464" y="380" class="head">Runtime Log panel</text><text x="464" y="434" class="detail">one display source</text><path d="M425 402 H445" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><rect x="710" y="352" width="232" height="100" rx="2" fill="#243e4d" stroke="#597586"/><text x="724" y="380" class="head">Operator diagnosis</text><text x="724" y="434" class="detail">compare same line sequence</text><path d="M685 402 H705" fill="none" stroke="#8caabb" marker-end="url(#arrow)"/><line x1="32" y1="498" x2="968" y2="498" stroke="#34434c"/><text x="32" y="525" class="detail">메모리 event와 file mirror를 만든 후, 최종 UI 조회를 저장 파일 기준으로 정리한 경로다.</text></svg>