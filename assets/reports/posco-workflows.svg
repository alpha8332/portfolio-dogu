<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Ton-Bag / live operation, recording and replay are different paths</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Ton-Bag / live operation, recording and replay are different paths</text><rect x="35" y="80" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare physical task</text><text x="49" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Material / grasp point / reachability</text><text x="49" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera view + robot / EE setup</text><rect x="430" y="80" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Teleoperate</text><text x="444" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator input → robot target</text><text x="444" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe deformation and regrasp</text><rect x="825" y="80" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture episode</text><text x="839" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">State + control + camera records</text><text x="839" y="153" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture clock is not motion onset</text><path d="M345 130H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 130H825" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="280" width="310" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Vision engineering</text><text x="49" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Change ports / cables / profiles</text><text x="49" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check actual image availability</text><rect x="430" y="280" width="310" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Operation support</text><text x="444" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Guide participant / set robot</text><text x="444" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Measure Time and Trial / handle faults</text><rect x="825" y="280" width="310" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded-data inspection</text><text x="839" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Measured pose vs stored target</text><text x="839" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm identity / EE channels / timestamps</text><path d="M190 280V180" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M585 280V180" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M980 180V280" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="825" y="490" width="310" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot Replay</text><text x="839" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial alignment + safety gates</text><text x="839" y="563" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded-time arm / EE dispatch</text><rect x="430" y="490" width="310" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">New actual recording</text><text x="444" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Align active motion intervals</text><text x="444" y="563" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compare left / right q, p and EE events</text><rect x="35" y="490" width="310" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="516" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Review + demonstration</text><text x="49" y="542" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Project requester / group leader</text><text x="49" y="563" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Colleague review of actual motion</text><path d="M980 390V490" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M825 545H740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M430 545H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 595V650H1160V335H1135" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="620" y="642" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Reproduce → change → restart service → record again</text><text x="35" y="715" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">KPI measurements and device-comparison results remain separate experiment records, not inferred from a successful Replay.</text></svg>