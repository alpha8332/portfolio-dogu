<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Diagnostic views / spatial interpretation, time-domain values and persistence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Diagnostic views / spatial interpretation, time-domain values and persistence</text><rect x="30" y="75" width="530" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3D / BODY FRAME AND LOCAL INPUT ANCHORS</text><circle cx="230" cy="245" r="72" fill="none" stroke="#47606e" stroke-width="2"/><circle cx="255" cy="215" r="8" fill="#80d0f5"/><path d="M230 245H340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="256" y="264" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">local pad x</text><path d="M230 245V145" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="245" y="155" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">local pad y</text><path d="M390 320V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="325" y="365" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger × gauge length</text><text x="55" y="408" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Conceptual input anchors follow the device pose.</text><rect x="620" y="75" width="530" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TIME DOMAIN / SELECTED DEVICE</text><rect x="640" y="135" width="490" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">XYZ / velocity / acceleration</text><text x="654" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Unit conversion, derivatives and filters</text><text x="654" y="208" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe motion start, stop and noise amplification</text><rect x="640" y="275" width="490" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="301" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">RPY + input HUD</text><text x="654" y="327" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Quaternion-derived angles / pressed and analog values</text><text x="654" y="348" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Device and role filters choose the current trace</text><rect x="30" y="545" width="1120" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">One debugging question, different observations</text><text x="44" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">3D asks: which direction and orientation? Plot asks: how did the value change over time?</text><text x="44" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CSV/JSONL ask: what was actually stored, for which device and timestamp?</text><path d="M295 435V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 435V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="735" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate visual polish from data interpretation</text><text x="44" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">OBJ orientation offsets are not sensor coordinate conversion. Smoothed curves are not raw measurements.</text><text x="44" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This diagram explains UI responsibilities; no drawn curve is presented as a real experiment.</text><path d="M590 650V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>