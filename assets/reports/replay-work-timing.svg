<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="1180" height="840" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Recorded schedule / cumulative deadlines, pause and dispatch overrun</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded schedule / cumulative deadlines, pause and dispatch overrun</text><rect x="30" y="70" width="1120" height="210" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="95" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SOURCE RELATIVE TIME / illustration only</text><rect x="65" y="135" width="235" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="79" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Source sample 0</text><text x="79" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">τ₀ − τ₀ = scheduled elapsed</text><path d="M300 180H340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="340" y="135" width="235" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="354" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Source sample 1</text><text x="354" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">τ₁ − τ₀ = scheduled elapsed</text><path d="M575 180H615" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="615" y="135" width="235" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="629" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Source sample 2</text><text x="629" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">τ₂ − τ₀ = scheduled elapsed</text><path d="M850 180H890" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="890" y="135" width="235" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="904" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Source sample 3</text><text x="904" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">τ₃ − τ₀ = scheduled elapsed</text><rect x="30" y="340" width="1120" height="320" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="365" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RUNTIME CLOCK / perf_counter, with pause duration excluded</text><rect x="50" y="395" width="300" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dispatch sample k</text><text x="64" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm → EE calls consume time</text><text x="64" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Update processed source position</text><rect x="430" y="395" width="300" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Calculate remaining wait</text><text x="444" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Next source deadline</text><text x="444" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">minus actual active elapsed</text><rect x="810" y="395" width="320" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Wait or continue</text><text x="824" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">remaining &gt; 0 → interruptible wait</text><text x="824" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">remaining ≤ 0 → no extra sleep</text><path d="M350 448H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 448H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 500V585H200V500" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="440" y="575" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next source sample; no skip-to-latest rule</text><rect x="30" y="720" width="1120" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause shifts the origin; velocity ratio changes motion parameters</text><text x="44" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Timestamp schedule is not divided by velocity ratio. A late command may still make the robot lag; no zero-error timing claim.</text></svg>