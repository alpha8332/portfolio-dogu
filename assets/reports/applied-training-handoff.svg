<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 930" width="1180" height="930" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Operator handoff / raw data, reproducible preparation and model contract</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator handoff / raw data, reproducible preparation and model contract</text><rect x="45" y="85" width="1090" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved source: robot-keyed HDF5 + referenced video sidecars</text><text x="59" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep the selected task / episode / robot order and image files together. Preview and numerical streams are different evidence.</text><rect x="25" y="235" width="1130" height="285" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="260" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">NON-DESTRUCTIVE PREPARATION / preserve source, record the selected transformation</text><rect x="45" y="290" width="300" height="165" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Source + curation</text><text x="59" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Select actual episode set</text><text x="59" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Exclude / trim with saved rules</text><text x="59" y="384" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check usable rows and camera order</text><text x="59" y="405" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep raw files unchanged</text><text x="59" y="426" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Readiness reports blockers</text><rect x="425" y="290" width="300" height="165" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preprocessing</text><text x="439" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Trim initial waiting segment</text><text x="439" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Progress / Success tail label</text><text x="439" y="384" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Relative delta / absolute pose</text><text x="439" y="405" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Crop + resize per selected camera</text><text x="439" y="426" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep image and action semantics</text><rect x="805" y="290" width="330" height="165" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot-keyed IO</text><text x="819" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Owner A / owner B separately</text><text x="819" y="363" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm current state → pose action</text><text x="819" y="384" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand feedback ≠ previous command</text><text x="819" y="405" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp / mode / force output</text><text x="819" y="426" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pad mask marks horizon validity</text><path d="M590 175V205H12V370H45" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="210" y="195" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">source selection</text><path d="M345 370H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M725 370H805" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="610" width="510" height="170" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="636" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Training recipe + optimization</text><text x="59" y="662" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT: chunk horizon / CVAE / vision / auxiliary head</text><text x="59" y="683" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DP: observation history / denoising / action steps</text><text x="59" y="704" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Epoch / batch / optimizer are different controls</text><text x="59" y="725" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Workers / seed / clipping affect runtime or reproducibility</text><text x="59" y="746" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Defaults shown in a guide are not a project benchmark</text><rect x="625" y="610" width="510" height="170" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="636" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint and later execution</text><text x="639" y="662" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Retain selected data / preprocess intent / model settings</text><text x="639" y="683" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve robot and EE contract</text><text x="639" y="704" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Load-time compatibility checks against current setup</text><text x="639" y="725" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Verify values, routing and physical behavior separately</text><path d="M970 455V565H300V610" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 700H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="45" y="860" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The usage guide connects configuration, data meaning and expected observations across preparation and later execution.</text></svg>