<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" width="1180" height="830" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Time and Trial / two observations, one work record</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Time and Trial / two observations, one work record</text><rect x="35" y="80" width="1110" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing knot-work record: Time = 210 s, Trial = 3</text><text x="49" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Time reports the recorded work duration. Trial counts the attempts required to reach success.</text><rect x="35" y="225" width="1110" height="230" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="250" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">READING THE ATTEMPT FIELD</text><rect x="65" y="280" width="285" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="79" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Attempt 1</text><text x="79" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task not completed</text><text x="79" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Try again</text><rect x="445" y="280" width="285" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="459" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Attempt 2</text><text x="459" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task not completed</text><text x="459" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Try again</text><rect x="825" y="280" width="285" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="839" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Attempt 3</text><text x="839" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task completed</text><text x="839" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Trial field = 3</text><path d="M350 330H445" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 330H825" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="525" width="500" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="551" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">What is retained</text><text x="49" y="577" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">210 seconds and three attempts</text><text x="49" y="598" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task / input device / operating condition</text><text x="49" y="619" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Time and Trial stay paired</text><text x="49" y="640" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The count is not a participant identifier</text><rect x="625" y="525" width="520" height="150" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="551" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">What cannot be reconstructed from two values</text><text x="639" y="577" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Duration of each individual attempt</text><text x="639" y="598" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Timing of resets or equipment interruptions</text><text x="639" y="619" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A per-attempt mean of 210 / 3 seconds</text><text x="639" y="640" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A device ranking or statistical superiority claim</text><text x="35" y="745" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The example values come from the existing record; the attempt boxes explain the confirmed Trial definition, not separate timestamp logs.</text></svg>