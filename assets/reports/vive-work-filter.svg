<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1060" width="1180" height="1060" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Live Plot / source selection, filtering and state transitions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Live Plot / source selection, filtering and state transitions</text><rect x="30" y="75" width="1120" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Valid selected device payload / default meter domain</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Logger receives the payload before plot processing. Plot converts position/velocity units to mm-based display.</text><rect x="30" y="245" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Position display</text><text x="44" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Component deadband 2 mm → EMA α=0.2</text><text x="44" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Filtered position used by finite-difference fallback</text><text x="44" y="339" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Deadband is around coordinate zero</text><rect x="620" y="245" width="530" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Velocity source selection</text><text x="634" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller vel_mps available → use it ×1000</text><text x="634" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Otherwise → difference filtered position / Δt</text><text x="634" y="339" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">First sample or Δt≤10⁻⁴ s: skip derivative</text><path d="M295 160V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 160V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 295H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="562" y="280" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">fallback</text><rect x="30" y="440" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="466" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Velocity / acceleration processing</text><text x="44" y="492" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">a = difference of chosen velocity / Δt. Small components: |v|&lt;5 mm/s →0, |a|&lt;80 mm/s² →0.</text><text x="44" y="513" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep source, derivative and display-filter meanings distinct; smoothing adds lag.</text><path d="M885 350V440" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="625" width="530" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">STOP</text><text x="44" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Remain STOP while speed≤15 mm/s</text><text x="44" y="698" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Change to MOVE above move threshold</text><rect x="620" y="625" width="530" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">MOVE</text><text x="634" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Remain MOVE while speed≥8 mm/s</text><text x="634" y="698" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Change to STOP below stop threshold</text><path d="M295 535V625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 535V625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 650H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="572" y="636" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">&gt;15</text><path d="M620 700H560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="572" y="718" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">&lt;8</text><rect x="30" y="815" width="1120" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="841" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hysteresis + minimum state hold</text><text x="44" y="867" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Between 8 and 15 mm/s keep the previous state. Permit another state change after a minimum 0.2 s hold.</text><text x="44" y="888" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This is not a requirement to remain below threshold continuously for 0.2 s.</text><text x="44" y="909" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Position/RPY smoothing changes the display; it does not improve the underlying optical tracking specification.</text><text x="44" y="930" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">All thresholds here are implementation display settings, not measured accuracy or a safety certification.</text><path d="M295 720V815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 720V815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>