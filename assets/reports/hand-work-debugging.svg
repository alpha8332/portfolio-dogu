<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1010" width="1180" height="1010" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Troubleshooting / locate the first boundary that loses meaning</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Troubleshooting / locate the first boundary that loses meaning</text><rect x="30" y="85" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="111" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Recorded state, no arm action</text><text x="44" y="137" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">IDLE Motion Control: feedback exists, teleop command may not.</text><text x="44" y="158" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check raw control.*.teleop_command before choosing outputs.</text><rect x="30" y="245" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2. Schema exists, mapping UI empty</text><text x="44" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend keys exist; frontend key filter omitted hand keys.</text><text x="44" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Extend observation / previous-command / action groups.</text><rect x="30" y="405" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="431" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3. Start Training → 24 versus 60</text><text x="44" y="457" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Task pose decode retained arm prefix and discarded hand tail.</text><text x="44" y="478" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect pre-loss tensors, restore only pose and append tail.</text><rect x="30" y="565" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="591" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4. Checkpoint loads, hand input missing</text><text x="44" y="617" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Telemetry assembly and hand-key preprocessor both incomplete.</text><text x="44" y="638" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Supply canonical live hand fields and validate required shapes.</text><rect x="30" y="725" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="751" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">5. Replay works, mode training fails</text><text x="44" y="777" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay skips unspecified mode; old conversion rejected it.</text><text x="44" y="798" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve known mode; treat unknown as no explicit change.</text><text x="30" y="955" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Each row is a different incident. Diagnose raw values, canonical fields, tensors and live hardware routes separately.</text></svg>