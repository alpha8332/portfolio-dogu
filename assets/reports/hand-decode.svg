<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" width="1180" height="790" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">ACT mixed output / preserve non-pose tail while decoding rotation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT mixed output / preserve non-pose tail while decoding rotation</text><text x="30" y="90" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">Model action head / 54 values</text><rect x="30" y="115" width="97" height="75" fill="#18232a" stroke="#80d0f5"/><text x="42" y="143" fill="#80d0f5" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">6</text><text x="42" y="171" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">positions</text><rect x="132" y="115" width="199" height="75" fill="#18232a" stroke="#80d0f5"/><text x="144" y="143" fill="#80d0f5" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">12</text><text x="144" y="171" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">2 × rotation-6D</text><rect x="336" y="115" width="607" height="75" fill="#18232a" stroke="#eab67e"/><text x="348" y="143" fill="#eab67e" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">36</text><text x="348" y="171" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">left + right hand joints</text><text x="30" y="340" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">Decoded / 60 values</text><rect x="30" y="365" width="97" height="75" fill="#18232a" stroke="#80d0f5"/><text x="42" y="393" fill="#80d0f5" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">6</text><text x="42" y="421" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">positions</text><rect x="132" y="365" width="301" height="75" fill="#18232a" stroke="#80d0f5"/><text x="144" y="393" fill="#80d0f5" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">18</text><text x="144" y="421" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">2 × 3×3 matrices</text><rect x="438" y="365" width="607" height="75" fill="#18232a" stroke="#eab67e"/><text x="450" y="393" fill="#eab67e" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">36</text><text x="450" y="421" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">same hand tail</text><text x="30" y="585" fill="#e1eaf0" font-size="19" font-family="Segoe UI,Malgun Gothic,sans-serif">Training target / 60 values</text><rect x="30" y="610" width="97" height="75" fill="#18232a" stroke="#80d0f5"/><text x="42" y="638" fill="#80d0f5" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">6</text><text x="42" y="666" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">positions</text><rect x="132" y="610" width="301" height="75" fill="#18232a" stroke="#80d0f5"/><text x="144" y="638" fill="#80d0f5" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">18</text><text x="144" y="666" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">rotation matrices</text><rect x="438" y="610" width="607" height="75" fill="#18232a" stroke="#eab67e"/><text x="450" y="638" fill="#eab67e" font-size="20" font-family="Segoe UI,Malgun Gothic,sans-serif">36</text><text x="450" y="666" fill="#9eb2bf" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">hand joints</text><rect x="50" y="230" width="430" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Decode only the pose prefix</text><text x="64" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">6D basis vectors → orthonormal 3×3 rotation</text><rect x="680" y="230" width="450" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="694" y="256" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Copy the non-pose tail unchanged</text><text x="694" y="282" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">slice head[..., pose_width:] before rebuilding</text><path d="M233 190V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M735 190V230" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M265 295V340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M905 295V340" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 440V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="590" y="492" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">compare complete prediction and target</text><rect x="30" y="510" width="390" height="45" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Old failure: arm-only 24 ≠ target 60</text><text x="30" y="735" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">54 → 60 is a representation conversion, not extra robot DOF. The bug was loss of 36 hand values, not the 6-value expansion.</text></svg>