<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Button edges / independent of motion reference and base pose</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Button edges / independent of motion reference and base pose</text><rect x="60" y="105" width="235" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="74" y="131" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">pressed = True</text><text x="74" y="157" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CALL</text><path d="M295 155H325" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="325" y="105" width="235" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="339" y="131" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">pressed = True</text><text x="339" y="157" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">hold: no call</text><path d="M560 155H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="590" y="105" width="235" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="604" y="131" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">pressed = False</text><text x="604" y="157" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">release: no call</text><path d="M825 155H855" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="855" y="105" width="235" height="100" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="869" y="131" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">pressed = True</text><text x="869" y="157" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CALL</text><text x="55" y="260" fill="#e1eaf0" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">pressed[k] AND NOT pressed[k−1]  →  two calls, not three</text><rect x="30" y="325" width="540" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="350" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TeleT / motion path</text><rect x="50" y="385" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="411" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read button edge before pose dependency</text><text x="64" y="437" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">button can dispatch even without robot base pose</text><rect x="50" y="535" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Then evaluate motion + gripper</text><text x="64" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose validity / gate / reference / owned command</text><path d="M300 480V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="610" y="325" width="540" height="355" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="350" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Outside TeleT / button-only polling</text><rect x="630" y="385" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="411" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Connected + focused + hand + profile</text><text x="644" y="437" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">read primary / secondary and local previous state</text><rect x="630" y="535" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="561" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Request permitted mode transition</text><text x="644" y="587" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no motion target or gripper command in this lane</text><path d="M880 480V535" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="730" width="1120" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="756" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve button previous-state across motion cleanup</text><text x="44" y="782" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Otherwise each Idle polling tick could treat a held button as a new press.</text></svg>