<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 930" width="1180" height="930" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Robot mode and episode lifecycle / separate state dimensions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot mode and episode lifecycle / separate state dimensions</text><rect x="25" y="65" width="1130" height="235" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MODE READINESS / all participants, not just the current focus</text><rect x="45" y="110" width="300" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot A</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Registered / live state readable</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mapped input + calibration</text><text x="59" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Target mode ready</text><rect x="425" y="110" width="300" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot B</text><text x="439" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Registered / live state readable</text><text x="439" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Mapped input + calibration</text><text x="439" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Target mode ready</text><rect x="805" y="110" width="330" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Session readiness</text><text x="819" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check A AND B</text><text x="819" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">TeleT / Idle transition scope</text><text x="819" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not infer from one LED or card</text><path d="M345 170H385V260H970V235" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M725 170H805" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="355" width="1130" height="300" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="380" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RECORDING / enabled only after task, plan and required inputs are resolved</text><rect x="45" y="410" width="235" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Task + plan</text><text x="59" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Select / refresh / save</text><text x="59" y="483" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check required streams</text><rect x="345" y="410" width="235" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="359" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recording ON</text><text x="359" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Start capture</text><text x="359" y="483" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One timeline / two owners</text><rect x="645" y="410" width="235" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="659" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Recording PAUSED</text><text x="659" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause capture</text><text x="659" y="483" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resume → ON</text><rect x="945" y="410" width="190" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="959" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stopped</text><text x="959" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop or input fault</text><text x="959" y="483" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Review reason</text><path d="M280 460H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="290" y="443" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Start</text><path d="M580 460H645" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="590" y="443" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause</text><path d="M760 515V560H460V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="570" y="550" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Resume</text><path d="M460 515V615H1040V515" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="650" y="605" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop / required camera lost</text><path d="M760 560V615" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="735" width="510" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Save episode</text><text x="59" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Accept the stopped recording</text><text x="59" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check task / episode / video sidecars</text><text x="59" y="829" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inspect values and ownership before training</text><rect x="625" y="735" width="510" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reject episode</text><text x="639" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Discard this candidate recording</text><text x="639" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recording stopped does not mean data accepted</text><text x="639" y="829" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fix the failed setup before collecting again</text><path d="M1040 515V690H300V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1040 690H880V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="45" y="900" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The drawing explains the operator workflow; it is not a formal exhaustive backend state machine.</text></svg>