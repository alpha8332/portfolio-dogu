<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1100" width="1180" height="1100" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Runtime log / restore baseline, isolate observation, converge on one source</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime log / restore baseline, isolate observation, converge on one source</text><rect x="30" y="75" width="1120" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FIRST ATTEMPT / useful local fixes, unsuccessful overall control behavior</text><rect x="50" y="130" width="320" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Control worker tick</text><text x="64" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">input → infer → robot RPC</text><text x="64" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">log published after blocking work</text><text x="64" y="224" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">new callbacks risk changing behavior</text><rect x="430" y="130" width="320" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Heavy status refresh</text><text x="444" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">cache miss → live RPC fallback</text><text x="444" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">in-flight refresh dropped</text><text x="444" y="224" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">JSON / browser cache issues</text><rect x="810" y="130" width="320" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI symptom</text><text x="824" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">only lifecycle lines visible</text><text x="824" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">late updates or stale panel</text><text x="824" y="224" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">file and UI may use different sources</text><path d="M370 195H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 195H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="400" width="1120" height="470" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="425" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">REBUILT NATIVE JOURNAL / preserve inference and robot control hot path</text><rect x="50" y="460" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">App observer</text><text x="64" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">explicit run/pause/resume/stop</text><text x="64" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">read in-memory snapshots only</text><rect x="430" y="460" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Event list + formatter</text><text x="444" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">service outside shared snapshot</text><text x="444" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">queue writes / isolate IO errors</text><rect x="810" y="460" width="320" height="110" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="824" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Active persisted log</text><text x="824" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">append one event sequence</text><text x="824" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">writer failure does not stop deploy</text><path d="M370 515H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M750 515H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="810" y="680" width="320" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Dedicated log endpoint</text><text x="824" y="732" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">native persisted source first</text><text x="824" y="753" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">memory fallback where needed</text><rect x="430" y="680" width="320" height="110" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="444" y="706" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Runtime log panel</text><text x="444" y="732" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">render the same line sequence</text><text x="444" y="753" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not a competing status-log array</text><path d="M970 570V680" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M810 735H750" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 790V830H970V790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="650" y="822" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">compare file / API / UI sequence</text><text x="55" y="935" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">External runtime logs retain their own authoritative source branch; do not force them into the native journal.</text><text x="35" y="1015" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">The final fix changed which source the UI consumed, not simply how often the UI polled.</text></svg>