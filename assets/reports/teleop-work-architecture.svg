<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1120" width="1180" height="1120" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Teleoperation / input meaning, ownership and feedback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Teleoperation / input meaning, ownership and feedback</text><rect x="25" y="65" width="1130" height="145" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PHYSICAL INPUT + HOST RUNTIME</text><rect x="45" y="110" width="250" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SpaceMouse</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">HID axes + buttons</text><rect x="315" y="110" width="250" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="329" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive / OpenVR</text><text x="329" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose + validity + controls</text><rect x="585" y="110" width="250" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="599" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Quest / Pico</text><text x="599" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">OpenXR pose + action state</text><rect x="855" y="110" width="250" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="869" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Manus SDK</text><text x="869" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">skeleton + ergonomic</text><rect x="25" y="245" width="1130" height="500" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="270" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX / device-data and hardware control</text><rect x="45" y="290" width="1090" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="316" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Registration / robot and arm binding / calibration / sample validity</text><text x="59" y="342" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input role is not robot ownership. Persisted calibration is different from the live activation reference.</text><path d="M170 185V290" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="176" y="231" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">sample</text><path d="M440 185V290" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="446" y="231" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">sample</text><path d="M710 185V290" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="716" y="231" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">sample</text><path d="M980 185V290" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="986" y="231" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">sample</text><rect x="45" y="415" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="441" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Rate resolver</text><text x="59" y="467" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw mask → signed axes → deadzone</text><text x="59" y="488" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">velocity → timestamp integration</text><rect x="420" y="415" width="335" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="441" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Relative-pose resolver</text><text x="434" y="467" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">activation reference + calibrated basis</text><text x="434" y="488" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">relative translation / SO(3) rotation</text><rect x="795" y="415" width="340" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="441" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand retargeting</text><text x="809" y="467" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">wrist-local tips + pair relations</text><text x="809" y="488" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">FK + bounded joint optimization</text><path d="M210 365V415" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 365V415" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M965 365V415" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="575" width="710" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm target / op-state / motion gate</text><text x="59" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">absolute TCP position [mm] + RPY [degree] → Task TeleMove</text><rect x="795" y="575" width="340" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="601" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand target / EE owner</text><text x="809" y="627" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">joint [degree] or grasp command</text><path d="M210 515V575" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 515V575" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M965 515V575" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="790" width="1130" height="145" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="815" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROBOT CONTROLLER + PHYSICAL WORK</text><rect x="45" y="835" width="710" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="861" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm controller → joint motion → TCP interaction</text><text x="59" y="887" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">IK and servo tracking are controller responsibilities</text><rect x="795" y="835" width="340" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="861" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand / gripper → contact</text><text x="809" y="887" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual posture and object state</text><path d="M400 670V835" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="415" y="777" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">task command</text><path d="M965 670V835" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="980" y="777" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">hand command</text><rect x="45" y="990" width="710" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="1016" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Feedback + operator observation</text><text x="59" y="1042" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">measured pose / joints + visual object state; target ≠ measured state</text><rect x="795" y="990" width="340" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="809" y="1016" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Capture / persistent episode</text><text x="809" y="1042" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">time · command · feedback · owner</text><path d="M400 905V990" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="415" y="962" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback</text><path d="M400 670V700H775V1030H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="452" y="723" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">command + sample tick</text><path d="M755 1030H795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="760" y="1015" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">state</text><path d="M45 1030H12V330H45" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="35" y="960" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback loop</text></svg>