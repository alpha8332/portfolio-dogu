<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-labelledby="title"><title id="title">ACT / Preserve Non-Pose Outputs During Rotation Decode</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7397aa"/></marker></defs><rect width="1000" height="530" fill="#141a1e"/><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#dbe5eb}.small{font-size:13px;fill:#8ca2af}.label{font-size:14px;fill:#85c9ed}.heading{font-size:21px;font-weight:600}.line{stroke:#7397aa;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><text x="35" y="40" class="heading">ACT / Preserve Non-Pose Outputs During Rotation Decode</text><text x="40" y="82" class="label">MODEL VECTOR / 54</text><rect x="40" y="100" width="145" height="90" rx="2" fill="#1b272f" stroke="#455d6b"/><text x="56" y="129" font-size="17">position 6</text><rect x="190" y="100" width="270" height="90" rx="2" fill="#1b272f" stroke="#455d6b"/><text x="206" y="129" font-size="17">rotation 6D × 2 = 12</text><rect x="465" y="100" width="430" height="90" rx="2" fill="#253f4e" stroke="#8dc5e0"/><text x="481" y="129" font-size="17">hand joints 36</text><text x="40" y="264" class="label">DECODED VECTOR / 60</text><rect x="40" y="282" width="145" height="90" rx="2" fill="#1b272f" stroke="#455d6b"/><text x="56" y="311" font-size="17">position 6</text><rect x="190" y="282" width="270" height="90" rx="2" fill="#1b272f" stroke="#455d6b"/><text x="206" y="311" font-size="17">matrix 9 × 2 = 18</text><rect x="465" y="282" width="430" height="90" rx="2" fill="#253f4e" stroke="#8dc5e0"/><text x="481" y="311" font-size="17">hand joints 36</text><path class="line" d="M410 195 L410 255"/><text x="445" y="235" class="small">decode pose head + concatenate unchanged tail</text><text x="40" y="422" font-size="17" fill="#efb27e">Failure path: pose head only → 24 values, hand outputs lost</text><line x1="35" y1="481" x2="965" y2="481" stroke="#34434c"/><text x="35" y="505" class="small">해당 혼합 학습 사례의 action vector 구성. 로봇의 관절 DOF나 모든 모델의 고정 출력 크기를 뜻하지 않는다.</text></svg>