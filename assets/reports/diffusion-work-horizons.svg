<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 990" width="1180" height="990" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Time axes / environment steps, action queue and diffusion iterations</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Time axes / environment steps, action queue and diffusion iterations</text><text x="30" y="95" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Example indices only: T_o=2, T_p=6, T_a=3. Default values are configuration choices, not measured rates.</text><rect x="30" y="150" width="1120" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">At environment time t / prepare condition</text><text x="44" y="202" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Paper concept: observations [t−T_o+1 … t]. Local live RGB buffer uses this rolling order after initial-frame repetition.</text><text x="30" y="310" fill="#80d0f5" font-size="18" font-family="Segoe UI,Malgun Gothic,sans-serif">Local predicted action chunk: index 0 starts at dataset sample t</text><rect x="30" y="345" width="170" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[t+0]</text><text x="44" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">execute</text><rect x="218" y="345" width="170" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="232" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[t+1]</text><text x="232" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">execute</text><rect x="406" y="345" width="170" height="75" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="420" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[t+2]</text><text x="420" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">execute</text><rect x="594" y="345" width="170" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="608" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[t+3]</text><text x="608" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not queued</text><rect x="782" y="345" width="170" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="796" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[t+4]</text><text x="796" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not queued</text><rect x="970" y="345" width="170" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="984" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[t+5]</text><text x="984" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not queued</text><path d="M115 420V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M303 420V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M491 420V510" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="510" width="546" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Queue consumption</text><text x="44" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">t → t+1 → t+2</text><text x="44" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No full sampling while queue is non-empty</text><rect x="650" y="510" width="500" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="536" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Next query at t+3</text><text x="664" y="562" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Collect updated condition; generate another chunk</text><text x="664" y="583" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Plans are refreshed at queue refill, not every servo tick</text><path d="M576 560H650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="710" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="736" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Noise level k is a second, internal iteration axis</text><text x="44" y="762" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">One queue refill: k_(S−1) → … → k_0 → clean estimate. S denoising calls generate a chunk, not S robot moves.</text><text x="44" y="783" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Official image policy selects action_pred[T_o−1:T_o−1+T_a]; local policy selects [:T_a] under its own target alignment.</text><text x="30" y="905" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Larger T_a amortizes prediction cost but holds an older plan longer. This diagram does not establish a real-time deadline.</text></svg>