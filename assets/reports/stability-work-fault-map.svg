UI,Malgun Gothic,sans-serif">resolve current owner + mode</text><text x="64" y="864" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">prepare / command / cleanup</text><rect x="430" y="770" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="796" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">App observer + journal</text><text x="444" y="822" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">lifecycle + cached snapshots</text><text x="444" y="843" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">writer queue → persisted source</text><text x="444" y="864" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no new live hardware RPC</text><rect x="810" y="770" width="320" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="796" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator display</text><text x="824" y="822" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">status / log / media cursor</text><text x="824" y="843" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">reflect the correct source</text><text x="824" y="864" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not proof of physical success</text><path d="M970 565V685H210V770" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="430" y="700" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">model / data contract</text><path d="M370 830H430" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="373" y="813" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">observe</text><path d="M750 830H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="760" y="813" fill="#