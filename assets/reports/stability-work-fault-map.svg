<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1100" width="1180" height="1100" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Stabilization / follow data, commands and observations across boundaries</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Stabilization / follow data, commands and observations across boundaries</text><rect x="30" y="75" width="1120" height="260" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">CONFIGURATION AND LIVE CONTROL</text><rect x="50" y="130" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI intent</text><text x="64" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">selection / editing / pending save</text><text x="64" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">not the live robot state</text><rect x="430" y="130" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend contract</text><text x="444" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">registry / session / owner</text><text x="444" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">canonical identity + ordering</text><rect x="810" y="130" width="320" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="156" fill="#e1eaf0" font-size="16" fon