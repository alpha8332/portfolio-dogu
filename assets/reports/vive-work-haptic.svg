<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">MiMicX follow-up / Calibration Start cue on the selected Controller</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX follow-up / Calibration Start cue on the selected Controller</text><rect x="30" y="75" width="1120" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">UI Calibration Start / robot + bound device handle</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Use the existing calibration workflow and device ownership; this is separate from the standalone Collector loop</text><path d="M590 165V250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="250" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="276" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend calibration task → ViveClient transport</text><text x="44" y="302" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve selected Controller → runtime index. A non-Controller target is not pulsed.</text><text x="44" y="323" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Haptic request is a tactile start cue, not confirmation of calibration success or a motion safety gate.</text><path d="M590 350V435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="435" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Haptic start phase</text><text x="44" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Repeat 3999 μs pulse requests for about 3 s</text><text x="44" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Nominal request interval: 0.02 s</text><text x="44" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Device/runtime timing may differ from request cadence</text><rect x="620" y="435" width="530" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="461" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Event meaning</text><text x="634" y="487" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator can notice procedure start</text><text x="634" y="508" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Failure of cue does not prove robot failure</text><text x="634" y="529" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Haptic exception is not an interlock stop</text><path d="M560 490H620" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="655" width="1120" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="681" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Continue calibration workflow</text><text x="44" y="707" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Ensure the start interval, then Home movement → hold → pose measurement and subsequent calibration stages.</text><text x="44" y="728" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Current code pads the initial interval to about 4 s before Home. No claim that every proposed haptic pattern was shipped.</text><text x="44" y="749" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The diagram documents event placement; it is not a measured controller vibration waveform.</text><path d="M295 545V655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 545V655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>