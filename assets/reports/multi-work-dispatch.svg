<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1030" width="1180" height="1030" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Live dispatch / model contract, current session and exact command ownership</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Live dispatch / model contract, current session and exact command ownership</text><rect x="30" y="75" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Loaded model contract</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot_keys / model + joint widths / EE contract</text><text x="44" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Selected observation + action keys / camera_names</text><rect x="620" y="75" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Current resolved session</text><text x="634" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Key→runtime robot / registered model / owned EE</text><text x="634" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Readable live inputs / available camera streams</text><path d="M295 175V245H590V280" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 175V245H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="280" width="1120" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Compatibility gate</text><text x="44" y="332" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Required keys, session mode/count, known model/dimensions and required hand profile/category</text><text x="44" y="353" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Label/id changes and some force capability differences are warnings, not all identical hard blocks</text><path d="M590 380V450" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="450" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="476" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Owner-keyed live observation → preprocess → policy → action decode</text><text x="44" y="502" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot-keyed observation must not enter the legacy fast path simply because there is no hand input</text><path d="M295 545V625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 545V625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="625" width="530" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command A / robot_key A</text><text x="44" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve key/id in current session</text><text x="44" y="698" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Explicit owner unresolved → fail target resolution</text><rect x="620" y="625" width="530" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command B / robot_key B</text><text x="634" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve key/id in current session</text><text x="634" y="698" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No primary-robot substitution for an invalid owner</text><path d="M295 720V795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 720V795" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="795" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="821" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Worker A + owned attachment</text><text x="44" y="847" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm target + Gripper A or Hand A</text><text x="44" y="868" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Payload and result preserve owner</text><rect x="620" y="795" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="634" y="821" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Worker B + owned attachment</text><text x="634" y="847" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm target + Gripper B or Hand B</text><text x="634" y="868" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm-only output emits no EE action</text><path d="M30 845H15V210H1165V125H1150" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="650" y="202" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">A/B readback → live snapshot assembly</text><path d="M1150 845H1165V125H1150" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="30" y="970" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Application dispatch iterates commands. Equal model-step index does not prove simultaneous controller command arrival.</text></svg>