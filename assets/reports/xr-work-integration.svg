<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Deadzone and integration / calculated example, not a measured speed trace</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Deadzone and integration / calculated example, not a measured speed trace</text><rect x="30" y="80" width="540" height="450" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PER-AXIS REMAPPING / d = 0.20</text><path d="M95 440H520" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="400" y="473" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">raw stick s</text><path d="M95 440V140" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="105" y="140" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">u(s)</text><path d="M95 440H175L495 170" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="300" y="260" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">positive half</text><text x="90" y="500" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">0</text><text x="160" y="500" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">0.2</text><text x="475" y="500" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">1.0</text><text x="45" y="565" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">u(0.2) = 0     u(0.6) = 0.5     u(1.0) = 1</text><rect x="610" y="80" width="540" height="450" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="622" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">AXIS MAP + TIME / v = 50 mm/s</text><rect x="630" y="135" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Sample: s = 0.60</text><text x="644" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">u = (0.60 − 0.20) / (1 − 0.20) = 0.50</text><rect x="630" y="285" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="644" y="311" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Select a robot-base axis</text><text x="644" y="337" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">increment = 0.50 × 50 × 0.02 = 0.50 mm</text><path d="M880 230V285" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="635" y="455" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">first / non-increasing time: configured period</text><text x="635" y="488" fill="#9eb2bf" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">increasing time gap: cap at 0.25 s</text><rect x="30" y="635" width="1120" height="140" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="44" y="661" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A is a 3 × 2 axis-selection matrix</text><text x="44" y="687" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Columns are robot-base X, Y, Z unit axes or zero for None.</text><text x="44" y="708" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Two different fully active axes can have speed √2 × v. Mapping both to one axis adds their contributions.</text><text x="44" y="729" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A per-axis speed parameter is not a norm bound on the full Cartesian velocity.</text></svg>