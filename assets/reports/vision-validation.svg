<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Vision / diagnose the first failed boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Vision / diagnose the first failed boundary</text><rect x="35" y="90" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">1. Device enumeration</text><text x="49" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera identity appears</text><rect x="625" y="90" width="510" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="116" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">If this boundary fails</text><text x="639" y="142" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Missing device → cable / power / port / discovery</text><path d="M535 135H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M285 180V220" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="220" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="246" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2. Link negotiation</text><text x="49" y="272" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">USB link / speed is known</text><rect x="625" y="220" width="510" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="246" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">If this boundary fails</text><text x="639" y="272" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">USB 2.x fallback → inspect cable and connection path</text><path d="M535 265H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M285 310V350" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="350" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">3. Profile + simultaneous streams</text><text x="49" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">All selected images keep updating</text><rect x="625" y="350" width="510" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="376" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">If this boundary fails</text><text x="639" y="402" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No Frame / lag → vary load and port distribution</text><path d="M535 395H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M285 440V480" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="480" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="506" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4. Actual application path</text><text x="49" y="532" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX frames and capture are available</text><rect x="625" y="480" width="510" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="506" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">If this boundary fails</text><text x="639" y="532" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Viewer alone cannot prove MiMicX operation</text><path d="M535 525H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="650" width="500" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Later operating condition</text><text x="49" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">6 devices enumerated at SuperSpeed</text><text x="49" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">4 simultaneous RGB outputs at 1280×720 / 30 FPS</text><text x="49" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">D405 ×2 + D435IF ×2 for stable output</text><rect x="625" y="650" width="510" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep earlier configurations separate</text><text x="639" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Lower-load Viewer configurations ≠ this condition</text><text x="639" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial frame installation: D405 ×2 + D435IF ×3</text><text x="639" y="744" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No claim of camera hardware synchronization</text><path d="M285 570V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 570V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="815" fill="#e1eaf0" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observed limits belong to the tested PC / cable / profile / application combination, not to every RealSense installation.</text></svg>