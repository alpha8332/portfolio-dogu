<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Initial alignment / observing a target and maintaining a target are different</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Initial alignment / observing a target and maintaining a target are different</text><text x="350" y="100" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">0.0 s</text><text x="550" y="100" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">0.1 s</text><text x="750" y="100" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">0.2 s</text><text x="950" y="100" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">0.3 s</text><text x="35" y="165" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">ONE-SHOT</text><text x="35" y="200" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Historical failing path</text><rect x="295" y="135" width="180" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="309" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command(q₀)</text><text x="309" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Target sent once</text><rect x="495" y="135" width="180" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="509" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling</text><text x="509" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read q / qdot / state</text><rect x="695" y="135" width="180" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="709" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling</text><text x="709" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read q / qdot / state</text><rect x="895" y="135" width="180" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="909" y="161" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Polling</text><text x="909" y="187" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read q / qdot / state</text><text x="295" y="260" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">A successful request does not establish continued motion to q₀.</text><text x="35" y="365" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">HOLD / PULSE</text><text x="35" y="400" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Working app semantics</text><rect x="295" y="335" width="180" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="309" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command(q₀)</text><text x="309" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same absolute target</text><rect x="495" y="335" width="180" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="509" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command(q₀)</text><text x="509" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same absolute target</text><rect x="695" y="335" width="180" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="709" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command(q₀)</text><text x="709" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same absolute target</text><rect x="895" y="335" width="180" height="80" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="909" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Command(q₀)</text><text x="909" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same absolute target</text><path d="M385 415V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M585 415V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M785 415V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M985 415V475" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="295" y="475" width="780" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="309" y="501" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Readback and arrival check continue alongside target pulses</text><text x="309" y="527" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Pulse cadence ≈ 0.1 s; telemetry loop ≈ 0.05 s</text><text x="309" y="548" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">When q is aligned, stop pulsing and wait for motion-clear / available qdot to settle</text><rect x="30" y="650" width="1120" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Same target, different temporal command semantics</text><text x="44" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Saved Position already maintained an absolute movej target while held. Replay moved that behavior into the backend.</text><text x="44" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">This is an explanatory schedule, not measured packet timing or a universal requirement for every movej API.</text></svg>