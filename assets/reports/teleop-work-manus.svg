<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1130" width="1180" height="1130" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Manus → Tesollo / geometry optimization and command ownership</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Manus → Tesollo / geometry optimization and command ownership</text><rect x="35" y="75" width="475" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Manus input source</text><text x="49" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">skeleton + wrist pose + timestamp + side</text><rect x="655" y="75" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot hand owner / model profile</text><text x="669" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot arm + end-effector + FK + joint limits</text><rect x="35" y="225" width="475" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="251" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Wrist-local conversion</text><text x="49" y="277" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">s_i = R_wᵀ (p_i − p_w)</text><text x="49" y="298" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">remove global hand translation and rotation</text><path d="M270 165V225" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="285" y="201" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">valid source sample</text><rect x="35" y="385" width="475" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="411" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Configured basis + target geometry</text><text x="49" y="437" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fixed Manus→robot rotation + scale β</text><text x="49" y="458" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">wrist-to-tip + fingertip-pair vectors</text><path d="M270 325V385" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="655" y="385" width="490" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="669" y="411" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pinch-aware target construction</text><text x="669" y="437" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">distance threshold → pair target / weight</text><text x="669" y="458" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">thumb contacts and remaining finger separation</text><path d="M510 440H655" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M900 165V385" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="915" y="285" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">robot profile</text><path d="M900 165V340H585V605" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="600" y="363" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">FK model + bounds</text><rect x="35" y="555" width="1110" height="270" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="580" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BOUNDED OPTIMIZATION / q in radians; geometry in meters</text><rect x="55" y="605" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Current q / warm seed</text><text x="69" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">active joint indices</text><text x="69" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fixed joints retained</text><rect x="435" y="605" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="449" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Forward kinematics</text><text x="449" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">fingertip positions y_i(q)</text><text x="449" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Jacobian / residual gradients</text><rect x="815" y="605" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="631" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Cost + optimizer</text><text x="829" y="657" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weighted tip / pair errors</text><text x="829" y="678" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">regularization + joint bounds</text><path d="M355 655H435" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M735 655H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 705V765H205V705" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="365" y="758" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">iterate until convergence / budget; fallback solver on failure</text><path d="M900 495V555" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="915" y="535" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">targets + weights</text><rect x="35" y="900" width="700" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="926" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Output processing → correct robot hand</text><text x="49" y="952" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">radian→degree / bounds / smoothing → target queue → joint command</text><rect x="815" y="900" width="330" height="105" rx="3" fill="#18232a" stroke="#47606e"/><text x="829" y="926" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Tesollo / feedback</text><text x="829" y="952" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">actual joint state</text><text x="829" y="973" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">physical contact</text><path d="M205 825V900" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="220" y="873" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">q*</text><path d="M735 950H815" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M970 1005V1070H55V1005" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="150" y="1061" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">feedback and observed grasp shape are checked separately from solver convergence</text></svg>