<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Imitation learning / demonstration, artifacts and a live feedback loop</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Imitation learning / demonstration, artifacts and a live feedback loop</text><rect x="25" y="65" width="1130" height="245" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DEMONSTRATION / one physical task, synchronized observations and actions</text><rect x="45" y="110" width="245" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator + Vive</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reference / activation</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hand movement + buttons</text><text x="59" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Grasp and release timing</text><rect x="345" y="110" width="325" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="359" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot + end effectors</text><text x="359" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Arm targets / measured state</text><text x="359" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Contact / grasp / material state</text><text x="359" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Two wrists + selected views</text><rect x="755" y="110" width="375" height="130" rx="3" fill="#18232a" stroke="#47606e"/><text x="769" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Raw episode</text><text x="769" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot observations + issued actions</text><text x="769" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera streams / ordering</text><text x="769" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Timestamps and task context</text><path d="M290 175H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="294" y="103" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">commands</text><path d="M670 175H755" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="681" y="155" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">capture</text><path d="M505 240V280H160V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="255" y="270" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">visual observation → operator correction</text><rect x="25" y="350" width="1130" height="250" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="375" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LEARNING / dataset and preprocessing define what the policy can observe</text><rect x="45" y="400" width="300" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Selection + curation</text><text x="59" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep usable demonstrations</text><text x="59" y="473" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Trim / crop / camera selection</text><text x="59" y="494" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Relative action + auxiliary labels</text><text x="59" y="515" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preserve arm and time semantics</text><rect x="425" y="400" width="300" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">ACT training</text><text x="439" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Images + robot state</text><text x="439" y="473" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Predict an action chunk</text><text x="439" y="494" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Optimize on selected data</text><text x="439" y="515" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Loss is not task success</text><rect x="805" y="400" width="325" height="145" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint + contract</text><text x="819" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Weights / normalization</text><text x="819" y="473" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Input and action layout</text><text x="819" y="494" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera order + preprocessing</text><text x="819" y="515" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Dataset and run conditions</text><path d="M945 240V330H12V470H45" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440" y="322" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">raw → training selection</text><path d="M345 470H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M725 470H805" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="25" y="645" width="1130" height="260" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="670" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">ROLLOUT / current scene closes the loop</text><rect x="45" y="695" width="245" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="721" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Current observations</text><text x="59" y="747" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Current camera scene</text><text x="59" y="768" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Current robot state</text><text x="59" y="789" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same input interpretation</text><text x="59" y="810" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check initial setup</text><rect x="345" y="695" width="325" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="359" y="721" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy runtime</text><text x="359" y="747" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Load checkpoint / preprocessing</text><text x="359" y="768" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Predict actions from live inputs</text><text x="359" y="789" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Chunk execution / control settings</text><text x="359" y="810" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Convert to robot commands</text><rect x="755" y="695" width="375" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="769" y="721" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Physical result</text><text x="769" y="747" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Approach → grasp → carry → place</text><text x="769" y="768" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Material / contact / visibility</text><text x="769" y="789" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe failed phase and conditions</text><text x="769" y="810" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Decide what to collect next</text><path d="M970 545V625H505V695" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="680" y="615" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">load artifact</text><path d="M290 760H345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M670 760H755" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="681" y="745" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">commands</text><path d="M945 830V875H160V830" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440" y="866" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">new visual and robot feedback</text><path d="M1130 760H1166V325H160V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="785" y="315" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">revise collection conditions</text><text x="45" y="980" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay consumes a recorded command sequence. Policy rollout consumes current observations and generates new actions.</text></svg>