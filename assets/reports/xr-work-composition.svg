<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1020" width="1180" height="1020" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Pose + jog / extension must preserve the existing target path</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose + jog / extension must preserve the existing target path</text><rect x="30" y="80" width="1120" height="215" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="105" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BEFORE / early return replaces the pose target</text><rect x="50" y="130" width="290" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Controller pose changes</text><text x="64" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">squeeze active</text><text x="64" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tracking sample is available</text><rect x="420" y="130" width="310" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">planar jog branch</text><text x="434" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">neutral stick → base target</text><text x="434" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">early return skips pose update</text><rect x="810" y="130" width="320" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="156" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose motion disappears</text><text x="824" y="182" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">input exists, but its contribution</text><text x="824" y="203" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">does not reach the target</text><path d="M340 180H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M730 180H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="340" width="1120" height="530" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="365" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">AFTER / compose distinct contributions</text><rect x="50" y="395" width="300" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose gate active</text><text x="64" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot reference + XR reference</text><text x="64" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">relative translation / rotation</text><rect x="420" y="395" width="310" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="421" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pose target</text><text x="434" y="447" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position mm + orientation</text><text x="434" y="468" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">calibrated basis conversion</text><path d="M350 450H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="50" y="600" width="300" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="626" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Thumbstick axis mapping</text><text x="64" y="652" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">deadzone → base-axis velocity</text><text x="64" y="673" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">accumulated offset in mm</text><rect x="420" y="600" width="310" height="110" rx="3" fill="#18232a" stroke="#47606e"/><text x="434" y="626" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stick-only path in TeleT</text><text x="434" y="652" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">use current robot pose as base</text><text x="434" y="673" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no squeeze required for jog</text><path d="M350 655H420" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="810" y="495" width="320" height="140" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="824" y="521" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Final target</text><text x="824" y="547" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_target = p_pose + offset</text><text x="824" y="568" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">pose rotation is retained</text><text x="824" y="589" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">command only in motion path</text><path d="M730 450H770V530H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="738" y="433" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">pose</text><path d="M730 655H770V600H810" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="738" y="687" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">offset</text><text x="55" y="820" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Neutral stick must not suppress pose. A valid button event does not need to construct a motion target.</text><text x="35" y="950" fill="#e1eaf0" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Motion reference, accumulated jog and button-edge state have different lifetimes.</text></svg>