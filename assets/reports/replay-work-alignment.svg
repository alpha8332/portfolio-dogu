<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1100" width="1180" height="1100" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Safe Logic / feedback gate, same-target pulse and bounded failure handling</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Safe Logic / feedback gate, same-target pulse and bounded failure handling</text><rect x="30" y="75" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Resolve first usable start target</text><text x="44" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prefer recorded q; task pose only when q is unavailable</text><text x="44" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Read source first; do not advance the replay timeline</text><rect x="650" y="75" width="500" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="101" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare idle / drain when required</text><text x="664" y="127" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Clear conflicting work; wait for controller readiness</text><text x="664" y="148" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Do not enter task replay while alignment is active</text><path d="M530 120H650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="650" y="245" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="271" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Issue absolute initial move</text><text x="664" y="297" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Use shared Saved Position motion dispatch semantics</text><text x="664" y="318" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observe actual motion start; bounded retries if not started</text><path d="M900 165V245" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="410" width="500" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Read worker control snapshot</text><text x="44" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prefer recent cache; refresh when necessary</text><text x="44" y="483" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Project current q and qdot to recorded robot segments</text><text x="44" y="504" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Compute max position error / available velocity</text><path d="M900 340V375H280V410" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="650" y="410" width="500" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="436" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Arrival + settle gate</text><text x="664" y="462" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Position aligned AND no busy motion</text><text x="664" y="483" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Available qdot sufficiently small; stable for 0.25 s</text><text x="664" y="504" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Unavailable optional fields follow compatibility rules</text><path d="M530 468H650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="650" y="625" width="500" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="651" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Not ready yet</text><text x="664" y="677" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If q not aligned: keep same q₀ pulse</text><text x="664" y="698" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">If q aligned: observe settling only</text><text x="664" y="719" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Reset settle timer when conditions break</text><path d="M900 525V625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="915" y="590" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">not yet</text><path d="M650 675H280V525" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="335" y="666" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">read / evaluate again</text><rect x="30" y="800" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="826" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Reached and settled</text><text x="44" y="852" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Return alignment sample index</text><text x="44" y="873" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Now enter recorded execution phase</text><path d="M650 505H590V848H530" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="600" y="770" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">ready</text><rect x="650" y="800" width="500" height="95" rx="3" fill="#18232a" stroke="#47606e"/><text x="664" y="826" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop / timeout / non-retryable failure</text><text x="664" y="852" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Exit alignment; no replay-clock start</text><text x="664" y="873" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cleanup and report failure / stopped state</text><path d="M1150 468H1165V848H1150" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1094" y="766" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">abort</text><text x="30" y="990" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Nominal loop timing is not a servo rate. Pulse stops at positional alignment; settling is checked before running.</text></svg>