<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="1180" height="840" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Replay lifecycle / physical readiness gates the source clock</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay lifecycle / physical readiness gates the source clock</text><rect x="30" y="100" width="250" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">starting</text><text x="44" y="152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">resolve / preflight</text><rect x="410" y="100" width="330" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="424" y="126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">aligning</text><text x="424" y="152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">current_index held / clock inactive</text><rect x="850" y="100" width="300" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="126" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">running</text><text x="864" y="152" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">recorded clock + dispatch</text><rect x="850" y="330" width="300" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">paused</text><text x="864" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">thread alive / stop request</text><rect x="410" y="560" width="330" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="424" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">stopping / cleanup</text><text x="424" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">stop session / attempt Idle</text><rect x="30" y="720" width="330" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">error / stopped</text><text x="44" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">retain error and cleanup result</text><rect x="820" y="720" width="330" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="834" y="746" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">finished</text><text x="834" y="772" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">normal completion</text><path d="M280 142H410" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 142H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="745" y="88" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">all reached + settled</text><path d="M1000 185V330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1010" y="260" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">pause</text><path d="M850 373H790V220H1000V185" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="535" y="236" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">resume; shift clock origin</text><path d="M575 185V560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="590" y="485" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">alignment error / stop</text><path d="M1150 142H1165V602H740" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="955" y="592" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">stop / error / end</text><path d="M575 645V680H195V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M575 680H985V720" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="270" fill="#80d0f5" font-size="17" font-family="Segoe UI,Malgun Gothic,sans-serif">Alignment time is not replay time.</text><text x="30" y="310" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Pause shifts the wall-clock origin;</text><text x="30" y="340" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">it does not skip recorded samples.</text></svg>