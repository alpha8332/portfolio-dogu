<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Calibration Start / tactile cue before the motion procedure</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Calibration Start / tactile cue before the motion procedure</text><rect x="30" y="75" width="1120" height="570" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="100" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SEQUENCE / selected robot and selected Vive handle</text><rect x="70" y="120" width="300" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="84" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Operator / UI</text><path d="M220 195V595" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="410" y="120" width="300" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="424" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Calibration backend</text><path d="M560 195V595" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="790" y="120" width="300" height="65" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="146" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Vive runtime / controller</text><path d="M940 195V595" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M220 235H560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="260" y="226" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">Start calibration</text><path d="M560 295H940" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="600" y="282" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">trigger_haptic(selected handle)</text><rect x="720" y="335" width="390" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="734" y="361" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Start cue: repeated short pulses</text><text x="734" y="387" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">~3 s cue; ~4 s preparation window</text><text x="734" y="408" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">cue failure does not confirm/deny motion readiness</text><path d="M940 420V440H560" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="360" y="465" width="690" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="374" y="491" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Existing calibration procedure</text><text x="374" y="517" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">home → settle → sample origin → axis moves + paired samples</text><text x="374" y="538" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">estimate alignment → SO(3) projection → persist calibration</text><text x="60" y="690" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">My confirmed addition: Calibration Start vibration + device check. The collector and whole Vive control stack are not sole-authored work.</text></svg>