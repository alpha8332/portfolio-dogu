<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" width="1180" height="1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">16D action / model-specific translation into the existing absolute pose contract</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">16D action / model-specific translation into the existing absolute pose contract</text><rect x="35" y="80" width="140" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">0:2</text><text x="49" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper force</text><rect x="195" y="80" width="140" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="209" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">2:4</text><text x="209" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper position</text><rect x="355" y="80" width="380" height="90" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="369" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">4:10</text><text x="369" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LEFT: dpos + rotvec</text><rect x="755" y="80" width="390" height="90" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="769" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">10:16</text><text x="769" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RIGHT: dpos + rotvec</text><text x="35" y="215" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Old wrapper: 22D included torso [16:22]. This segment is absent in the supplied 16D version.</text><rect x="35" y="275" width="530" height="375" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="47" y="300" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LEFT / same tick’s left robot pose</text><rect x="615" y="275" width="530" height="375" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="627" y="300" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RIGHT / same tick’s right robot pose</text><rect x="55" y="330" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Declared model delta</text><text x="69" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Δp in declared length unit / rδ in rad</text><text x="69" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">convert to the current pose’s frame and length unit</text><rect x="55" y="460" width="490" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="69" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Restore an absolute target</text><text x="69" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_target = p_current + Δp</text><text x="69" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_delta = Exp([rδ]×)</text><text x="69" y="554" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_target = R_delta × R_current</text><text x="69" y="575" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RPY uses the existing ZYX convention</text><path d="M300 415V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="635" y="330" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="649" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Declared model delta</text><text x="649" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Δp in declared length unit / rδ in rad</text><text x="649" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">convert to the current pose’s frame and length unit</text><rect x="635" y="460" width="490" height="125" rx="3" fill="#18232a" stroke="#47606e"/><text x="649" y="486" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Restore an absolute target</text><text x="649" y="512" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">p_target = p_current + Δp</text><text x="649" y="533" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_delta = Exp([rδ]×)</text><text x="649" y="554" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">R_target = R_delta × R_current</text><text x="649" y="575" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RPY uses the existing ZYX convention</text><path d="M880 415V460" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M545 170V190H745V250H300V330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M950 170V250H880V330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M105 170V190H15V955H250" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="705" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">gripper targets bypass pose math</text><path d="M265 170V190H15" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="35" y="735" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="49" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Native left action</text><text x="49" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">absolute [x, y, z, roll, pitch, yaw]</text><text x="49" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">position: mm / angles: degree</text><rect x="615" y="735" width="530" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="629" y="761" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Native right action</text><text x="629" y="787" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">same native meaning / separate arm ownership</text><text x="629" y="808" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">no direct SDK call inside adapter</text><path d="M300 585V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 585V735" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="250" y="920" width="680" height="70" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="946" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Output mapping → command builder → backend dispatch gates</text><path d="M300 835V875H590V920" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880 835V875H590" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/></svg>