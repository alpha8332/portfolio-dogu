<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" width="1180" height="1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Temporal data contract / equal shapes can hide different histories</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Temporal data contract / equal shapes can hide different histories</text><rect x="30" y="85" width="530" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="110" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">STANDARD TRAINING LOADER / observed entrypoint</text><rect x="50" y="140" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Sample index t</text><text x="64" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation o_t from one sample</text><text x="64" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Targets a_t … a_(t+T_p−1)</text><text x="64" y="234" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Episode boundary → last action repeat + is_pad</text><rect x="50" y="330" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy coercion for a single observation</text><text x="64" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Repeat snapshot to fit T_o</text><text x="64" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">[o_t, o_t, …]; this is not recovered past data</text><path d="M295 240V330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="620" y="85" width="530" height="360" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="632" y="110" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">LIVE RGB PREPROCESSOR / actual rolling buffer</text><rect x="640" y="140" width="490" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="166" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">First valid frame</text><text x="654" y="192" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Fill T_o slots with first frame copies</text><text x="654" y="213" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">No wait for T_o independently captured frames</text><text x="654" y="234" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Validate missing cameras / order first</text><rect x="640" y="330" width="490" height="85" rx="3" fill="#18232a" stroke="#47606e"/><text x="654" y="356" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Subsequent calls</text><text x="654" y="382" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Append current RGB and companion state</text><text x="654" y="403" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep last T_o in oldest→newest order</text><path d="M885 240V330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="545" width="1120" height="115" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="571" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Already temporal input is another case</text><text x="44" y="597" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">RGB policy accepts B × T_o × … input and preserves that sequence. A helper contract defines stacked multi-camera/history batches.</text><text x="44" y="618" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">The standard TrainingService passes its batch directly to the policy; helper tests alone do not prove the loader supplies true history.</text><text x="44" y="639" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">State-only policy repeats a flattened current observation rather than maintaining a separate rolling sensor history.</text><path d="M295 415V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 415V545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="785" width="1120" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="811" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">What must match before a temporal comparison</text><text x="44" y="837" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Same shape + same camera names are necessary, but not sufficient. Compare source indices, ordering and initial fill convention.</text><text x="44" y="858" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Changing the sampler to supply true history also requires revisiting local target alignment and normalizers.</text><text x="44" y="879" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Keep this as an explicit follow-up; do not label duplicated frames as independently collected observations.</text><text x="30" y="1010" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Indices and repeated values are explanatory examples, not measured camera synchronization results.</text></svg>