<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1000" width="1180" height="1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Replay lifecycle / execution phase is distinct from robot operation mode</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Replay lifecycle / execution phase is distinct from robot operation mode</text><rect x="30" y="80" width="300" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">idle / no active job</text><text x="44" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Start with source + session preflight</text><rect x="425" y="80" width="330" height="75" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="106" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">starting</text><text x="439" y="132" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Prepare worker / idle readiness</text><path d="M330 118H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="336" y="103" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">start accepted</text><rect x="425" y="240" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="266" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">aligning</text><text x="439" y="292" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Hold the recorded initial target</text><text x="439" y="313" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cursor fixed; recorded clock not started</text><path d="M590 155V240" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="425" y="425" width="330" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">running</text><text x="439" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Source clock active; arm + EE dispatch</text><text x="439" y="498" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cursor follows backend status</text><path d="M590 340V425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="620" y="390" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">reached + settled / all robots ready</text><rect x="30" y="425" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">paused</text><text x="44" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Stop motion request; job thread lives</text><text x="44" y="498" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Resume excludes paused duration</text><path d="M425 455H330" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="350" y="442" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">pause</text><path d="M330 500H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="350" y="518" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">resume</text><rect x="850" y="425" width="300" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="451" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">finished</text><text x="864" y="477" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Recorded execution loop completed</text><text x="864" y="498" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot idle cleanup attempted</text><path d="M755 473H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="762" y="460" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">end of source</text><rect x="425" y="650" width="330" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">stopping</text><text x="439" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Set stop event + stop motion request</text><text x="439" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Exit loop and attempt cleanup</text><path d="M590 525V650" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="610" y="604" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">operator stop</text><path d="M425 285H365V695H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="38" y="616" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">stop during setup / alignment</text><path d="M425 118H350V695H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M180 525V695H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="425" y="835" width="330" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="861" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">stopped</text><text x="439" y="887" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Inactive terminal state</text><text x="439" y="908" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Not the same state as initial idle</text><path d="M590 740V835" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="610" y="795" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">cleanup done</text><rect x="850" y="650" width="300" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="864" y="676" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">error</text><text x="864" y="702" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Source / alignment / dispatch failure</text><text x="864" y="723" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Error + cleanup result remain visible</text><path d="M755 285H805V695H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="814" y="600" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">failure</text><path d="M755 118H790V695H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M755 505H820V695H850" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="30" y="965" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">A new Start creates a new job. Terminal status can remain finished/stopped/error while robot mode has returned to idle.</text></svg>