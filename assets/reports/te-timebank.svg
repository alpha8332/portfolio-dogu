<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">Temporal Ensembling / align by target time, not array position</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">Temporal Ensembling / align by target time, not array position</text><text x="35" y="90" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Query time ↓</text><text x="280" y="90" fill="#e1eaf0" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">Absolute execution time →</text><text x="310" y="128" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t+0</text><text x="415" y="128" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t+1</text><text x="520" y="128" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t+2</text><text x="625" y="128" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t+3</text><text x="730" y="128" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t+4</text><text x="835" y="128" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t+5</text><text x="940" y="128" fill="#80d0f5" font-size="15" font-family="Segoe UI,Malgun Gothic,sans-serif">t+6</text><text x="35" y="180" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">query q=t+0</text><rect x="280" y="150" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="294" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[0]</text><rect x="385" y="150" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="399" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[1]</text><rect x="490" y="150" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="504" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[2]</text><rect x="595" y="150" width="92" height="49" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="609" y="176" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[3]</text><text x="35" y="245" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">query q=t+1</text><rect x="385" y="215" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="399" y="241" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[0]</text><rect x="490" y="215" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="504" y="241" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[1]</text><rect x="595" y="215" width="92" height="49" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="609" y="241" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[2]</text><rect x="700" y="215" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="714" y="241" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[3]</text><text x="35" y="310" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">query q=t+2</text><rect x="490" y="280" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="504" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[0]</text><rect x="595" y="280" width="92" height="49" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="609" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[1]</text><rect x="700" y="280" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="714" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[2]</text><rect x="805" y="280" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="306" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[3]</text><text x="35" y="375" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">query q=t+3</text><rect x="595" y="345" width="92" height="49" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="609" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[0]</text><rect x="700" y="345" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="714" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[1]</text><rect x="805" y="345" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[2]</text><rect x="910" y="345" width="92" height="49" rx="3" fill="#18232a" stroke="#47606e"/><text x="924" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">a[3]</text><path d="M641 413V455" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="665" y="443" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">same target t+3</text><rect x="250" y="470" width="490" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="264" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Candidate bank at t+3</text><text x="264" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">query t: a[3] | t+1: a[2] | t+2: a[1] | t+3: a[0]</text><rect x="790" y="470" width="355" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="804" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Channel-aware selection</text><text x="804" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">continuous blend / rotation projection</text><text x="804" y="543" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">event selection → one executed command</text><path d="M740 515H790" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="35" y="620" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Queue drain: query once, consume H steps. TE: fresh query each inference step, retain only overlapping chunks.</text><text x="35" y="650" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">A TE step is an inference-loop step; it is not the robot servo loop and does not imply paper-level control frequency.</text></svg>