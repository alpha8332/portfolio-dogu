<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" width="1180" height="1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">SCDP integration / existing framework and the adapter translation boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">SCDP integration / existing framework and the adapter translation boundary</text><rect x="30" y="65" width="1120" height="160" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">BUNDLE / supplied trained model and its execution dependencies</text><rect x="50" y="110" width="320" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Manifest + environment definition</text><text x="64" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">entrypoint / IO / mapping / device policy</text><rect x="430" y="110" width="320" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="444" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Checkpoint + processors</text><text x="444" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">weights + normalization + model code</text><rect x="810" y="110" width="320" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="824" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Calibration</text><text x="824" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">camera intrinsic + frame relationship</text><rect x="30" y="290" width="535" height="415" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="42" y="315" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">MiMicX BACKEND / owns runtime and device commands</text><rect x="50" y="345" width="495" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Live snapshot + input mapping</text><text x="64" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot pose / joint / gripper + registered camera</text><text x="64" y="418" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">frame packet and timestamps from backend</text><rect x="50" y="560" width="495" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="64" y="586" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Output mapping + command builder</text><text x="64" y="612" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">postprocessed action → native action keys</text><text x="64" y="633" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">finite / length / owner / control-state checks</text><rect x="615" y="290" width="535" height="415" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="627" y="315" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">SIDECAR WORKER / prepared Python environment</text><rect x="635" y="345" width="495" height="90" rx="3" fill="#18232a" stroke="#47606e"/><text x="649" y="371" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy-specific preprocessing</text><text x="649" y="397" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">tensor / image geometry / state history / device</text><rect x="635" y="470" width="495" height="80" rx="3" fill="#18232a" stroke="#47606e"/><text x="649" y="496" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SCDP trained policy</text><text x="649" y="522" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">infer → checkpoint postprocessor</text><rect x="635" y="585" width="495" height="90" rx="3" fill="#18232a" stroke="#80d0f5"/><text x="649" y="611" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Adapter / my compatibility change</text><text x="649" y="637" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">16D split + rotvec delta → absolute pose6</text><text x="649" y="658" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">remove obsolete torso mapping</text><path d="M545 390H635" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="566" y="377" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">inputs</text><path d="M885 435V470" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M885 550V585" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M635 630H545" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="552" y="684" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">translated output</text><path d="M210 200V260H1165V330H885V345" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="400" y="250" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">inspect / prepare / load dependencies</text><rect x="30" y="780" width="535" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="44" y="806" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Backend dispatch / explicit authority</text><text x="44" y="832" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Preview only OR Task Teleop + current mode</text><text x="44" y="853" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">robot adapter / SDK → actual device command</text><path d="M295 660V780" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="615" y="780" width="535" height="100" rx="3" fill="#18232a" stroke="#47606e"/><text x="629" y="806" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Observation + execution diagnostics</text><text x="629" y="832" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">raw output / mapped action / converted command</text><text x="629" y="853" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">input age + runtime timing + actual robot state</text><path d="M565 830H615" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="575" y="816" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">status</text><path d="M295 880V910H15V390H50" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="30" y="749" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">next observation</text><text x="35" y="950" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Policy and adapter do not open robot SDK clients. Backend resolves live state and command ownership.</text><text x="35" y="985" fill="#eab67e" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Environment hash ≠ checkpoint-content hash ≠ bundle selection identity.</text><text x="35" y="1020" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Research-team policy design / training are separate from the author’s adapter implementation and robot verification.</text></svg>