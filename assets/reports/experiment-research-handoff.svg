ill="#18232a" stroke="#47606e"/><text x="439" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">SCDP model and training</text><text x="439" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Multi-scale image features</text><text x="439" y="473" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Projected end-effector anchors</text><text x="439" y="494" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Spatially conditioned denoising</text><rect x="805" y="400" width="330" height="120" rx="3" fill="#18232a" stroke="#47606e"/><text x="819" y="426" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Trained model</text><text x="819" y="452" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Research-team learning and evaluation</text><text x="819" y="473" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Model artifacts supplied for execution</text><text x="819" y="494" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Paper results stay with the research</text><path d="M970 245V325H12V460H45" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440" y="320" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">data + interpretation</text><path d="M375 460H425" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M755 460H805" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45" y="660" width="510" height="170" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Moving head camera / coordinate contract</text><text x="59" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">T[B←C] = T[B←H] · T[H←C]</text><text x="59" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera mount fixed to head</text><text x="59" y="754" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Head pose changes camera-to-base transform</text><text x="59" y="775" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Image resolution / preprocessing affect pixel coordinates</text><rect x="625" y="660" width="510" height="170" rx="3" fill="#18232a" stroke="#47606e"/><text x="639" y="686" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Separate rollout integration</text><text x="639" y="712" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Receive trained artifacts, not retrain the paper</text><text x="639" y="733" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Adapt live observations and model output</text><text x="639" y="754" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Convert relative pose / rotation to robot commands</text><text x="639" y="775" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Check execution in MiMicX</text><path d="M970 520V660" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="980" y="610" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">trained-policy handoff</text><path d="M555 745H625" fill="none" stroke="#80d0f5" stroke-width="1.7" marker-end="url(#arrow)"/><text x="560" y="640" fill="#80d0f5" font-size="13" font-family="Segoe UI,Malgun Gothic,sans-serif">interpretation</text><text x="45" y="895" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Original explanatory diagram. Local setup values, raw robot code, internal photographs and private videos are omitted.</text></svg>