<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 940" width="1180" height="940" style="max-width:100%;height:auto" role="img" aria-labelledby="title"><title id="title">SCDP collaboration / demonstrations, coordinate meaning and trained-policy handoff</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#80d0f5"/></marker></defs><rect width="100%" height="100%" fill="#101619"/><text x="28" y="35" fill="#e1eaf0" font-size="22" font-family="Segoe UI,Malgun Gothic,sans-serif">SCDP collaboration / demonstrations, coordinate meaning and trained-policy handoff</text><rect x="25" y="65" width="1130" height="240" rx="5" fill="none" stroke="#47606e" stroke-dasharray="5 4"/><text x="37" y="90" fill="#80d0f5" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DATA COLLECTION AND INTERPRETATION / author responsibilities</text><rect x="45" y="110" width="330" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="59" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Teleoperation demonstrations</text><text x="59" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Bin picking / board wiping</text><text x="59" y="183" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Cup dispensing and placement</text><text x="59" y="204" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Robot state + actions + visual context</text><rect x="425" y="110" width="330" height="135" rx="3" fill="#18232a" stroke="#47606e"/><text x="439" y="136" fill="#e1eaf0" font-size="16" font-family="Segoe UI,Malgun Gothic,sans-serif">Camera and robot information</text><text x="439" y="162" fill="#9eb2bf" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">PSF camera parameters</text><text x="439" y="183" fill="#9eb2bf" font-size="14" font-family="